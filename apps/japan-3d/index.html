<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>サッ記マン 3D日本地図</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#9cc8e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* 色・文字・角丸は日本地図タップドリルとそろえる */
:root{
  --brand:#FED003; --on-brand:#282727; --ink:#282727; --paper:#EEEDEA; --muted:#5A5654;
  --pin:#FF4FA3; --peak:#2FA35A;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --r-btn:14px; --r-sheet:20px; --r-pill:999px; --bw:2.5px; --tap:48px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc8e6;color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap;will-change:transform;display:none}
.lb .tx{display:inline-block;transform:translate(-50%,-100%);margin-top:-10px;font:700 13px var(--body);color:var(--ink);
  background:#FFFFFFE6;border:2px solid var(--ink);border-radius:var(--r-pill);padding:2px 9px;line-height:1.3}
.lb .tx small{font-weight:400;color:var(--muted);margin-left:4px}
.lb .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--pin);border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1.5px var(--ink)}
.lb.peak .dot{border-radius:2px;width:0;height:0;left:-8px;top:-12px;background:none;border:0;box-shadow:none;
  border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid var(--peak);filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}
.lb.here .tx{background:var(--brand)}
/* 絶景ビューのうっすらラベル */
.lb.guide .tx{background:#FFFFFF8C;border:1px solid #28272766;font-size:12px;color:#282727}
.lb.guide .dot{display:none}
.lb.guide.geo .tx{background:none;border:0;color:#1E3B52;text-shadow:0 0 3px #fff,0 0 3px #fff;font-weight:700}
.lb.compass .dot{display:none}
.lb.compass .tx{background:none;border:0;font:16px var(--display);color:#fff;text-shadow:0 0 4px #1E3B52,0 0 2px #1E3B52;margin-top:0;transform:translate(-50%,-50%)}
.lb.compass.n .tx{color:#FFDF4A}
/* プレイヤー（サッ記マンの顔） */
#player{position:fixed;left:0;top:0;width:52px;height:68px;pointer-events:none;will-change:transform;display:none}
#player .face{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;background:var(--brand) center/112% no-repeat;
  border:3px solid var(--ink);box-sizing:border-box;box-shadow:0 3px 0 #0003}
#player .stem{position:absolute;left:24px;top:48px;width:4px;height:18px;background:var(--ink);border-radius:2px}
#player.walk .face{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
/* 画面のボタン類 */
.top{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 10px) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.title{font:15px var(--display);color:var(--ink);background:var(--brand);border:var(--bw) solid var(--ink);border-radius:var(--r-pill);padding:6px 14px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.spacer{flex:1}
.ibtn{width:var(--tap);height:var(--tap);border-radius:50%;border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
  font:700 13px var(--body);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ibtn.on{background:var(--brand)}
#compass svg{width:30px;height:30px;transition:none}
.side{position:fixed;right:12px;top:calc(var(--safe-t) + 70px);display:flex;flex-direction:column;gap:10px}
.exag{position:fixed;left:12px;bottom:calc(var(--safe-b) + 14px);background:#FFFFFFE6;border:var(--bw) solid var(--ink);border-radius:var(--r-btn);
  padding:8px 12px 6px;display:flex;flex-direction:column;gap:2px;width:min(200px,46vw);box-sizing:border-box}
.exag b{font:700 13px var(--body);display:flex;justify-content:space-between}
.exag b span{font-family:var(--display);font-weight:400}
.exag input{width:100%;accent-color:#2FA35A;margin:4px 0}
.hint{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%);background:#282727D9;color:#fff;font:700 13px var(--body);
  padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}
.card{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);max-width:440px;margin:0 auto;background:var(--paper);border:var(--bw) solid var(--ink);
  border-radius:var(--r-sheet);padding:14px 16px;box-sizing:border-box;box-shadow:0 5px 0 var(--ink);transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.card.show{transform:none}
.card h2{margin:0;font:22px var(--display);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font:700 13px var(--body);color:var(--muted)}
.card p{margin:6px 0 10px;font-size:14px;line-height:1.6}
.card .row{display:flex;gap:8px}
.btn{flex:1;min-height:var(--tap);border:var(--bw) solid var(--ink);border-radius:var(--r-btn);background:var(--paper);color:var(--ink);font:700 15px var(--body);cursor:pointer}
.btn.primary{background:var(--brand);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:400;font-size:17px}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card .close{position:absolute;right:8px;top:6px;border:0;background:none;font:700 22px var(--body);color:var(--muted);width:40px;height:40px;cursor:pointer}
/* 絶景ビュー */
body.pano .exag, body.pano .side, body.pano .top .title, body.pano #compass{display:none}
.panohud{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 12px);display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
body.pano .panohud{display:flex}
.panohud .where{font:17px var(--display);color:#fff;text-shadow:0 0 6px #1E3B52,0 0 2px #1E3B52}
.panohud .dir{font:700 14px var(--body);color:#fff;background:#1E3B5299;border-radius:var(--r-pill);padding:3px 12px}
.panoback{position:fixed;left:50%;bottom:calc(var(--safe-b) + 16px);transform:translateX(-50%);display:none;width:min(260px,70vw)}
body.pano .panoback{display:block}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#9cc8e6;z-index:10;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading div{font:18px var(--display);color:var(--ink);text-align:center;line-height:1.8}
#loading small{display:block;font:700 13px var(--body);color:var(--muted)}
#err{display:none;position:fixed;left:12px;right:12px;top:40%;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r-sheet);padding:16px;font-size:14px;z-index:11}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="player"><div class="stem"></div><div class="face"></div></div>

<div class="top">
  <a class="ibtn" href="../" aria-label="ホームへ" title="ホームへ">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="title">3D日本地図</div>
  <div class="spacer"></div>
  <button class="ibtn" id="compass" aria-label="北を上にする" title="北を上にする">
    <svg viewBox="0 0 30 30"><path d="M15 3l5 12h-10z" fill="#C23A2B"/><path d="M15 27l-5-12h10z" fill="#9A9693"/><text x="15" y="9.5" font-size="0" /></svg>
  </button>
</div>
<div class="side">
  <button class="ibtn" id="btnFollow" aria-label="サッ記マンについていく" title="サッ記マンについていく">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
  </button>
  <button class="ibtn" id="btnHome" aria-label="日本全体を見る" title="日本全体を見る">全体</button>
  <button class="ibtn" id="btnTilt" aria-label="真上から見る／ななめに見る" title="真上から見る／ななめに見る">真上</button>
</div>
<div class="exag">
  <b>高さの強調 <span id="exagVal">×4.0</span></b>
  <input id="exag" type="range" min="1" max="12" step="0.5" value="4" aria-label="高さの強調">
</div>
<div class="hint" id="hint">タップでそこへ移動／2本指で かたむける・回す</div>

<div class="card" id="card" role="dialog" aria-live="polite">
  <button class="close" id="cardClose" aria-label="とじる">×</button>
  <h2 id="cardName"></h2>
  <p id="cardText"></p>
  <div class="row"><button class="btn primary" id="btnPano">絶景を見る</button></div>
</div>

<div class="panohud"><div class="where" id="panoWhere"></div><div class="dir" id="panoDir"></div></div>
<button class="btn primary panoback" id="btnPanoBack">もどる</button>

<div id="loading"><div>3D日本地図を じゅんび中…<small id="loadMsg">標高データを読みこんでいます</small></div></div>
<div id="err"></div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";

// ───────── 座標系（日本地図タップドリルと同じ投影） ─────────
//   x = (経度-128)×cos36°×60、y = (45.8-緯度)×60 → 3D では X=x、Z=y（北が -Z）
//   1単位 ＝ 緯度1分 ＝ 1.852km。高さ Y = 標高[m] / 1852 × 強調
const K = Math.cos(36 * Math.PI / 180);
const toXZ = (lat, lon) => [(lon - 128) * K * 60, (45.8 - lat) * 60];
const M2U = 1 / 1852;
const GRID = { x0: -30, z0: 0, cell: 0.5, w: 2120, h: 2380 };   // data/heightmap.webp（tools/build_heightmap.py）
const GW = GRID.w * GRID.cell, GH = GRID.h * GRID.cell;

// ───────── テスト用スポット（緯度・経度・標高） ─────────
//   peak: 絶景ビューができる山頂。rank: 1=日本全体でも名前を出す 2=中くらいの拡大から 3=近くでだけ
const SPOTS = [
  { id: "fuji", name: "富士山", kana: "ふじさん", ll: [35.3606, 138.7274], elev: 3776, peak: true, rank: 1, text: "日本でいちばん高い山（3776m）。山梨県と静岡県の境にある火山で、世界文化遺産。" },
  { id: "yari", name: "槍ヶ岳", kana: "やりがたけ", ll: [36.3420, 137.6475], elev: 3180, peak: true, rank: 1, text: "飛驒山脈（北アルプス）の名山。やりの穂先のようにとがった山頂。" },
  { id: "rokko", name: "六甲山", kana: "ろっこうさん", ll: [34.7779, 135.2637], elev: 931, peak: true, rank: 1, text: "神戸の北にそびえる山。大阪湾と神戸・大阪の町を見わたせる。" },
  { id: "odai", name: "大台ヶ原", kana: "おおだいがはら", ll: [34.1853, 136.1089], elev: 1695, peak: true, rank: 2, text: "紀伊山地の山（最高地点は日出ヶ岳）。日本有数の雨の多い所。" },
  { id: "kitadake", name: "北岳", kana: "きただけ", ll: [35.6743, 138.2386], elev: 3193, peak: true, rank: 2, text: "赤石山脈（南アルプス）の山。日本で2番目に高い。" },
  { id: "hotaka", name: "奥穂高岳", kana: "おくほたかだけ", ll: [36.2894, 137.6481], elev: 3190, peak: true, rank: 3, text: "飛驒山脈の山。日本で3番目に高い。" },
  { id: "ontake", name: "御嶽山", kana: "おんたけさん", ll: [35.8928, 137.4803], elev: 3067, peak: true, rank: 3, text: "長野県と岐阜県の境の火山。" },
  { id: "tateyama", name: "立山", kana: "たてやま", ll: [36.5753, 137.6197], elev: 3003, peak: true, rank: 3, text: "富山県の名山。日本三霊山の一つ。" },
  { id: "asama", name: "浅間山", kana: "あさまやま", ll: [36.4064, 138.5228], elev: 2568, peak: true, rank: 3, text: "長野県と群馬県の境の活火山。" },
  { id: "yatsu", name: "八ヶ岳", kana: "やつがたけ", ll: [35.9708, 138.3700], elev: 2899, peak: true, rank: 3, text: "長野県と山梨県にまたがる火山の連なり（最高峰は赤岳）。" },
  { id: "hakusan", name: "白山", kana: "はくさん", ll: [36.1553, 136.7714], elev: 2702, peak: true, rank: 3, text: "石川県と岐阜県の境の火山。日本三霊山の一つ。" },
  { id: "daisen", name: "大山", kana: "だいせん", ll: [35.3711, 133.5461], elev: 1729, peak: true, rank: 2, text: "鳥取県の火山。中国地方でいちばん高い。" },
  { id: "ishizuchi", name: "石鎚山", kana: "いしづちさん", ll: [33.7676, 133.1153], elev: 1982, peak: true, rank: 2, text: "四国山地の山。西日本でいちばん高い。" },
  { id: "aso", name: "阿蘇山", kana: "あそさん", ll: [32.8820, 131.1047], elev: 1592, peak: true, rank: 2, text: "熊本県の火山。世界最大級のカルデラ。" },
  { id: "sakurajima", name: "桜島", kana: "さくらじま", ll: [31.5806, 130.6589], elev: 1117, peak: true, rank: 3, text: "鹿児島湾の火山。大正の噴火で大隅半島と陸続きに。" },
  { id: "miyanoura", name: "宮之浦岳", kana: "みやのうらだけ", ll: [30.3362, 130.5045], elev: 1936, peak: true, rank: 3, text: "屋久島の山。九州でいちばん高い。屋久島は世界自然遺産。" },
  { id: "chokai", name: "鳥海山", kana: "ちょうかいさん", ll: [39.0992, 140.0489], elev: 2236, peak: true, rank: 3, text: "秋田県と山形県の境の火山。「出羽富士」。" },
  { id: "iwaki", name: "岩木山", kana: "いわきさん", ll: [40.6556, 140.3031], elev: 1625, peak: true, rank: 3, text: "青森県の火山。「津軽富士」。" },
  { id: "asahidake", name: "旭岳", kana: "あさひだけ", ll: [43.6633, 142.8544], elev: 2291, peak: true, rank: 2, text: "大雪山の最高峰。北海道でいちばん高い。" },
  { id: "rausu", name: "羅臼岳", kana: "らうすだけ", ll: [44.0758, 145.1222], elev: 1661, peak: true, rank: 3, text: "知床半島の山。知床は世界自然遺産。" },
  { id: "tsukuba", name: "筑波山", kana: "つくばさん", ll: [36.2253, 140.1067], elev: 877, peak: true, rank: 3, text: "茨城県の山。関東平野のどこからでも見える。" },
  // 国宝・世界遺産のピン
  { id: "himeji", name: "姫路城", kana: "ひめじじょう", ll: [34.8394, 134.6939], rank: 2, text: "国宝・世界文化遺産。白い城壁から「白鷺城」とよばれる。" },
  { id: "horyuji", name: "法隆寺", kana: "ほうりゅうじ", ll: [34.6147, 135.7342], rank: 2, text: "国宝・世界文化遺産。現存する世界最古の木造建築。" },
  { id: "shirakawa", name: "白川郷", kana: "しらかわごう", ll: [36.2578, 136.9061], rank: 2, text: "世界文化遺産。合掌造りの集落（岐阜県）。" },
  { id: "nikko", name: "日光東照宮", kana: "にっこうとうしょうぐう", ll: [36.7581, 139.5986], rank: 2, text: "国宝・世界文化遺産。徳川家康をまつる。" },
  { id: "itsukushima", name: "厳島神社", kana: "いつくしまじんじゃ", ll: [34.2959, 132.3198], rank: 2, text: "国宝・世界文化遺産。海の上に立つ大鳥居。" },
  { id: "shuri", name: "首里城", kana: "しゅりじょう", ll: [26.2170, 127.7195], rank: 2, text: "琉球王国の城（跡は世界文化遺産）。" },
];
// 絶景ビューで遠くに見える海・湖・盆地・平野（名前と距離だけ出す）
const GEO = [
  ["駿河湾", 34.85, 138.55], ["相模湾", 35.12, 139.35], ["東京湾", 35.5, 139.85], ["伊勢湾", 34.8, 136.75], ["大阪湾", 34.5, 135.25],
  ["富山湾", 36.85, 137.25], ["若狭湾", 35.65, 135.7], ["琵琶湖", 35.25, 136.08], ["諏訪湖", 36.05, 138.08], ["浜名湖", 34.75, 137.6],
  ["甲府盆地", 35.62, 138.55], ["松本盆地", 36.25, 137.92], ["奈良盆地", 34.6, 135.8], ["京都盆地", 35.0, 135.75], ["関東平野", 36.0, 139.75],
  ["濃尾平野", 35.25, 136.75], ["大阪平野", 34.68, 135.55], ["越後平野", 37.75, 139.05], ["瀬戸内海", 34.2, 133.4], ["太平洋", 33.6, 138.2],
  ["日本海", 38.3, 136.6], ["熊野灘", 33.8, 136.4], ["土佐湾", 33.25, 133.5], ["鹿児島湾", 31.45, 130.65], ["有明海", 32.95, 130.3],
  ["猪苗代湖", 37.48, 140.09], ["十和田湖", 40.46, 140.88], ["石狩平野", 43.15, 141.6], ["十勝平野", 42.85, 143.2], ["仙台平野", 38.25, 140.95],
];

// ───────── 画面の部品 ─────────
const $ = (id) => document.getElementById(id);
const canvas = $("gl");
const fail = (msg) => { $("err").style.display = "block"; $("err").textContent = msg; $("loading").classList.add("done"); };

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
} catch (e) { fail("この端末では 3D 表示（WebGL）が使えないようです。"); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // シェーダーで sRGB の色をそのまま出す

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);

// ───────── 標高データ ─────────
let HM;      // Float32Array 標高[m]（海は海底の深さ）
let MASK;    // Uint8Array 255 陸 / 64 国外 / 128 湖 / 0 海
let exag = 4;

async function loadHeight() {
  const img = new Image();
  img.decoding = "async";
  img.src = "data/heightmap.webp?v=1";
  await img.decode();
  const c = document.createElement("canvas");
  c.width = GRID.w; c.height = GRID.h;
  const g = c.getContext("2d", { willReadFrequently: true, colorSpace: "srgb" });
  g.drawImage(img, 0, 0);
  const px = g.getImageData(0, 0, GRID.w, GRID.h).data;
  const n = GRID.w * GRID.h;
  HM = new Float32Array(n);
  MASK = new Uint8Array(n);
  // GPU 用：R=標高[km]、G=陸1／海0／湖-1／国外2（半精度。線形補間で海岸がなめらかになる）
  const half = new Uint16Array(n * 2);
  const toH = THREE.DataUtils.toHalfFloat;
  const hTab = new Uint16Array(65536);

// ───────── 地形のシェーダー ─────────
const COMMON = /* glsl */`
uniform sampler2D uH; uniform vec2 uGridO; uniform vec2 uGridS; uniform float uExag;
uniform vec3 uFogColor; uniform float uFogDensity;
const float M2U = ${M2U.toFixed(10)};

`;
const terrainUniforms = {
  uH: { value: null }, uGridO: { value: new THREE.Vector2(GRID.x0, GRID.z0) }, uGridS: { value: new THREE.Vector2(GW, GH) },
  uExag: { value: exag }, uFogColor: { value: new THREE.Color(0xcfe3ee) }, uFogDensity: { value: 0.001 },
  uSun: { value: new THREE.Vector3(-0.55, 0.62, -0.56).normalize() }, uSkirt: { value: 1.5 },
};
const terrainMat = new THREE.ShaderMaterial({
  uniforms: terrainUniforms,
  vertexShader: COMMON + /* glsl */`
    attribute float skirt;
    uniform float uSkirt;
    varying vec3 vW; varying vec2 vUv;
    void main(){
      vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
      vec2 uv = (wp.xz - uGridO) / uGridS;
      wp.y = hAtV(uv) * M2U * uExag - skirt * uSkirt;
      vW = wp.xyz; vUv = uv;

    }`,
  fragmentShader: COMMON + /* glsl */`

    varying vec3 vW; varying vec2 vUv;

    vec3 ramp(float h){
      vec3 c = vec3(0.60, 0.76, 0.45);                                   // 平野
      c = mix(c, vec3(0.42, 0.66, 0.36), smoothstep(80.0, 400.0, h));     // 丘
      c = mix(c, vec3(0.20, 0.47, 0.25), smoothstep(400.0, 1100.0, h));   // 山の森
      c = mix(c, vec3(0.32, 0.40, 0.24), smoothstep(1300.0, 1900.0, h));  // 亜高山
      c = mix(c, vec3(0.55, 0.50, 0.43), smoothstep(1900.0, 2500.0, h));  // 岩はだ
      c = mix(c, vec3(0.97, 0.97, 0.99), smoothstep(2700.0, 3200.0, h));  // 雪

    }
    void main(){

      float hx = (hAt(vUv + du) - hAt(vUv - du)) * M2U * uExag / (2.0 * d);
      float hz = (hAt(vUv + dv) - hAt(vUv - dv)) * M2U * uExag / (2.0 * d);
      vec3 n = normalize(vec3(-hx, 1.0, -hz));
      float diff = max(dot(n, uSun), 0.0);

      vec3 V = normalize(cameraPosition - vW);

      vec3 land = ramp(h);

      float edge = min(min(vUv.x, vUv.y), min(1.0 - vUv.x, 1.0 - vUv.y));
      vec3 foreign = mix(vec3(0.13, 0.33, 0.56), vec3(0.80, 0.79, 0.76), smoothstep(0.0, 0.07, edge));
      float fr = smoothstep(1.3, 1.7, m);

      sea = mix(sea, vec3(0.11, 0.30, 0.52), smoothstep(800.0, 4000.0, depth));
      sea = mix(sea, vec3(0.36, 0.66, 0.82), clamp(-m, 0.0, 1.0));

      gl_FragColor = vec4(col, 1.0);
    }`,
});

// 0〜1 の正方形を seg×seg に分けた板（ふちにスカート＝下へのたれさがりをつけて、細かさのちがう板のすき間をかくす）
function chunkGeometry(seg) {
  const pos = [], sk = [], idx = [];
  const N = seg + 1;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { pos.push(i / seg, 0, j / seg); sk.push(0); }
  for (let j = 0; j < seg; j++) for (let i = 0; i < seg; i++) {
    const a = j * N + i, b = a + 1, c = a + N, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const edge = (list) => {
    const base = pos.length / 3;
    list.forEach((k) => { pos.push(pos[k * 3], 0, pos[k * 3 + 2]); sk.push(1); });
    for (let t = 0; t < list.length - 1; t++) {
      const a = list[t], b = list[t + 1], c = base + t, d = base + t + 1;
      idx.push(a, b, c, b, d, c, a, c, b, b, c, d);   // 両面（どちらから見えてもよい）
    }
  };
  const top = [], bot = [], lef = [], rig = [];
  for (let i = 0; i < N; i++) { top.push(i); bot.push(seg * N + i); lef.push(i * N); rig.push(i * N + seg); }
  edge(top); edge(bot); edge(lef); edge(rig);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("skirt", new THREE.Float32BufferAttribute(sk, 1));
  g.setIndex(idx);
  return g;
}

// ───────── 地形のかたまり（チャンク）と細かさの切りかえ ─────────
const CS = 40;                       // 1かたまりの大きさ（約74km）

function buildChunks() {
  for (let cz = 0; cz < NZ; cz++) for (let cx = 0; cx < NX; cx++) {

    let mx = 0, land = false;
    const i0 = Math.floor((x - GRID.x0) / GRID.cell), j0 = Math.floor((z - GRID.z0) / GRID.cell), nn = CS / GRID.cell;
    for (let j = j0; j < Math.min(GRID.h, j0 + nn + 1); j += 2) for (let i = i0; i < Math.min(GRID.w, i0 + nn + 1); i += 2) {
      const k = j * GRID.w + i;

    const m = new THREE.InstancedMesh(chunkGeometry(seg), terrainMat, chunks.length);

function updateChunks() {

  _frustum.setFromProjectionMatrix(_pm);
  const counts = LODS.map(() => 0);
  const cp = camera.position;
  for (const c of chunks) {
    const top = c.maxH * M2U * exag + 0.1;
    _box.min.set(c.x, -2, c.z); _box.max.set(c.x + CS, top, c.z + CS);
    if (!_frustum.intersectsBox(_box)) continue;
    let li;
    if (!c.land) li = c.maxH > 0 ? 4 : 5;
    else {
      const dx = Math.max(c.x - cp.x, 0, cp.x - c.x - CS), dz = Math.max(c.z - cp.z, 0, cp.z - c.z - CS);
      const dy = Math.max(cp.y - top, 0);

}

// 日本のまわりの外海（地形データの外がわ）
function buildOuterSea() {

// 空（カメラについてくる大きな球。地平線は霞の色、上は青）

  fragmentShader: `uniform vec3 uFogColor; varying vec3 vD;

const borderLines = [];
// 県境・海岸線（地形の高さに沿わせる。こまかく分けて、ずれないよう少し浮かせる）
function buildBorders(data) {
  const make = (segs, color, opacity, step) => {
    const pos = [];
    for (const [x1, z1, x2, z2] of segs) {
      const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, z2 - z1) / step));
      for (let k = 0; k < n; k++) {
        const a = k / n, b = (k + 1) / n;
        pos.push(x1 + (x2 - x1) * a, 0, z1 + (z2 - z1) * a, x1 + (x2 - x1) * b, 0, z1 + (z2 - z1) * b);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    const mat = new THREE.ShaderMaterial({
      uniforms: { ...terrainUniforms, uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } },
      vertexShader: COMMON + `varying float vFog;
        void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vec2 uv = (wp.xz - uGridO) / uGridS;
          float dist = length(cameraPosition - wp.xyz);
          wp.y = hAtV(uv) * M2U * uExag + 0.04 + dist * 0.004;

        void main(){ gl_FragColor = vec4(mix(uColor, uFogColor, vFog), uOpacity * (1.0 - vFog * 0.8)); }`,

    const l = new THREE.LineSegments(g, mat);
    l.frustumCulled = false;
    l.renderOrder = 2;

  };
  borderLines.push(make(data.border, 0x3b2f2a, 0.75, 0.5), make(data.coast, 0x2b4a5e, 0.35, 0.8));
}

// ───────── カメラ（鳥瞰） ─────────
// 注目点 T のまわりを、距離 D・方位 yaw（0 で北向き）・仰角 pitch で見下ろす
const cam = { tx: 470, tz: 640, ty: 0, D: 1500, yaw: 0, pitch: 62 * Math.PI / 180 };
const HOME = { tx: 470, tz: 640, D: 1500, yaw: 0, pitch: 62 * Math.PI / 180 };

let zoomAnim = null;                  // { D, sx, sy } ホイールのなめらかなズーム

function camPose(c) {
  const ty = c.ty;
  const cp = Math.cos(c.pitch);
  return {
    pos: new THREE.Vector3(c.tx + c.D * cp * Math.sin(c.yaw), ty + c.D * Math.sin(c.pitch), c.tz + c.D * cp * Math.cos(c.yaw)),
    look: new THREE.Vector3(c.tx, ty, c.tz),

}
function applyBird() {
  cam.ty += (groundY(cam.tx, cam.tz) - cam.ty) * 0.15;
  const { pos, look } = camPose(cam);
  const g = groundY(pos.x, pos.z) + Math.max(0.25, cam.D * 0.03);
  if (pos.y < g) pos.y = g;   // 山にめりこまない
  camera.position.copy(pos);
  camera.up.set(0, 1, 0);
  camera.lookAt(look);
  camera.near = Math.max(0.02, cam.D * 0.01);
  camera.far = Math.max(600, cam.D * 6);
  camera.fov = 45;
  camera.updateProjectionMatrix();
  terrainUniforms.uFogDensity.value = 1 / (cam.D * 3.2 + 60);
}

// 画面の点 → 地面（注目点の高さの水平面）との交点
const _ray = new THREE.Raycaster(), _v2 = new THREE.Vector2();
function screenRay(sx, sy) {
  _v2.set((sx / innerWidth) * 2 - 1, -(sy / innerHeight) * 2 + 1);
  _ray.setFromCamera(_v2, camera);
  return _ray.ray;
}
function planeHit(sx, sy, y) {
  const r = screenRay(sx, sy);

  const t = (y - r.origin.y) / r.direction.y;
  if (t < 0) return null;
  return new THREE.Vector3(r.origin.x + r.direction.x * t, y, r.origin.z + r.direction.z * t);

    const g = groundY(x, z);
    if (y <= g) {

        const mid = (a + b) / 2;
        const yy = o.y + d.y * mid, gg = groundY(o.x + d.x * mid, o.z + d.z * mid);
        if (yy <= gg) b = mid; else a = mid;

    const a = k / n;
    const x = from.x + (to.x - from.x) * a, y = from.y + (to.y - from.y) * a, z = from.z + (to.z - from.z) * a;
    if (groundY(x, z) > y + 0.05) return true;
  }
  return false;
}

// ───────── プレイヤー（サッ記マン） ─────────
const player = { x: 0, z: 0, y: 0, moving: null, spot: null };
const playerEl = $("player");
playerEl.querySelector(".face").style.backgroundImage = "url(../japan-map-quiz/img/qf-egao.webp)";

function startMove(x, z, spot) {
  const dx = x - player.x, dz = z - player.z, dist = Math.hypot(dx, dz);
  hideCard();
  player.spot = null;
  if (dist < 0.05) { arrive(spot); return; }
  const dur = Math.min(5, 0.8 + Math.sqrt(dist) * 0.16);
  player.moving = { x0: player.x, z0: player.z, x1: x, z1: z, t: 0, dur, dist, spot, D0: cam.D };
  playerEl.classList.add("walk");
  follow = true;
  $("btnFollow").classList.add("on");
}
const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function updatePlayer(dt) {
  const mv = player.moving;
  if (mv) {

    const t = Math.min(1, mv.t), e = ease(t);
    player.x = mv.x0 + (mv.x1 - mv.x0) * e;
    player.z = mv.z0 + (mv.z1 - mv.z0) * e;
    if (t >= 1) { player.moving = null; playerEl.classList.remove("walk"); arrive(mv.spot); }
  }
  // 起伏に沿う（少しなめらかに）
  const gy = groundY(player.x, player.z);
  player.y += (gy - player.y) * Math.min(1, dt * 14);
  if (Math.abs(gy - player.y) > 3) player.y = gy;
  // カメラの自動追従
  if (follow && mode === "bird") {
    const k = 1 - Math.exp(-dt * 3.2);
    cam.tx += (player.x - cam.tx) * k;
    cam.tz += (player.z - cam.tz) * k;
    if (mv) {
      // 長い移動のときは、とちゅうで少し引いて全体が見えるように
      const want = Math.max(mv.D0, Math.min(1400, mv.dist * 0.9)) ;
      const bump = Math.sin(Math.PI * Math.min(1, mv.t));
      cam.D += ((mv.D0 + (want - mv.D0) * bump) - cam.D) * k;
    }
  }

function arrive(spot) {
  if (!spot) {
    // 近くのスポットに着いたら、そこに着いたことにする
    let best = null, bd = 2.5;
    for (const s of SPOTS) { const d = Math.hypot(s.x - player.x, s.z - player.z); if (d < bd) { bd = d; best = s; } }

  const lD = Math.log(f.D) + (Math.log(t.D) - Math.log(f.D)) * e;
  if (!follow) { cam.tx = f.tx + (t.tx - f.tx) * e; cam.tz = f.tz + (t.tz - f.tz) * e; }
  cam.D = Math.exp(lD); cam.yaw = f.yaw + (t.yaw - f.yaw) * e; cam.pitch = f.pitch + (t.pitch - f.pitch) * e;
  if (birdFly.t >= 1) birdFly = null;
}

const exagEl = $("exag");
exagEl.addEventListener("input", () => {
  exag = +exagEl.value;
  terrainUniforms.uExag.value = exag;
  terrainUniforms.uSkirt.value = 0.5 + 0.4 * exag;
  $("exagVal").textContent = "×" + exag.toFixed(1);
});

// ───────── ループ ─────────
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
let last = performance.now();
let fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (mode === "bird") {
    updateBirdFly(dt);
    // 慣性（ドラッグ後のすべり）
    if (!gesture && (Math.abs(vel.x) + Math.abs(vel.z) > 1e-3)) {
      cam.tx += vel.x * dt; cam.tz += vel.z * dt;
      const k = Math.exp(-dt * 4.2);
      vel.x *= k; vel.z *= k;
      clampTarget();
    }
    if (zoomAnim) {
      const before = planeHit(zoomAnim.sx, zoomAnim.sy, cam.ty);
      const k = 1 - Math.exp(-dt * 12);
      cam.D = Math.exp(Math.log(cam.D) + (Math.log(zoomAnim.D) - Math.log(cam.D)) * k);
      applyBird();
      const after = planeHit(zoomAnim.sx, zoomAnim.sy, cam.ty);
      if (before && after) { cam.tx += before.x - after.x; cam.tz += before.z - after.z; }
      if (Math.abs(Math.log(cam.D / zoomAnim.D)) < 0.002) zoomAnim = null;
    }
  }
  updatePlayer(dt);
  if (mode === "bird") applyBird();
  else if (mode === "tween") updateTween(dt);
  else if (mode === "pano") applyPano(dt);
  // 絶景ビューでは県境をうすく（地平線が線だらけにならないように）
  const lineK = mode === "bird" ? 1 : 0.35;
  borderLines.forEach((l, i) => { l.material.uniforms.uOpacity.value = (i ? 0.35 : 0.75) * lineK; });
  sky.position.copy(camera.position);
  sky.scale.setScalar(camera.far * 0.9 / 10);
  camera.updateMatrixWorld();
  updateChunks();
  renderer.render(scene, camera);
  updateLabels(dt);
  updatePlayerEl();
  const deg = (mode === "bird" ? cam.yaw : pano.yaw) * 180 / Math.PI;
  $("compass").querySelector("svg").style.transform = `rotate(${deg.toFixed(1)}deg)`;
  // 重い端末では地形を少しあらくする
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 2) { const fps = fpsN / fpsAcc; if (fps < 35 && lodBias > 0.5) lodBias *= 0.85; else if (fps > 55 && lodBias < 1) lodBias = Math.min(1, lodBias / 0.85); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}

// ───────── はじめ ─────────
(async () => {
  try {
    const [tex, borders] = await Promise.all([loadHeight(), fetch("data/borders.json?v=1").then((r) => r.json())]);
    terrainUniforms.uH.value = tex;
    $("loadMsg").textContent = "地形を組み立てています";
    buildChunks();
    buildOuterSea();
    buildBorders(borders);
    // サッ記マンは東京駅のあたりから
    [player.x, player.z] = toXZ(35.681, 139.767);
    player.y = groundY(player.x, player.z);
    resize();
    applyBird();
    requestAnimationFrame((t) => { last = t; frame(t); $("loading").classList.add("done"); window.__j3d.ready = true; });
  } catch (e) {
    console.error(e);
    fail("地図データを読みこめませんでした。通信のよい所で開きなおしてください。");
  }
})();

// 確認テスト用（tools/check3d.js）
window.__j3d = {
  ready: false, SPOTS, cam, player, pano,
  get mode() { return mode; },
  goTo(id) { const s = SPOTS.find((q) => q.id === id); startMove(s.x, s.z, s); },
  warp(id) { const s = SPOTS.find((q) => q.id === id); player.x = s.x; player.z = s.z; player.y = groundY(s.x, s.z); cam.tx = s.x; cam.tz = s.z; arrive(s); },
  enterPano, exitPano,
  setExag(v) { exagEl.value = v; exagEl.dispatchEvent(new Event("input")); },
  tapAt: onTap, terrainHit, groundY,
  get tris() { return renderer.info.render.triangles; },
  setCam(o) { Object.assign(cam, o); birdFly = null; zoomAnim = null; },
};
</script>
</body>
</html>
