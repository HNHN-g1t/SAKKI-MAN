<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>サッ記マン 日本地図タップドリル</title>
<!-- ファビコンは公開サイトの直下（site/ から tools/build_site.py で配置）。?v= はスマホの覚え込み対策で、差し替えたら上げる -->
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="../icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* サッと記憶のサッ記マン：ブランド黄と墨の配色。問題画面は白を基調にし、黄色は選択・正解・主要ボタンだけに使う。
   色はこの3か所（:root／ダーク2か所）の変数でだけ定義する。ほかの場所に色コードを書かない。
   --brand と --on-brand はダークでも変えない（黄色の上の文字は常に墨。白やクリームの上に黄色の文字は置かない） */
:root{
  --brand:#FED003; --on-brand:#282727; --pin:#FF4FA3;
  --tri-edge:#4A4745; --tri-shine:#FFF47E;   /* つぎへの三角：グレーのふちと文字（地は --brand。ダークでも同じ） */
  --ink:#282727; --paper:#EEEDEA; --cream:#F4EBDF; --sea:#D3DDE2; --bg:#E2E1DD;   /* ライトは真っ白をやめ、目にやさしいライトグレー */
  --muted:#5A5654; --line-soft:#C7C4C0; --off:#DAD9D5;
  --ok:#1E7B45; --ng:#C23A2B; --on-strong:#FFFFFF; --ok-soft:#CBEBD6; --ng-soft:#F9D4CD;
  --land-none:#C9CCCF; --tier-a:#F8F7F4; --tier-b:#F4EBDF; --tier-c:#FFF4BF; --rich:#FFE680; --rich2:#FFDA4D;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  /* 文字サイズ7段階・余白6段階・角丸 */
  --fs12:12px; --fs14:14px; --fs16:16px; --fs20:20px; --fs28:28px; --fs40:40px; --fs56:56px;
  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s24:24px; --s32:32px;
  --r-btn:14px; --r-sheet:20px; --r-pill:999px; --bw:2.5px; --tap:48px;
  --marker:.45em;   /* 県名マーカーの太さ（ダークは文字に重ならない細い下線にする） */
  --scrim:#282727B3;   /* 暗証番号の入力のうしろを暗くする幕 */
  --shade:#0000004D; --glow-deep:#E0A800;   /* マスター表示：黄色の文字のグレーの影／王冠の帯の濃い黄 */
  --river:#1F6FB2;     /* 地形コースの川の線 */
  --temp-ink:#C23A2B; --rain-ink:#1F6FB2;   /* 雨温図の「℃」（気温の線と同じ赤）と「mm」（降水量の棒と同じ青）の文字 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#FEF3E6; --paper:#232222; --cream:#3A3632; --sea:#26313A; --bg:#141313;
  --muted:#C8BEB1; --line-soft:#4D4A47; --off:#2B2928;
  --ok:#1E7B45; --ng:#C23A2B; --ok-soft:#24543A; --ng-soft:#6A2A22;
  --land-none:#4B4B4B; --tier-a:#2F2D2B; --tier-b:#3A3632; --tier-c:#4A4227; --rich:#6B5A1C; --rich2:#7A6614;
  --temp-ink:#FF8E80; --rain-ink:#82BDF2; --marker:4px; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#FEF3E6; --paper:#232222; --cream:#3A3632; --sea:#26313A; --bg:#141313;
  --muted:#C8BEB1; --line-soft:#4D4A47; --off:#2B2928;
  --ok:#1E7B45; --ng:#C23A2B; --ok-soft:#24543A; --ng-soft:#6A2A22;
  --land-none:#4B4B4B; --tier-a:#2F2D2B; --tier-b:#3A3632; --tier-c:#4A4227; --rich:#6B5A1C; --rich2:#7A6614;
  --temp-ink:#FF8E80; --rain-ink:#82BDF2; --marker:4px; color-scheme:dark}

/* 時事ニュースクイズと同じ、ふつうのページの作り（body を overflow:hidden で固定しない）。
   iOS 26 の Safari は、固定したページだと上の帯のぼかしが消えないため。高さは .app を 100dvh にして、ページ自体はスクロールしない */
html,body{margin:0;min-height:100%}
/* ページ全体の拡大（ピンチ・ダブルタップ）を止める。拡大できるのは地図だけ（svg#map は touch-action:none で自前で拡大縮小） */
*{touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:var(--fs16);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);max-width:900px;margin:0 auto;background:var(--paper)}

/* 上の帯（白） */
/* 上部バー：画面の上に貼りつける（position:sticky; top:0）。iOS 26 の Safari は、上に貼りついた帯があると
   その帯の色で時計・電池の部分を塗り、ぼかしをかけない（時事ニュースクイズと同じ作り）。中身は safe-area-inset-top の下から置く */
.top{position:sticky;top:0;z-index:4;background:var(--paper);padding-top:calc(env(safe-area-inset-top,0px) + var(--s12));padding-bottom:var(--s12);padding-left:max(var(--s16),env(safe-area-inset-left,0px));padding-right:max(var(--s16),env(safe-area-inset-right,0px));display:flex;align-items:center;gap:var(--s8);min-height:calc(72px + env(safe-area-inset-top,0px));box-sizing:border-box}
.brand{font-family:var(--display);font-size:17px;flex:1;min-width:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;overflow:hidden;text-overflow:ellipsis;font-family:var(--body);font-weight:700;font-size:var(--fs12);color:var(--muted)}
.ask{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
.ask .meta{font-size:var(--fs14);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
/* 上部バーの見出し：1行目＝コース・ステージ名（入りきらなければ…で省略）、2行目＝何問目か／けっか */
.top .ask{gap:0}
.top .meta .nm{display:block;font-size:var(--fs12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta .num{display:block;font-size:var(--fs16);color:var(--ink);white-space:nowrap}
.ask .q{font-family:var(--body);font-weight:700;font-size:var(--fs28);line-height:1.5}
/* ふりがなは漢字の上（ruby） */
.ask .q rt{font-size:min(.42em, calc(var(--fit, 1) * 1em));font-weight:700;color:var(--muted);letter-spacing:0}
.ask .q.long{font-size:var(--fs20)}
.ask .q.shout{font-family:var(--display);font-weight:400;font-size:var(--fs20)}
/* 県名だけ黄色のマーカー線（下半分） */
.ask .q em{font-style:normal;box-shadow:inset 0 calc(-1 * var(--marker)) 0 var(--brand)}
.ask .kana{font-size:var(--fs14);color:var(--muted);font-weight:700}

/* 進み具合：帯のすぐ下に画面幅いっぱい。いまの問題は背を高くする */
.pbar{display:flex;align-items:flex-end;gap:2px;background:var(--paper);padding:0 max(var(--s16),env(safe-area-inset-right,0px)) var(--s8) max(var(--s16),env(safe-area-inset-left,0px));min-height:12px}
.pbar:empty{min-height:0;padding-block:0}   /* 段は残す（消すとグリッドの段がずれる） */
.pbar i{flex:1;height:6px;border-radius:var(--r-pill);background:var(--line-soft)}
.pbar i.now{height:12px;background:var(--brand);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pbar i.ok{background:var(--ok)} .pbar i.ng{background:var(--ng)}
.pbar i.hintd{background:repeating-linear-gradient(135deg,var(--ok) 0 3px,var(--ok-soft) 3px 6px)}

/* ボタンは3種類：主要（黄色＋墨の枠＋真下の影。押すと沈む）／補助（白＋墨の枠、影なし）／最小限（文字だけ） */
.btn,.iconbtn,.chip,.course,.choice{box-sizing:border-box;min-height:var(--tap);border:var(--bw) solid var(--ink);border-radius:var(--r-btn);background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:700;cursor:pointer}
.btn:active,.iconbtn:active,.chip:active,.course:active,.choice:active{transform:translateY(2px)}
.btn.primary,.chip.wide{background:var(--brand);color:var(--on-brand);box-shadow:0 4px 0 var(--ink)}
.btn.primary:active,.chip.wide:active{transform:translateY(4px);box-shadow:none}
.linkbtn{border:0;background:none;color:var(--ink);font:700 var(--fs14) var(--body);text-decoration:underline;cursor:pointer;min-height:var(--tap);padding:0 var(--s4)}
#toTitle{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:0 var(--s8);line-height:1}
#toTitle svg{width:20px;height:20px}
#toTitle span{font-size:var(--fs12);font-weight:700}
.btn.restart{flex:none;align-self:stretch;margin-top:var(--s4)}
.iconbtn{flex:none;min-width:var(--tap);height:var(--tap);padding:0 var(--s12);white-space:nowrap;font-size:var(--fs14);display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
/* 上部バーのボタンは少し小さめ（44px）。見出しの幅をあける */
.top .iconbtn{min-width:44px;height:44px;padding:0 var(--s8);font-size:13px}
.top #toTitle svg{width:18px;height:18px}
.top #toTitle span{font-size:11px}
/* BGM・効果音のボタン：となり合う2つを1組に（あいだのふちを共有） */
.sndpair{display:flex;flex:none}
.top .sndbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1;min-width:46px;padding:0 4px}
.top .sndbtn svg{width:18px;height:18px}
.top .sndbtn span{font-size:10px;font-weight:700;margin-top:2px}
.sndpair .sndbtn:first-child{border-radius:var(--r-btn) 0 0 var(--r-btn)}
.sndpair .sndbtn:last-child{border-radius:0 var(--r-btn) var(--r-btn) 0;margin-left:calc(-1 * var(--bw))}
.sndbtn.off{color:var(--muted);background:var(--off)}
/* DBG：地図の上のまん中にうすく（押すとき・ON のときは少し濃く） */
.dbgdock{position:absolute;left:50%;top:var(--s8);transform:translateX(-50%);z-index:2;display:flex;gap:4px;opacity:.38}
.dbgdock:hover,.dbgdock:has(.dbg-on){opacity:.7}
.dbgdock .dbgbox{display:flex;gap:4px}
.dbgdock .iconbtn{height:26px;min-height:0;min-width:44px;padding:0 8px;font-size:11px;border-width:1.5px;border-radius:8px}
/* ダーク・ライトの切りかえボタン */
.top .themebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1;min-width:46px;padding:0 4px}
.top .themebtn svg{width:18px;height:18px}
.top .themebtn span{font-size:10px;font-weight:700;margin-top:2px}
.iconbtn.dbg-on{background:var(--brand);color:var(--on-brand)}
.dbgbox{display:contents}
/* 上部バーの DBG・テストは小さな札を縦に重ねて、見出しの幅をあける */
.top .dbgbox{display:flex;flex:none;flex-direction:column;justify-content:center;gap:2px}
.top .dbgbox .iconbtn{height:21px;min-height:0;min-width:44px;padding:0 6px;font-size:11px;border-width:2px;border-radius:8px}
/* 暗証番号の入力 */
.pin{position:fixed;inset:0;z-index:10;background:var(--scrim);display:grid;place-items:center;padding:var(--s16)}
.pin-box{background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:var(--r-sheet);padding:var(--s24);width:min(320px,100%);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:var(--s12)}
.pin-box b{font-family:var(--display);font-weight:400;font-size:var(--fs20)}
/* 👑マスターのお祝い：花火（.fx）がこの上に重なる */
.celebrate{z-index:4}
.cele-box{border-color:var(--brand);border-width:4px;box-shadow:0 0 0 4px var(--on-brand),0 0 40px var(--brand);animation:celeIn .5s cubic-bezier(.2,1.6,.4,1) 1}
.cele-crown{font-size:72px;line-height:1;color:var(--brand);filter:drop-shadow(0 0 6px var(--brand)) drop-shadow(0 0 16px var(--brand));animation:celeCrown 1.2s ease-in-out infinite alternate}
.cele-crown .ic{vertical-align:0}
.cele-sub{margin:0;font-weight:700;color:var(--muted);font-size:var(--fs14)}
.pin-box b.cele-title{font-size:var(--fs28);text-align:center;background:var(--brand);color:var(--on-brand);padding:var(--s4) var(--s16);border-radius:var(--r-btn)}
@keyframes celeIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes celeCrown{0%{transform:translateY(0) rotate(-6deg)}100%{transform:translateY(-6px) rotate(6deg)}}
.pin-dots{display:flex;gap:var(--s12)}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:var(--bw) solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s8);width:100%}
.pin-keys .btn{font-size:var(--fs20);min-height:56px}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.course:focus-visible,.choice:focus-visible,.linkbtn:focus-visible,.eye:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* 地図（問題中は海と陸を落ち着かせ、黄色は選択・正解表示の時だけ） */
.mapwrap{position:relative;min-height:0;background:var(--sea)}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
svg#map:active{cursor:grabbing}
.pref{fill:var(--cream);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
/* ホーム：⓪まだの県はグレー → ①地方の3段階（A白・Bクリーム・C淡い黄）→ ②③色が濃くなる（data-lv＝正解したコースの数） */
.explore .pref{fill:var(--land-none)}
.explore .pref:not([data-lv="0"]):is([data-r="1"],[data-r="4"],[data-r="7"]){fill:var(--tier-a)}
.explore .pref:not([data-lv="0"]):is([data-r="2"],[data-r="5"]){fill:var(--tier-b)}
.explore .pref:not([data-lv="0"]):is([data-r="3"],[data-r="6"]){fill:var(--tier-c)}
.explore .pref[data-lv="2"]:is([data-r]){fill:var(--rich)}
.explore .pref:is([data-lv="3"],[data-lv="4"]):is([data-r]){fill:var(--rich2)}
/* 地方の境目（県境の約2.5倍）。ホームだけ表示し、タップは邪魔しない */
.region-line{fill:none;stroke:var(--ink);stroke-width:2.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
svg:not(.explore) .region-line{display:none}
.pref.off{fill:var(--off);stroke-opacity:.35}
/* 状態は色だけに頼らない：選択＝黄色＋墨の太枠／正解の場所＝太枠が3回脈打って残る */
.pref.sel{fill:var(--brand)!important;stroke-width:3px}
.pref.ok{fill:var(--ok-soft)!important}
.pref.miss{fill:var(--ng-soft)!important}
.pref.flash-ok{fill:var(--ok)!important}
.pref.flash-ng{fill:var(--ng)!important}
.pref.reveal{stroke-width:5px;animation:pulse .4s ease-in-out 3}
@keyframes pulse{50%{stroke-width:10px}}
.inset{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;opacity:.8}
/* 地形（山・河川・平野）：問題の対象の図形だけを出す。山地・山脈＝黄の太線、川＝青い線、平野＝黄の面、山＝黄の三角 */
.feat{display:none;pointer-events:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.feat.show{display:inline}
.feat.case{fill:none;stroke:var(--ink);stroke-width:12px}
.feat.range{fill:none;stroke:var(--brand);stroke-width:7px}
.feat.river.case{stroke:var(--paper);stroke-width:8px}
.feat.river{fill:none;stroke:var(--river);stroke-width:4px}
.feat.plain,.feat.peak{fill:var(--brand);stroke:var(--ink);stroke-width:2.5px}
.feat.plain{fill-opacity:.75}
/* 県庁所在地の位置：ピンクの円が光る（画面上で同じ大きさ。apply() で scale をかける） */
.cap-pin{pointer-events:none}
.cap-pin .dot{fill:var(--pin);stroke:#fff;stroke-width:2}
.cap-pin .glow,.cap-pin .glow2{fill:var(--pin);transform-box:fill-box;transform-origin:center}
.cap-pin .glow{opacity:.45;animation:pinGlow 1.6s ease-out infinite}
.cap-pin .glow2{opacity:.25;animation:pinGlow 1.6s ease-out .8s infinite}
@keyframes pinGlow{0%{transform:scale(.4);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.cap-pin .glow,.cap-pin .glow2{animation:none}}
.zoom{cursor:pointer}
.zoom circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
.zoom path{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.zoom:hover circle{fill:var(--brand)}
.zooms-off #zooms,.region-quiz #zooms{display:none}
.labels{pointer-events:none;opacity:0;transition:opacity .12s}
.show-labels .labels{opacity:1}
.labels text{font-family:var(--body);font-weight:700;fill:var(--ink);stroke:var(--cream);stroke-width:3px;paint-order:stroke;vector-effect:non-scaling-stroke;text-anchor:middle;dominant-baseline:central}
.labels text.off{display:none}
.tag{pointer-events:none}
.tag text{font-family:var(--body);font-weight:700;fill:var(--on-strong);text-anchor:middle;dominant-baseline:central}
.tag rect{fill:var(--ng)}

/* 目ボタン：墨の丸に黄色の目。押している間は黄色の丸に墨の目で4px沈む */
.eye{position:absolute;right:calc(var(--s16) + env(safe-area-inset-right,0px));bottom:calc(var(--r-sheet) + var(--s32) + var(--s8));width:64px;height:64px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--on-brand);color:var(--brand);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:none;padding:0}
.eye svg{width:34px;height:34px}
/* 「おしてる間だけ」は押している間だけ、ボタンの上に出す */
.eye.on .cap{display:block}
.eye.on{background:var(--brand);color:var(--on-brand);transform:translateY(4px);box-shadow:none}
.eye .cap{display:none;position:absolute;right:0;bottom:calc(100% + 8px);font-size:var(--fs12);font-weight:700;color:var(--ink);white-space:nowrap;background:var(--paper);border:1.5px solid var(--ink);padding:1px var(--s8);border-radius:var(--r-pill)}
.combo{position:absolute;left:50%;top:var(--s16);transform:translateX(-50%);font-family:var(--display);font-size:var(--fs20);color:var(--on-brand);background:var(--brand);border:var(--bw) solid var(--on-brand);padding:var(--s4) var(--s16);border-radius:var(--r-pill);pointer-events:none}
.combo.pop{animation:pop .3s ease-out 1}
/* 雨温図の札：地図の上に出す。棒＝降水量（川の青）、折れ線＝平均気温（赤） */
.chart{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:min(340px,calc(100% - var(--s32)));box-sizing:border-box;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:var(--r-btn);padding:var(--s8) var(--s8) var(--s4);pointer-events:none;z-index:1}
.chart[hidden]{display:none}
.chart svg{display:block;width:100%;height:auto}
.chart p{margin:0;text-align:center;font-size:var(--fs12);font-weight:700;color:var(--muted)}
/* 雨温図の読みとり：黄色の帯（降水量）・点線の円（気温）・矢印（気温の差）・黄色の下線（年降水量）と、番号つきの説明 */
.chart .cband{fill:var(--brand);fill-opacity:.45}
.chart .cring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.chart .cgap{stroke:var(--ink);stroke-width:2}

// 「県庁」の呼び方：北海道は道庁、京都・大阪は府庁、東京は都庁
const officeOf = name => name === "北海道" ? "道庁" : name === "東京都" ? "都庁" : /府$/.test(name) ? "府庁" : "県庁";
const PREFS = RAW.map(([code,name,kana,r]) => ({

// 東京都は「都庁がある区」として示し、教材の所在地表記「東京」とまぜない

const byCode = c => PREFS[c - 1];
const range = (a,b) => Array.from({length:b-a+1}, (_,i)=>a+i);

/* ---------- 問題の種類（ここに追加していけば分野別に発展できる） ----------
   make(codes) は codes（県コード）にかかわる問題の配列を返す。共通の項目：
     key（記録用。県コードや都市番号）, prefs:[かかわる県コード], text, sub（よみ）, explain
   kind:"tap"    … answers:[正解の県コード]。地図をタップして答える
   kind:"choice" … choices:[[名前, よみ] x4], correct（正解の名前）, focus（地図で示す県） */
const QUIZ_TYPES = {
  prefName: {
    title: "県名タップ", kind: "tap",
    make: codes => codes.map(c => {
      const p = byCode(c);
      return { key: c, prefs: [c], text: `<em>${p.name}</em>はどこ？`, sub: p.kana, answers: [c], explain: capitalLabel(p) };
    })
  },
  capital: {
    title: "県庁所在地", kind: "choice",
    make: codes => codes.map(c => {
      const p = byCode(c), [ans] = CITIES.capitals[c];
      return { key: c, prefs: [c], focus: c, pin: c, sub: c === 13 ? "とうきょうとちょう" : p.kana, choices: CITIES.capitals[c], correct: ans[0],
        text: c === 13 ? `<em>東京都庁</em>がある区は？` : `<em>${p.name}</em>の${p.office}所在地は？`,
        explain: c === 13 ? `東京都庁は ${ans[0]}（${ans[1]}）にあります` : `${p.name}の${p.office}所在地は ${ans[0]}（${ans[1]}）` };
    })
  },
  terrain: {
    title: "山・河川・平野", kind: "choice",
    // area.cat（mount／river／plain）の図形を出題。選択肢は同じ種類からほかに3つ
    make: (codes, area) => TERRAIN.filter(f => !area || !area.cat || f.cat === area.cat).map(f => {
      const pool = shuffle(TERRAIN.filter(g => g.cat === f.cat && g.id !== f.id)).slice(0, 3);
      return { key: f.id, prefs: [f.pref], focus: f.pref, feature: f.id, sub: "", choices: [[f.name, f.kana], ...pool.map(g => [g.name, g.kana])], correct: f.name,
        text: `この<em>${TERRAIN_CATS[f.cat]}</em>の名前は？`, explain: `${f.name}（${f.kana}）` };
    })
  },
  industry: {
    title: "農林水産業・工業", kind: "tap",
    // area.cat（farm／fruit／sea／maker／craft）の問題。地図で答えの都道府県をタップ
    // 出題停止（status:"stop"）の問題は出さない。出題数・完了・👑の判定もこの数で行う
    make: (codes, area) => industryLive().filter(f => (!area || !area.cat || f.cat === area.cat) && codes.includes(f.pref)).map(f => (
      { key: f.id, prefs: [f.pref], text: f.q || INDUSTRY_CATS[f.cat].ask(f.word), sub: f.kana, answers: [f.pref], explain: f.note }))
  },
  climate: {
    title: "気候", kind: "choice",
    // area.cat：zone＝地図で色をつけた地域の気候区分を答える／chart＝雨温図を見てどの都市かを答える
    make: (codes, area) => {
      const cat = area && area.cat;
      const zones = (!cat || cat === "zone") ? CLIMATE_ZONES.map(z => ({ key: "zone:" + z.id, prefs: [z.codes[0]], zone: z.codes, sub: "",
        choices: [[z.name, z.kana], ...shuffle(CLIMATE_ZONES.filter(o => o !== z)).slice(0, 3).map(o => [o.name, o.kana])], correct: z.name,
        text: "色をつけた地域の<em>気候</em>は？", explain: `${z.name}：${z.note}` })) : [];
      const charts = (!cat || cat === "chart") ? CLIMATE_CITIES.map(c => ({ key: "city:" + c.id, prefs: [c.pref], chart: c.id, sub: "",
        choices: [[c.name, c.kana], ...shuffle(CLIMATE_CITIES.filter(o => o !== c)).slice(0, 3).map(o => [o.name, o.kana])], correct: c.name,
        text: "この<em>雨温図</em>はどの都市？", explain: `${c.name}は${zoneOf(c.zone).name}。${zoneOf(c.zone).note}` })) : [];
      return [...zones, ...charts];
    }
  },
  general: {
    title: "総合問題", kind: "choice",
    // 地方ごとに、県庁所在地（4択）・河川など地形（4択）・農林水産業（タップ）・工業と伝統工芸（タップ）をまぜて出す。
    // 毎回その地方の中からえらび直す。key は "cap:県コード" "ter:地形id" "ind:産業id"
    make: (codes, area) => {
      const pick = (arr, k) => shuffle(arr).slice(0, k);
      const cap = pick(codes, 3).flatMap(c => QUIZ_TYPES.capital.make([c])).map(q => Object.assign(q, {key: "cap:" + q.key, kind: "choice"}));
      const ters = QUIZ_TYPES.terrain.make(codes, null).filter(q => codes.includes(q.prefs[0]));
      const ter = [...pick(ters.filter(q => TERRAIN.find(f => f.id === q.key).cat === "river"), 2), ...pick(ters.filter(q => TERRAIN.find(f => f.id === q.key).cat !== "river"), 2)].slice(0, 2)
        .map(q => Object.assign(q, {key: "ter:" + q.key, kind: "choice"}));
      const inds = QUIZ_TYPES.industry.make(codes, null).map(q => Object.assign(q, {cat: industryOf(q.key).cat, key: "ind:" + q.key, kind: "tap"}));
      const agri = pick(inds.filter(q => ["farm", "fruit", "sea"].includes(q.cat)), 2), make = pick(inds.filter(q => ["maker", "craft"].includes(q.cat)), 2);
      return [...cap, ...ter, ...agri, ...make];
    }
  },
  history: {
    title: "歴史の場所", kind: "choice",
    // 時代ステージ（area.cat）の場所を出題。ピンクの光る印の場所が何かを4択。選択肢は同じ種類から（足りなければほかの種類から）
    make: (codes, area) => HISTORY.filter(h => !area || !area.cat || h.era === area.cat).map(h => {
      const same = shuffle(HISTORY.filter(o => o.id !== h.id && o.kind === h.kind)), other = shuffle(HISTORY.filter(o => o.id !== h.id && o.kind !== h.kind));
      const pool = [...same, ...other].slice(0, 3);
      return { key: h.id, prefs: [h.pref], focus: h.pref, pinLL: h.ll, sub: "", choices: [[h.name, h.kana], ...pool.map(o => [o.name, o.kana])], correct: h.name,
        text: HISTORY_KINDS[h.kind], explain: h.note };
    })
  },
  treasure: {
    title: "国宝・世界遺産", kind: "choice",
    // ステージ（area.cat）の場所を出題。光る印の場所が何かを4択。選択肢は同じステージから（足りなければほかから）
    make: (codes, area) => TREASURE.filter(t => !area || !area.cat || t.stage === area.cat).map(t => {
      const same = shuffle(TREASURE.filter(o => o.id !== t.id && o.stage === t.stage)), other = shuffle(TREASURE.filter(o => o.id !== t.id && o.stage !== t.stage));
      const pool = [...same, ...other].slice(0, 3);
      return { key: t.id, prefs: [t.pref], focus: t.pref, pinLL: t.ll, sub: "", choices: [[t.name, t.kana], ...pool.map(o => [o.name, o.kana])], correct: t.name,
        text: TREASURE_STAGES[t.stage].ask, explain: t.note };
    })
  },
  designated: {
    title: "政令指定都市", kind: "tap",
    make: codes => CITIES.designated.map((d, i) => [d, i]).filter(([d]) => codes.includes(d[2])).map(([[name, kana, c], i]) => (
      { key: i, prefs: [c], pinLL: DESIGNATED_LL[name], text: `<em>${name}</em>がある都道府県は？`, sub: kana, answers: [c],
        explain: `${name}（${kana}）は ${byCode(c).name}の政令指定都市` }))
  }
};

/* ---------- 農林水産業・工業（産業）。地図の都道府県をタップして答える ----------
   1問 = 1オブジェクト。毎年の統計更新では year・note・source・url・checked を書きかえ、status で出す／止めるを決める
     id      問題ID（保存データの got/clean/miss のキー。変えない）
     cat     ステージ（INDUSTRY_CATS のキー）
     word    問題のことば（farm/fruit/craft はステージの決まった問い方に入る。sea/maker は問題文そのもの）
     q       問い方を個別に変えるときの問題文（統計年を入れる・指標をかえるなど。なければ word から作る）
     kana    よみ（問題文の下に出る）
     pref    答えの都道府県コード（1〜47。答えは1つだけ）
     note    正解後の解説（確認できた事実だけ書く）
     basis   正解の根拠になる指標
     year    統計の対象年（公表日ではない）
     source  出典の正式名称 ／ url 出典URL ／ checked 最終確認日
     status  "ok"＝確認済み（出題する） "check"＝要確認（出題する。答えは確認済みだが、解説・年次などに確認が残る） "stop"＝出題停止（出題しない）
   答えが1県に決まるものだけ入れる。僅差で入れかわる品目（茶・キャベツ・日本なし・さつまいも・ほたて・真珠など）は入れない */
const INDUSTRY_CATS = {

};
const IND_CHECKED = "2026-11-02";
const SRC = {

  meti: {source: "経済産業省「伝統的工芸品指定品目一覧［都道府県別］」（令和7年10月27日現在）", url: "https://www.meti.go.jp/press/2025/10/20251027001/20251027001-b.pdf"},

const INDUSTRY = [
  // ---- 農業（米・野菜・花） ----

// 月のならびを、となり合う月ごとのまとまりに分ける（[12,1,2] → [[12],[1,2]]。図の左右の端をまたがないように）
function monthRuns(ms) {
  const sorted = [...ms].sort((x, y) => x - y), runs = [];
  sorted.forEach(m => { const last = runs[runs.length - 1]; if (last && m === last[last.length - 1] + 1) last.push(m); else runs.push([m]); });
  return runs;
}
// 雨温図（棒＝降水量 0〜500mm、折れ線＝平均気温 -10〜30℃。教材と同じ向き）。note があれば印と説明をつける
function climateChart(c, note) {
  const W = 320, H = 190, L = 36, R = 40, T = 22, B = 24, w = W - L - R, h = H - T - B, bw = w / 12;
  const yT = v => T + h * (30 - v) / 40, yR = v => T + h * (500 - Math.min(v, 500)) / 500, xm = m => L + (m - 1) * bw + bw / 2;
  const grid = [-10, 0, 10, 20, 30].map(v => `<line x1="${L}" x2="${L + w}" y1="${yT(v)}" y2="${yT(v)}" class="cg"/><text x="${L - 4}" y="${yT(v) + 4}" class="cl" text-anchor="end">${v}</text>`).join("");
  const right = [0, 100, 200, 300, 400, 500].map(v => `<text x="${L + w + 4}" y="${yR(v) + 4}" class="cl">${v}</text>`).join("");
  const bars = c.rain.map((v, i) => `<rect x="${L + i * bw + bw * 0.18}" y="${yR(v)}" width="${bw * 0.64}" height="${T + h - yR(v)}" class="cb"/>`).join("");
  const pts = c.temp.map((v, i) => `${xm(i + 1)},${yT(v)}`).join(" ");
  const months = c.temp.map((_, i) => `<text x="${xm(i + 1)}" y="${H - 8}" class="cl" text-anchor="middle">${i + 1}</text>`).join("");
  const badge = (x, y, n) => `<g class="cn"><circle cx="${x}" cy="${y}" r="8"/><text x="${x}" y="${y + 3.5}" text-anchor="middle">${n}</text></g>`;
  let back = "", front = "", under = 0;
  (note ? note.marks : []).forEach(mk => {
    if (mk.type === "band") monthRuns(mk.months).forEach((run, k) => {
      const x0 = L + (run[0] - 1) * bw, x1 = L + run[run.length - 1] * bw, top = Math.min(...run.map(m => yR(c.rain[m - 1]))) - 6;
      back += `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${T + h - top}" class="cband"/>`;
      if (k === 0) front += badge((x0 + x1) / 2, top - 9, mk.n);
    });
    if (mk.type === "ring") monthRuns(mk.months).forEach((run, k) => {
      const cx = (xm(run[0]) + xm(run[run.length - 1])) / 2, cy = run.reduce((t, m) => t + yT(c.temp[m - 1]), 0) / run.length;
      const rx = (xm(run[run.length - 1]) - xm(run[0])) / 2 + 9;
      front += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="11" class="cring"/>`;
      if (k === 0) front += badge(cx + rx + 2, cy - 13, mk.n);
    });
    if (mk.type === "gap") {
      const [a, b] = mk.months, x = xm(b) + bw * 0.55, ya = yT(c.temp[a - 1]), yb = yT(c.temp[b - 1]);
      front += `<line x1="${xm(a)}" x2="${x}" y1="${ya}" y2="${ya}" class="cguide"/><line x1="${x}" x2="${x}" y1="${yb + 3}" y2="${ya - 3}" class="cgap" marker-start="url(#cArrow)" marker-end="url(#cArrow)"/>`;
      front += badge(x + 11, (ya + yb) / 2, mk.n);
    }
    if (mk.type === "under") under = mk.n;
  });
  const defs = `<defs><marker id="cArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="carrow"/></marker></defs>`;
  const rainYear = `年降水量 ${Math.round(c.year[0])}<span class="cur">mm</span>`;
  const list = note ? `<ol class="cpts">${note.points(c).map((p, i) => `<li><b>${"①②③"[i]}</b>${p}</li>`).join("")}</ol>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="雨温図">${defs}<text x="${L - 4}" y="12" class="cl cut" text-anchor="end">℃</text><text x="${L + w + 4}" y="12" class="cl cur">mm</text>
    ${grid}${right}${back}${bars}<polyline points="${pts}" class="ct"/>${c.temp.map((v, i) => `<circle cx="${xm(i + 1)}" cy="${yT(v)}" r="2.6" class="cd"/>`).join("")}${months}${front}</svg>
    <p>年平均気温 ${c.year[1]}<span class="cut">℃</span>・${under ? `<span class="cunder">${rainYear}</span><span class="cnum">${"①②③"[under - 1]}</span>` : rainYear}</p>${list}`;
}

function regionsPerfect(courseId) {

  recsOf(courseId).forEach(r => Object.entries(r.best || {}).forEach(([k, v]) => { best[k] = Math.max(best[k] ?? 0, v); }));

}

/* ---------- 効果音とBGM（最初のタップのあとに鳴る） ---------- */
// 出口は1本（out）。正解音はリバーブ（rev）にも送って響かせる。BGM は bgmBus でまとめて音量・フェードを扱う
let ac = null, out = null, rev = null, bgmBus = null, master = null;
// kind："sfx"＝効果音（正解・不正解・ファンファーレなど）／"bgm"＝問題中のBGM。それぞれ別にオンオフできる
function audio(kind = "sfx"){
  if (kind === "bgm" ? store.bgmOff : store.sfxOff) return null;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      // 全体の音量：効果音・BGM ともここを通る。0.25＝最初の4分の1（2026-11-04 に半分→さらに半分）
      out = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = 0.25; out.connect(master); master.connect(ac.destination);
      // 残響：減衰するノイズを左右別に作ってインパルス応答にする（約2.2秒）
      const len = Math.floor(ac.sampleRate * 2.2), ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
      rev = ac.createConvolver(); rev.buffer = ir;
      const wet = ac.createGain(); wet.gain.value = 0.55; rev.connect(wet); wet.connect(out);
      bgmBus = ac.createGain(); bgmBus.gain.value = 0; bgmBus.connect(out);
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  } catch(e){ return null; }
}
function tone(freqs, dur=0.09, type="triangle"){
  const a = audio(); if (!a) return;
  freqs.forEach((f,i) => {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i*dur;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(out);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur*1.6); o.start(t); o.stop(t+dur*1.7);
  });
}
// 正解：「トゥルリーン！」。ド・ミ・ソ・ド・ミを素早く駆け上がり、そのままメジャーの和音で伸ばしてリバーブで響かせる
function sndOk(){
  const a = audio(); if (!a) return;
  const T = a.currentTime + 0.01;
  // シュパーン：高い方へ駆け上がるノイズ（0.2秒）＋はじける音
  const len = Math.floor(a.sampleRate * 0.35), nb = a.createBuffer(1, len, a.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const ns = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  ns.buffer = nb; bp.type = "bandpass"; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(700, T); bp.frequency.exponentialRampToValueAtTime(7000, T + 0.2);
  ng.gain.setValueAtTime(0.0001, T); ng.gain.exponentialRampToValueAtTime(0.22, T + 0.05); ng.gain.exponentialRampToValueAtTime(0.0001, T + 0.3);
  ns.connect(bp); bp.connect(ng); ng.connect(out); ng.connect(rev); ns.start(T); ns.stop(T + 0.35);
  const po = a.createOscillator(), pg = a.createGain(); po.type = "triangle";
  po.frequency.setValueAtTime(1600, T + 0.16); po.frequency.exponentialRampToValueAtTime(320, T + 0.26);
  pg.gain.setValueAtTime(0.0001, T + 0.16); pg.gain.exponentialRampToValueAtTime(0.16, T + 0.17); pg.gain.exponentialRampToValueAtTime(0.0001, T + 0.3);
  po.connect(pg); pg.connect(out); po.start(T + 0.16); po.stop(T + 0.32);
  // きらきら：高い音を散らす（残響つき）
  for (let i = 0; i < 7; i++) {
    const t = T + 0.22 + Math.random() * 0.45, o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = 2400 + Math.random() * 2600;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(out); g.connect(rev); o.start(t); o.stop(t + 0.3);
  }
  const t0 = T + 0.14, notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
  notes.forEach((f, i) => {
    const t = t0 + i*0.045, len = 1.4 - i*0.08;
    const g = a.createGain(); g.connect(out); g.connect(rev);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.11, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.035, t+0.25); g.gain.exponentialRampToValueAtTime(0.0001, t+len);
    // ベルっぽく：基音（サイン）＋少しずらした三角波＋2倍音をうっすら
    [[f,"sine",1],[f*1.003,"triangle",0.45],[f*2,"sine",0.18]].forEach(([fr,type,v]) => {
      const o = a.createOscillator(), og = a.createGain(); o.type = type; o.frequency.value = fr; og.gain.value = v;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+len+0.05);
    });
  });
}
const sndNg = () => tone([330,247], 0.14, "square");

// 問題中のBGM：bgm/ の2曲（A＝bgm-a.mp3、B＝bgm-b.mp3）をループ。問題を始めるたびに A→B→A… と交互に選ぶ
// （続けて次の問題へ進んだときも、同じ問題を最初からやり直したときも、前と違う曲になる。前の曲は store.bgmLast に残す）
const BGM_FILES = {a: "bgm/bgm-a.mp3", b: "bgm/bgm-b.mp3"};
const BGM_VOL = 0.2;   // bgmBus の音量（このあと全体の master 0.25 を通る）。mp3 の平均の大きさ約0.13×0.2×0.25≒0.0067で、前の合成BGM（0.0059）とほぼ同じ
const BGM = {track: null, src: null, buf: {}, loading: {}, want: false};
function bgmLoad(k){
  if (!BGM.loading[k]) BGM.loading[k] = fetch(BGM_FILES[k]).then(r => r.arrayBuffer())
    .then(d => new Promise((ok, ng) => ac.decodeAudioData(d, ok, ng)))
    .then(buf => (BGM.buf[k] = buf)).catch(() => { BGM.loading[k] = null; return null; });
  return BGM.loading[k];
}
// 問題を始めるときに呼ぶ：前と違う曲を選んで覚える
function bgmPick(){
  BGM.track = store.bgmLast === "a" ? "b" : "a";
  store.bgmLast = BGM.track; save();
}
function bgmStart(){
  BGM.want = true;
  if (BGM.src || !audio("bgm")) return;
  const k = BGM.track || "a";
  bgmLoad(k === "a" ? "b" : "a");   // 次の曲も先に読みこんでおく
  bgmLoad(k).then(buf => {
    if (!buf || !BGM.want || BGM.src || k !== (BGM.track || "a")) return;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(bgmBus);
    const t = ac.currentTime; bgmBus.gain.cancelScheduledValues(t);
    bgmBus.gain.setValueAtTime(0.0001, t); bgmBus.gain.linearRampToValueAtTime(BGM_VOL, t + 1.0);
    src.start(t + 0.05); BGM.src = src;
  });
}
function bgmStop(){
  BGM.want = false;
  if (!BGM.src) return;
  const src = BGM.src; BGM.src = null;
  const t = ac.currentTime; bgmBus.gain.cancelScheduledValues(t);
  bgmBus.gain.setValueAtTime(bgmBus.gain.value, t); bgmBus.gain.linearRampToValueAtTime(0.0001, t + 0.6);
  src.stop(t + 0.65);
}

const CROWN_SVG = `<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path class="cr-body" d="M2.5 7.5 7.5 12 12 4l4.5 8 5-4.5-1.8 11H4.3z"/><rect class="cr-band" x="4.3" y="17" width="15.4" height="2.6" rx="1"/><circle class="cr-gem" cx="12" cy="13.2" r="1.5"/></svg>`;
function courseStatus(c) {
  if (!c.ready) return {text: "準備中", off: true};
  if (!inMode(c)) return {text: `${modeOf(c.from).name}から`, off: true};
  if (!unlocked(c)) {
    const pre = courseOf(c.unlock.course);
    return {text: c.unlock.need === "master" ? (pre.perfectOpens ? `${crown(pre)}か、全地方パーフェクトで開く` : `${crown(pre)}で開く`) : `${pre.name}の全国の挑戦を終えると開く`, off: true};
  }
  const m = masterOf(c.id);
  if (m) return {text: crown(c), done: true};
  if (c.stages) return {text: `ステージ ${stageCrowns(c.id)} / ${stagesOf(c).length}`};   // コース一覧では王冠を付けない（ヒントなし全問正解したステージの数）
  const got = new Set(); recsOf(c.id).forEach(r => Object.keys(r.got).forEach(k => got.add(k)));
  return {text: `正解した問題 ${got.size} / ${fullCount(c.id)}`};
}

/* コース一覧（モードごと） */
function home() {
  const lv = toHomeScreen(); screenNow = {kind: "home"};
  top_.innerHTML = `<div class="brand">サッと記憶！サッ記マン<small>日本地図タップドリル</small></div>${themeBtn()}${muteBtn()}`;
  bindBar();
  sheet.innerHTML = `
    <div class="info" id="info"></div>
    <h2>${TRACKS[0].name}</h2>
    <div class="courses">${COURSES.filter(c => c.track !== "history").map((c, i) => {
      const s = courseStatus(c);
      return `<button class="course${s.done ? " done" : ""}" type="button" data-course="${c.id}"${s.off ? " disabled" : ""}><b class="no">${i+1}</b><span>${s.done ? CROWN_SVG : ""}${c.name}${s.done ? `<em class="mastered">マスター！</em>` : `<small>${s.text}</small>`}</span></button>`;
    }).join("")}</div>
    <h2>${TRACKS[1].name}</h2>
    <div class="courses">${COURSES.filter(c => c.track === "history").map((c, i) => {
      const s = courseStatus(c);
      return `<button class="course${s.done ? " done" : ""}" type="button" data-course="${c.id}"${s.off ? " disabled" : ""}><b class="no">${i+1}</b><span>${s.done ? CROWN_SVG : ""}${c.name}${s.done ? `<em class="mastered">マスター！</em>` : `<small>${s.text}</small>`}</span></button>`;
    }).join("")}</div>
    <button class="btn resetbtn" id="reset" type="button">${ic("refresh")}リセット</button>`;
  byId("reset").onclick = openReset;
  sheet.querySelectorAll("[data-course]").forEach(b => b.onclick = () => coursePage(courseOf(b.dataset.course)));
}

// リセットの小窓：進捗をぜんぶ消す（押しまちがい防止に「消す」をもう一度押す）・アプリの再起動（記録は消えない）
function openReset() {
  if (document.querySelector(".pin")) return;
  const ov = document.createElement("div");
  ov.className = "pin";
  ov.innerHTML = `<div class="pin-box" role="dialog" aria-modal="true" aria-labelledby="rsTitle">
    <b id="rsTitle">リセット</b>
    <p class="hint" style="text-align:center">すべての記録・マスター・地図の色が消えて、最初の状態にもどります。</p>
    <div class="row" style="width:100%"><button class="btn primary" type="button" id="rsYes" style="flex:1 1 0">消す</button><button class="btn" type="button" id="rsNo" style="flex:1 1 0">やめる</button></div>
    <button class="linkbtn" type="button" id="rsReload">${ic("refresh")}消さずにアプリを再起動する</button></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector("#rsNo").onclick = close;
  // 進捗の全初期化（記録・👑・地図の色、v4 の記録も消す）。音の設定は残す
  // DBG ON のときは、画面に出ているお試し記録（dbgRec）も消す（本当の記録といっしょに）
  ov.querySelector("#rsYes").onclick = () => { store.rec = {}; store.best = {}; store.miss = {}; if (debug) dbgRec = {}; save(); close(); home(); };
  ov.querySelector("#rsReload").onclick = () => { bgmStop(); location.reload(); };
  ov.querySelector("#rsNo").focus();
}

/* コース：全国の挑戦（マスター判定あり）と、地方ごとの練習 */
function coursePage(c) {
  toHomeScreen(); screenNow = {kind: "course", c};
  const type = QUIZ_TYPES[c.id], total = fullCount(c.id), m = masterOf(c.id), zen = AREAS.find(a => a.wide);
  const best = Object.assign({}, ...recsOf(c.id).map(r => r.best));
  top_.innerHTML = `${titleBtn()}<div class="brand">${c.name}<small>中学受験 社会</small></div>${themeBtn()}${muteBtn()}`;
  bindBar();
  const regions = (c.stages ? stagesOf(c) : STAGES).map(a => ({a, n: type.make(a.codes, a).length})).filter(x => x.n > 0);
  sheet.innerHTML = `
    <div class="modebar"><button class="btn backbtn" id="back" type="button">${ic("back")}コース一覧にもどる</button>${m ? `<span class="medal">${crown(c)}</span>` : ""}</div>
    ${c.stages ? "" : `<div class="chips"><button class="chip wide" type="button" id="master">全国の挑戦<small>${total}問${best.zenkoku != null ? `・ベスト ${best.zenkoku}/${total}` : ""}</small></button></div>`}
    <h2>${c.stages ? `${c.stageList ? "" : "地方"}ステージ（${ic("crown")}${stageCrowns(c.id)} / ${stagesOf(c).length}）` : "地方ごとの練習"}</h2>
    <div class="chips">${regions.map(({a, n}) => {
      // 県名タップは v4 の地方ベスト（store.best）も参考に出す
      const b = Math.max(best[a.id] ?? -1, c.id === "prefName" ? (store.best[a.id] ?? -1) : -1);
      const cr = c.stages && stageDone(c.id, a.id, "master") ? ic("crown") : "";
      return `<button class="chip" type="button" data-area="${a.id}"><span class="cnm${!a.name.includes("・") && a.name.length >= 5 ? " tight" : ""}">${brkDot(a.name)}</span><small${b >= n ? ` class="perfect"` : ""}>${cr}${b >= 0 ? `ベスト ${b}/${n}` : `${n}問`}</small></button>`;   // パーフェクト（ベストが全問）は黄色
    }).join("")}</div>
    <p class="motto">県名なしの日本地図でノーミスクリアをめざそう！</p>`;   // くわしい条件は COURSES[].rules（画面には出さない）
  byId("back").onclick = home;
  if (!c.stages) byId("master").onclick = () => startQuiz(c, zen, zen.codes, {master: true});
  sheet.querySelectorAll("[data-area]").forEach(b => b.onclick = () => { const a = (c.stages ? stagesOf(c) : AREAS).find(x => x.id === b.dataset.area); startQuiz(c, a, a.codes, {stage: !!c.stages}); });
}

function showInfo(code) {
  const p = byCode(code);
  if (selected) pathEl[selected].classList.remove("sel");
  selected = code; pathEl[code].classList.add("sel"); toFront(code);
  const info = byId("info");
  if (info) info.innerHTML = `<span class="nm">${p.name}</span><span class="sub">${p.kana}・${p.region}・${capitalLabel(p)}</span>`;
}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

// opts.master：全国の挑戦（完了・マスター判定の対象）／opts.keys：まちがえた問題だけ（判定の対象外）
function startQuiz(course, area, codes, opts={}) {
  cancelQuizTimers(); eyeOff();
  const type = QUIZ_TYPES[course.id];
  sheet.classList.remove("home"); showFeature(null);
  mode = "quiz"; selected = null; clearTag(); clearmsg.hidden = true; bgmStop(); bgmPick(); bgmStart(); JapanMap.resetColors(); svg.classList.remove("explore");
  const inArea = new Set(area.codes);
  PREFS.forEach(p => { pathEl[p.code].classList.toggle("off", !inArea.has(p.code)); labelEl[p.code].classList.toggle("off", !inArea.has(p.code)); });
  homeBox = area.wide ? FULL : unionBox(area.codes); fitLater(homeBox);
  svg.classList.toggle("region-quiz", !area.wide);
  let qs = type.make(codes, area);
  if (opts.keys) qs = qs.filter(q => opts.keys.includes(q.key));
  const master = !!opts.master && !opts.keys && area.wide && qs.length === fullCount(course.id);
  const stage = !!opts.stage && !opts.keys && !!course.stages && !area.wide;
  quiz = { course, type, area, opts, master, stage, modeId: curMode().id, qs: shuffle(qs), i: 0, combo: 0, maxCombo: 0, log: [], inArea };
  nextQ();
}

// 進み具合：未回答＝薄い墨／いま＝黄（背が高い）／正解＝緑／ヒントあり正解＝緑の斜線／不正解＝赤
const pbar = document.getElementById("pbar");
const kindOf = q => q.kind || quiz.type.kind;
function renderProgress(){
  pbar.innerHTML = quiz ? quiz.qs.map((q,i) => {
    const l = quiz.log[i]; return `<i class="${l ? (l.ok ? (l.hint ? "hintd" : "ok") : "ng") : (i === quiz.i ? "now" : "")}"></i>`;
  }).join("") : "";
}

// 下段に出す出題文（問題文＋よみ）
// よみ（sub）は、問題文の黄色い語（最初の <em>）の上にふりがなとして付ける。<em> がないときだけ下の行に出す
function askText(q) {
  if (!q.sub || !/<em>/.test(q.text)) return {html: q.text, under: q.sub || ""};
  return {html: q.text.replace(/<em>(.*?)<\/em>/, (m, w) => `<em>${rb(w, q.sub)}</em>`), under: ""};
}
const askBlock = () => { const t = askText(quiz.q); return `<div class="ask"><span class="q${quiz.q.text.replace(/<[^>]+>/g, "").length > 18 ? " long" : ""}">${t.html}</span>${t.under ? `<span class="kana">${t.under}</span>` : ""}</div>`; };

function nextQ() {
  eyeOff(); clearTag(); clearNextTri();
  if (quiz.i >= quiz.qs.length) return result();
  const q = quiz.q = quiz.qs[quiz.i]; q.hint = false; quiz.answered = false;
  // 出題文はどのコースも下段（シート）に置き、上のバーには進み具合だけを出す。4択は出題文のすぐ下に選択肢
  // 上の帯：左端に✕（やめる）、小さい文字で「関東　3 / 7」、右に DBG とタイトルへ戻る家のボタン
  top_.innerHTML = `<button class="iconbtn" id="quit" type="button" aria-label="やめる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="ask"><span class="meta"><span class="nm">${quiz.master ? "全国の挑戦" : quiz.stage ? `${quiz.area.name}ステージ` : quiz.area.name}</span><span class="num">${quiz.i+1} / ${quiz.qs.length}</span></span></div>${themeBtn()}${muteBtn()}${titleBtn()}`;
  renderProgress();
  bindBar();
  // 問題中に ✕・タイトルを押したら、すぐには出ずに確認する（続けるならそのまま）
  byId("quit").onclick = () => confirmQuit(home);
  const tt = byId("toTitle"); if (tt) tt.onclick = () => confirmQuit(modeSelect);
  showChart(null);
  showPin(null);
  // 前の問題で黄色にした県は消す（総合問題では4択のあとにタップの問題が来る）
  Object.values(pathEl).forEach(p => p.classList.remove("sel"));
  if (kindOf(q) === "choice") {
    // 対象の都道府県を地図で示し、選択肢の並びは毎回まぜる
    Object.values(pathEl).forEach(p => p.classList.remove("sel", "ok", "miss", "flash-ok"));
    if (q.chart) {
      // 雨温図の問題：答えの都市が分からないよう地図は全国のまま、雨温図を地図の上に出す
      showChart(q.chart); fitLater(FULL);
    } else if (q.zone) {
      q.zone.forEach(c => pathEl[c].classList.add("sel"));
      fitLater(unionBox(q.zone));
    } else if (q.feature) {
      showFeature(q.feature);
      const b = TERRAIN.find(f => f.id === q.feature).b, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, h = Math.max(b[2] - b[0], b[3] - b[1], 160) / 2;
      fitLater([cx - h, cy - h, cx + h, cy + h]);
    } else {
      pathEl[q.focus].classList.add("sel");
      // 県庁所在地は県庁、歴史の場所はその場所を、ピンクの光で示す
      if (q.pinLL) { showPinAt(q.pinLL, q.focus); fitLater(unionBox(areaOfPref(q.focus).codes)); } else showPin(q.pin);
      if (quiz.area.wide) fitLater(unionBox(areaOfPref(q.focus).codes));
    }
    q.order = shuffle(q.choices);
    sheet.innerHTML = `${askBlock()}<div class="qslot" id="qslot"><div class="choices">${q.order.map(([n, k], j) =>
      `<button class="choice" type="button" data-j="${j}"><span class="cname">${rb(n, k, true)}</span></button>`).join("")}</div></div>`;
    const owner = quiz;
    sheet.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (quiz === owner && mode === "quiz") answerChoice(+b.dataset.j); });
  } else {
    sheet.innerHTML = `${askBlock()}<div class="qslot tap" id="qslot"><p class="hint">地図の県をタップしてね。わからない時は目のボタン（押している間だけ県名）。</p></div>`;
  }
}

// 1問の正誤を記録する。正解は got に積むだけで、まちがえても消えない
function logAnswer(ok) {
  const q = quiz.q, r = rec(quiz.modeId, quiz.course.id);
  quiz.log[quiz.i] = {ok, hint: q.hint, key: q.key, pref: q.prefs[0], tap: kindOf(q) === "tap"};
  if (ok) { r.got[q.key] = 1; if (!q.hint) r.clean[q.key] = 1; }
  else r.miss[q.key] = (r.miss[q.key] || 0) + 1;
  save();
}

// 「・」のうしろでだけ改行する（言葉の途中では切らない。・は行の頭に置かない）
const brkDot = t => t.replace(/・/g, "・<wbr>");
// ふりがな（よみ）を漢字の上に付ける
// 「元寇（博多湾）」のようにかっこの補足がある名前は、ふりがなを本体（元寇）だけに付け、補足はそのあとに出す。
// br:true（4択のボタン）では補足を次の行に小さく出す
// ふりがなを、名前の「・」の区切りごとに分けて付ける（島原・天草一揆 → 島原｜天草一揆。よみが片方に寄らない）。
// 区切りの数がよみと合わないときは全体に1つ。「・」のあとでだけ改行できる
const rubySeg = (w, k) => {
  if (!k) return brkDot(w);
  const ws = w.split("・"), ks = k.split("・");
  if (ws.length > 1 && ws.length === ks.length) return ws.map((p, i) => rubyKanji(p, ks[i])).join("・<wbr>");
  return rubyKanji(w, k);
};
// ふりがなは漢字の部分だけに付ける（ひらがな・カタカナには付けない）。
//   原爆ドーム／げんばくドーム → 原爆［げんばく］ドーム、壇ノ浦の戦い → 壇［だん］ノ浦［うら］の戦［たたか］い
//   ヶ・ケ・々 は漢字のなかまとして扱う（関ケ原 → せきがはら）。よみと合わないときは全体に1つ付ける
const toHira = t => t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const isKanji = c => /[一-鿿々ヶケ〆]/.test(c);
function rubyKanji(w, k) {
  const runs = [];
  for (const c of w) { const kj = isKanji(c); if (runs.length && runs[runs.length - 1].kj === kj) runs[runs.length - 1].t += c; else runs.push({kj, t: c}); }
  if (!runs.some(r => r.kj)) return w;                       // 漢字がなければふりがなは付けない
  if (runs.length === 1) return rubyOne(w, k);
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // 前の漢字にできるだけ長くよみを割りあてる（長篠の戦い → ながしの｜の｜たたか）
  const m = toHira(k).match(new RegExp("^" + runs.map(r => r.kj ? "(.+)" : esc(toHira(r.t))).join("") + "$"));
  if (!m) return rubyOne(w, k);
  let g = 1;
  return runs.map(r => r.kj ? rubyOne(r.t, m[g++]) : r.t).join("");
}
// 1つのふりがな：よみが漢字の幅より長いときは、ふりがなの字を小さくして漢字の幅に収める（--fit＝漢字の字数÷よみの字数）
const rubyOne = (b, k) => `<ruby>${b}<rt${k.length > b.length * 2 ? ` style="--fit:${(b.length / k.length).toFixed(3)}"` : ""}>${k}</rt></ruby>`;
// 「元寇（博多湾）」のようにかっこの補足がある名前は、ふりがなを本体（元寇）だけに付け、補足はそのあとに出す
// （よみにもかっこがあれば、補足にもふりがなを付ける）。br:true（4択のボタン）では補足を次の行に小さく出す
const rb = (w, k, br = false) => {
  const m = w.match(/^(.+?)（(.+)）$/);
  if (!m) return rubySeg(w, k);
  const km = (k || "").match(/^(.+?)（(.+)）$/);
  const base = rubySeg(m[1], km ? km[1] : k), paren = km ? rubySeg(m[2], km[2]) : m[2];
  return br ? `${base}<span class="paren">（${paren}）</span>` : `${base}<span class="nw">（${paren}）</span>`;   // 文の中ではかっこの途中で折らない
};
// 解説が答えの名前で始まるとき（「静岡県。…」）は、上の行と重ならないようにその部分を省く
const trimLead = (text, name) => text && text.startsWith(name + "。") ? text.slice(name.length + 1) : (text || "");

// 正誤の記号の丸。キャラクターの顔アイコンに差し替えるときは、ここだけ変えればよい
const face = state => `<div class="face" aria-hidden="true">${ic(state === "ok" ? "ok" : "ng")}</div>`;

function noteHtml(code) {
  const ns = GEO_NOTES[code] || [];
  return ns.map(n => `<span>【${GEO_THEMES[n.theme] || ""}】${n.text}</span>`).join("");
}

// 答えたあと：音・れんぞく・花火を出し、問題の下の枠（qslot）の中に正誤と「つぎへ」を入れる（枠の高さは変えない）
//   kind:"choice" … 左に選択肢（色つき）、右に正誤の文と「つぎへ」
//   kind:"tap"    … 左に正誤の文、右に「つぎへ」
function afterAnswer(ok, html, opt = {}) {
  const q = quiz.q;
  if (ok) {
    sndOk();
    if (q.hint) quiz.combo = 0; else { quiz.combo++; quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo); }
    if (quiz.combo >= 2) { combo.textContent = `${quiz.combo}れんぞく！`; combo.hidden = false; combo.classList.remove("pop"); void combo.offsetWidth; combo.classList.add("pop"); }
    else combo.hidden = true;
  } else {
    sndNg(); quiz.combo = 0; combo.hidden = true;
  }
  const slot = byId("qslot");
  if (opt.kind === "choice") {
    const ch = slot.querySelector(".choices");
    slot.innerHTML = `<div class="ansrow"><div class="ansside-l"></div><div class="ansside">${html}</div></div>`;
    const left = slot.querySelector(".ansside-l"); left.replaceWith(ch);
  } else {
    slot.innerHTML = `<div class="ansrow tap"><div class="fbcol">${html}</div></div>`;
  }
  showNextTri();
  if (ok && opt.burst) requestAnimationFrame(() => { const r = opt.burst(); if (r) burst(r.x, r.y); });
  const owner = quiz;
  byId("next").onclick = () => { if (quiz !== owner || mode !== "quiz") return; Object.values(pathEl).forEach(p => p.classList.remove("reveal", "flash-ng")); quiz.i++; nextQ(); };
}

/* ---------- つぎへ：問題文のウインドウのすぐ上、まん中に、中抜きの黄色い ▷ ----------
   地図が透けて見えるよう中は塗らない。押せるのは三角の中だけ（ボタン自体は素通しにして、三角の形 .hit だけで受ける）。うっすら光って、ゆっくり点滅する */
function clearNextTri() { const o = byId("next"); if (o) o.remove(); }
function showNextTri() {
  clearNextTri();
  const b = document.createElement("button");
  b.type = "button"; b.id = "next"; b.className = "nexttri"; b.setAttribute("aria-label", "つぎへ");
  // 黄色の地に、ななめのグレーの帯（太・細の2本）が三角の中を横切ってキラッと光る。帯は三角の形で切りぬく
  b.innerHTML = `<svg viewBox="0 0 92 104" aria-hidden="true"><defs><clipPath id="triClip"><path d="M6 6 L86 52 L6 98 Z"/></clipPath></defs>
    <path class="tri-fill" d="M6 6 L86 52 L6 98 Z"/>
    <g clip-path="url(#triClip)"><g class="shine"><rect x="-34" y="-30" width="18" height="170" transform="rotate(24 -25 52)"/><rect x="-10" y="-30" width="6" height="170" transform="rotate(24 -7 52)"/></g></g>
    <path class="tri-line" d="M6 6 L86 52 L6 98 Z"/><path class="hit" d="M0 0 L92 52 L0 104 Z"/></svg><span>つぎへ</span>`;
  byId("mapwrap").appendChild(b);
}

/* ---------- 正解の花火：黄色い粒をシュパーンと散らす ---------- */
let fxCanvas = null, fxParts = [], fxRunning = false;
function burst(x, y) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!fxCanvas) { fxCanvas = document.createElement("canvas"); fxCanvas.className = "fx"; document.body.appendChild(fxCanvas); }
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (fxCanvas.width !== innerWidth * dpr || fxCanvas.height !== innerHeight * dpr) { fxCanvas.width = innerWidth * dpr; fxCanvas.height = innerHeight * dpr; }
  const cols = ["#FED003", "#FFE45C", "#FFF3A0", "#FFFFFF", "#FFB800"];
  // 速い筋（シュパーン）＋ゆっくり舞うきらきら＋広がる輪
  for (let i = 0; i < 46; i++) { const a = Math.random() * Math.PI * 2, v = 7 + Math.random() * 9;
    fxParts.push({x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 0, max: 34 + Math.random() * 18, c: cols[i % cols.length], w: 2 + Math.random() * 2, streak: true}); }
  for (let i = 0; i < 30; i++) { const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4;
    fxParts.push({x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, life: 0, max: 50 + Math.random() * 30, c: cols[i % cols.length], w: 2 + Math.random() * 3, streak: false}); }
  fxParts.push({ring: true, x, y, life: 0, max: 22});
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxStep); }
}
function fxStep() {
  const g = fxCanvas.getContext("2d"), dpr = fxCanvas.width / innerWidth;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
  g.globalCompositeOperation = "lighter";
  fxParts = fxParts.filter(p => p.life < p.max);
  fxParts.forEach(p => {
    p.life++; const k = 1 - p.life / p.max;
    if (p.ring) { g.strokeStyle = `rgba(255,228,92,${k * 0.9})`; g.lineWidth = 4 * k + 1; g.beginPath(); g.arc(p.x, p.y, 10 + (1 - k) * 90, 0, Math.PI * 2); g.stroke(); return; }
    p.px = p.x; p.py = p.y; p.vx *= p.streak ? 0.9 : 0.96; p.vy = p.vy * (p.streak ? 0.9 : 0.96) + (p.streak ? 0.25 : 0.12);
    p.x += p.vx; p.y += p.vy;
    g.globalAlpha = Math.max(0, k);
    if (p.streak) { g.strokeStyle = p.c; g.lineWidth = p.w; g.lineCap = "round"; g.beginPath(); g.moveTo(p.px - p.vx * 1.5, p.py - p.vy * 1.5); g.lineTo(p.x, p.y); g.stroke(); }
    else { g.fillStyle = p.c; const r = p.w * (0.6 + 0.4 * Math.sin(p.life * 0.6)); g.beginPath(); g.arc(p.x, p.y, Math.max(0.5, r), 0, Math.PI * 2); g.fill(); }
  });
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  if (fxParts.length) requestAnimationFrame(fxStep); else { fxRunning = false; g.clearRect(0, 0, innerWidth, innerHeight); }
}

function answerChoice(j) {
  if (quiz.answered) return;
  const q = quiz.q, pick = q.order[j], ok = pick[0] === q.correct;
  quiz.answered = true; eyeOff();
  logAnswer(ok);
  sheet.querySelectorAll("[data-j]").forEach(b => {
    const c = q.order[+b.dataset.j]; b.disabled = true;
    if (c[0] === q.correct) b.classList.add("right"); else if (+b.dataset.j === j) b.classList.add("wrong");
  });
  renderProgress();
  // 雨温図の問題は、答えたら雨温図を閉じて、その都市の県を黄色にして地方へ寄せる（札に隠れないように）
  // 雨温図の問題は、正解・不正解にかかわらず雨温図に読みとりの印と説明を出し、その都市の県を黄色にする
  if (q.chart) { showChart(q.chart, true); pathEl[q.prefs[0]].classList.add("sel"); toFront(q.prefs[0]);
    if (!ok) setupCompare(CLIMATE_CITIES.find(x => x.name === pick[0])); }
  // 4択の解説は答えの名前とよみのくり返しなので、右の枠には出さない（県の補足 GEO_NOTES だけ出す）
  const ans = q.choices[0];
  afterAnswer(ok, ok
    ? `<div class="fb ok">${face("ok")}<div class="txt"><b>せいかい！</b><span class="head">${rb(ans[0], ans[1])}${q.hint ? "（ヒントを見て正解）" : ""}</span>${noteHtml(q.focus)}</div></div>`
    : `<div class="fb ng">${face("ng")}<div class="txt"><span class="head"><b>ざんねん</b>　正解は <em>${rb(ans[0], ans[1])}</em>。キミが選んだのは ${rb(pick[0], pick[1])}。</span>${noteHtml(q.focus)}</div></div>`,
    {kind: "choice", burst: () => { const el = sheet.querySelector(".choice.right"); if (!el) return null; const r = el.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; }});
}

function handleTap(code) {
  tapHandlers.forEach(cb => { try { cb(code); } catch(e){} });
  if (mode === "home") return showInfo(code);
  if (mode !== "quiz" || kindOf(quiz.q) !== "tap" || quiz.answered || !quiz.inArea.has(code)) return;
  const q = quiz.q, ok = q.answers.includes(code);
  quiz.answered = true; eyeOff();
  const p = byCode(code), ans = byCode(q.answers[0]);
  logAnswer(ok);
  if (quiz.course.id === "prefName" && !ok) { store.miss[ans.code] = (store.miss[ans.code] || 0) + 1; save(); }
  renderProgress();   // 出題文と枠はそのまま。枠の中だけ正誤に入れかえる
  if (q.pinLL) showPinAt(q.pinLL, q.prefs[0]);   // 政令指定都市：答えたら、その市の場所をピンクの光で示す
  if (ok) {
    pathEl[code].classList.add("flash-ok");
    quizTimeout(() => { pathEl[code].classList.remove("flash-ok"); pathEl[code].classList.add("ok"); }, 450);
    afterAnswer(true, `<div class="fb ok">${face("ok")}<div class="txt"><b>せいかい！ ${ans.name}</b><span class="desc">${q.hint ? "（ヒントを見て正解）" : ""}${trimLead(q.explain, ans.name)}</span>${noteHtml(ans.code)}</div></div>`,
      {kind: "tap", burst: () => { const r = pathEl[code].getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; }});
  } else {
    pathEl[code].classList.add("flash-ng"); showTag(code, p.short);
    pathEl[ans.code].classList.add("miss");
    JapanMap.highlightPrefecture(ans.code);
    afterAnswer(false, `<div class="fb ng">${face("ng")}<div class="txt"><span class="head"><b>ざんねん</b>　正解は <em>${ans.name}</em>。キミが指したのは ${p.name}。</span><span class="desc">${trimLead(q.explain, ans.name)}</span>${noteHtml(ans.code)}</div></div>`, {kind: "tap"});
  }
}

// 総合問題のまちがえた一覧：もとのコースの書き方にそろえる
function generalLabel(l) {
  const [k, id] = String(l.key).split(":");
  if (k === "cap") return `${byCode(+id).name}（${CITIES.capitals[+id][0][0]}）`;
  if (k === "ter") return TERRAIN.find(f => f.id === id).name;
  return `${industryName(industryOf(id))}（${byCode(l.pref).name}）`;
}

function result() {
  cancelQuizTimers(); eyeOff(); clearNextTri();
  Object.values(pathEl).forEach(p => p.classList.remove("flash-ok", "flash-ng", "reveal"));
  pbar.innerHTML = ""; showFeature(null); showChart(null); showPin(null);
  // 正解した県の色は、途中の遅延処理が取り消されても結果画面で付けそろえる
  quiz.log.forEach(l => l.ok && l.tap && pathEl[l.pref].classList.add("ok"));
  mode = "result"; bgmStop(); combo.hidden = true; clearTag();
  const course = quiz.course, total = quiz.qs.length, correct = quiz.log.filter(l => l.ok).length, clean = quiz.log.filter(l => l.ok && !l.hint).length;
  const missed = quiz.log.filter(l => !l.ok);
  const r = rec(quiz.modeId, course.id);
  const before = COURSES.filter(c => c.ready && inMode(c) && !unlocked(c)).map(c => c.id);
  let newMaster = null, newStage = false;
  if (quiz.stage) {
    // 地方ステージを最後まで解いた。ヒントなしで全問正解ならそのステージに👑。全ステージ👑でコースの👑マスター
    const area = quiz.area, s = r.stage[area.id] = Object.assign({complete: false, master: null}, r.stage[area.id]);
    s.complete = true;
    r.best[area.id] = Math.max(r.best[area.id] ?? 0, clean);
    if (clean === total && !stageDone(course.id, area.id, "master")) { s.master = {at: Date.now()}; newStage = true; }
    if (stagesOf(course).every(a => stageDone(course.id, a.id, "complete"))) r.complete = true;
    if (stagesOf(course).every(a => stageDone(course.id, a.id, "master")) && !masterOf(course.id)) { newMaster = {at: Date.now(), clean: true}; r.master = newMaster; }
  } else if (quiz.master) {
    // 全国の挑戦を最後まで解いた。47（または全都市）を重複なく、ヒントなしで全問正解したときだけ👑マスター
    r.complete = true;
    r.best.zenkoku = Math.max(r.best.zenkoku ?? 0, clean);
    const keys = new Set(quiz.log.map(l => l.key));
    if (clean === total && keys.size === total && total === fullCount(course.id) && !isMaster(r)) {
      newMaster = {at: Date.now(), clean: true}; r.master = newMaster;
    }
  } else if (!quiz.opts.keys && !quiz.area.wide) {
    r.best[quiz.area.id] = Math.max(r.best[quiz.area.id] ?? 0, clean);
  }
  save();
  const opened = COURSES.filter(c => before.includes(c.id) && unlocked(c));
  // まちがえた問題だけのやり直し（opts.keys）は、全部正解しても「パーフェクト」ではなく「クリア」
  const retry = !!quiz.opts.keys;
  const msg = newMaster ? `${crown(course)}！` : newStage ? `${ic("crown")}${quiz.area.name}ステージ パーフェクト！` : retry && correct === total ? "クリア！" : clean === total ? "パーフェクト！" : correct === total ? "全問正解！ ヒントなしでマスター" : missed.length <= 2 ? "あと少し！ まちがえた問題をもう一回" : "まちがえた問題だけ、くりかえそう";
  const nextStage = quiz.stage ? stagesOf(course)[stagesOf(course).indexOf(quiz.area) + 1] : null;
  const label = l => course.id === "treasure" ? treasureOf(l.key).name : course.id === "history" ? historyOf(l.key).name : course.id === "general" ? generalLabel(l) : course.id === "climate" ? (String(l.key).startsWith("zone:") ? zoneOf(l.key.slice(5)).name : CLIMATE_CITIES.find(c => "city:" + c.id === l.key).name) : course.id === "terrain" ? TERRAIN.find(f => f.id === l.key).name : course.id === "industry" ? `${industryName(industryOf(l.key))}（${byCode(l.pref).name}）` : course.id === "designated" ? CITIES.designated[l.key][0] : course.id === "capital" ? `${byCode(l.pref).name}（${CITIES.capitals[l.pref][0][0]}）` : byCode(l.pref).name;
  top_.innerHTML = `${titleBtn()}<div class="ask"><span class="meta"><span class="nm">${course.name}・${quiz.master ? "全国の挑戦" : quiz.stage ? `${quiz.area.name}ステージ` : quiz.area.name}</span><span class="num">けっか</span></span></div>${themeBtn()}${muteBtn()}`;
  bindBar();
  // 文の最初のすきま（タグの外）で改行する。王冠はSVGなので innerHTML で入れる
  clearmsg.firstChild.innerHTML = msg.replace(/^((?:<[^>]*>|[^ <])*) /, "$1\n"); clearmsg.hidden = false;
  sheet.innerHTML = `
    <div class="score"><span class="big">${correct}<small style="font-size:1.2rem"> / ${total}</small></span><span class="msg">ヒントなし正解 ${clean}問・最高 ${quiz.maxCombo}れんぞく</span></div>
    ${newStage || newMaster ? `<div class="modebar">${newStage ? `<span class="medal">${ic("crown")}${quiz.area.name}ステージ</span>` : ""}${newMaster ? `<span class="medal">${crown(course)}</span>` : ""}</div>` : ""}
    ${opened.map(c => `<p class="hint"><b>「${c.name}」コースが開いたよ！</b></p>`).join("")}
    ${missed.length ? `<h2>まちがえた問題</h2><div class="misslist">${missed.map(l => `<span>${label(l)}</span>`).join("")}</div>` : ""}
    <div class="row">
      ${missed.length ? `<button class="btn primary" id="retryMiss" type="button">まちがえた問題だけ もう一回</button>` : ""}
      <button class="btn${missed.length ? "" : " primary"}" id="retry" type="button">もう一回</button>
      ${nextStage ? `<button class="btn nextbtn" id="nextStage" type="button"><span>つぎのステージ</span><span class="nx">${NEXT2}${brkDot(nextStage.name)}</span></button>` : ""}
      <button class="btn" id="back" type="button">コースにもどる</button>
    </div>`;
  const area = quiz.area, opts = quiz.opts, missKeys = missed.map(l => l.key);
  if (nextStage) byId("nextStage").onclick = () => startQuiz(course, nextStage, nextStage.codes, {stage: true});
  if (missed.length) byId("retryMiss").onclick = () => startQuiz(course, area, area.codes, {keys: missKeys});
  byId("retry").onclick = () => startQuiz(course, area, area.codes, opts);
  byId("back").onclick = () => coursePage(course);
  // 👑マスターを初めて取ったときだけ、称号をたたえる画面と花火を出す（cheered を記録して二度は出さない）
  if (newMaster && !newMaster.cheered) { newMaster.cheered = true; save(); celebrateMaster(course); }
  // ステージクリア・パーフェクトのとき：結果の札のまわりに花火を打ち上げ、クリアの音を鳴らす（👑マスターのときはお祝い画面のほうで鳴らす）
  else if (newStage || (clean === total && !retry)) cheerClear();   // やり直しのクリアでは花火を出さない
}

// つぎのステージの「▶▶」（三角は横幅を高さの6割にして、すっきり見せる）
const NEXT2 = `<svg class="ic ic-next2" viewBox="0 0 14.4 12" aria-hidden="true"><path d="M0 0 7.2 6 0 12z M7.2 0 14.4 6 7.2 12z"/></svg>`;
// クリアの花火と音：札のまわりで5回、少しずつずらして打ち上げる
function cheerClear() {
  sndClear();
  const r = clearmsg.firstChild.getBoundingClientRect(), pts = [[0.1, 0.1], [0.9, 0.15], [0.5, -0.2], [0.2, 0.9], [0.8, 0.95]];
  pts.forEach(([fx, fy], i) => setTimeout(() => { if (mode === "result") burst(r.left + r.width * fx, r.top + r.height * fy); }, 120 + i * 170));
}
// クリアの音：明るく駆け上がる5音のあと、きらきらを散らしてメジャーの和音で響かせる
function sndClear() {
  const a = audio(); if (!a) return;
  const T = a.currentTime + 0.03;
  const bell = (f, t, len, v) => {
    const g = a.createGain(); g.connect(out); g.connect(rev);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(v * 0.3, t + len * 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [[f, "sine", 1], [f * 2, "sine", 0.3], [f * 1.003, "triangle", 0.4]].forEach(([fr, type, vv]) => {
      const o = a.createOscillator(), og = a.createGain(); o.type = type; o.frequency.value = fr; og.gain.value = vv; o.connect(og); og.connect(g); o.start(t); o.stop(t + len + 0.05);
    });
  };
  [783.99, 1046.5, 1318.5, 1568, 2093].forEach((f, i) => bell(f, T + i * 0.07, 0.5, 0.09));
  for (let i = 0; i < 10; i++) bell(2600 + Math.random() * 2400, T + 0.35 + Math.random() * 0.6, 0.3, 0.03);
  [523.25, 659.25, 783.99, 1046.5].forEach(f => bell(f, T + 0.4, 1.8, 0.05));
}

/* ---------- 👑マスター達成のお祝い画面（最初の一度だけ） ---------- */
function celebrateMaster(course) {
  const ov = document.createElement("div");
  ov.className = "pin celebrate";
  ov.innerHTML = `<div class="pin-box cele-box" role="dialog" aria-modal="true" aria-labelledby="celeTitle">
    <div class="cele-crown" aria-hidden="true">${ic("crown")}</div>
    <p class="cele-sub">称号ゲット！</p>
    <b id="celeTitle" class="cele-title">${course.master}</b>
    <p class="hint" style="text-align:center">「${course.name}」をヒントなしで全問正解！<br>キミは今日から ${course.master} だ！</p>
    <button class="btn primary" type="button" id="celeOk" style="flex:none;width:100%">やったね！</button></div>`;
  document.body.appendChild(ov);
  sndFanfare();
  // 花火：画面のあちこちで3秒ほど打ち上げる
  let n = 0;
  const shoot = () => {
    if (!ov.isConnected || n >= 9) return;
    n++; burst(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.12 + Math.random() * 0.45));
    setTimeout(shoot, 330);
  };
  shoot();
  ov.querySelector("#celeOk").onclick = () => ov.remove();
  ov.querySelector("#celeOk").focus();
}
// ファンファーレ：ド・ミ・ソ・ドを駆け上がって、メジャーの和音を長く響かせる
function sndFanfare() {
  const a = audio(); if (!a) return;
  const T = a.currentTime + 0.05;
  const note = (f, t, len, v) => {
    const g = a.createGain(); g.connect(out); g.connect(rev);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(v * 0.5, t + len * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [[f, "triangle", 1], [f * 2, "sine", 0.25], [f * 1.004, "sawtooth", 0.08]].forEach(([fr, type, vv]) => {
      const o = a.createOscillator(), og = a.createGain(); o.type = type; o.frequency.value = fr; og.gain.value = vv; o.connect(og); og.connect(g); o.start(t); o.stop(t + len + 0.05);
    });
  };
  [[523.25, 0], [659.25, 0.14], [783.99, 0.28], [1046.5, 0.42]].forEach(([f, d]) => note(f, T + d, 0.22, 0.12));
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(f => note(f, T + 0.62, 2.2, 0.07));
}

window.addEventListener("load", home);
if (document.readyState === "complete") home();
</script>
