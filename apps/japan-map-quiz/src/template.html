<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本地図タップクイズ</title>
<!-- ファビコンは公開サイトの直下（site/ から tools/build_site.py で配置） -->
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 白地図（受験用の白い地図）を机に広げたイメージ：海の青＋白い陸＋黒い県境。上に問題、下に答えのシート */
:root{
  --bg:#e3e5e7; --sea:#bcdcec; --land:#fdfcf7; --land-dim:#e4ebee; --land-none:#c9cdd1; --line:#2c3d4a;
  --ink:#1d2b35; --muted:#5a6d7a; --sheet:#ffffff; --sheet-line:#c9dbe4;
  --accent:#f2a516; --accent-ink:#4a3000; --ok:#2e9a58; --ok-soft:#bfe6cc; --ng:#d9472f; --ng-soft:#f7c9bd;
  --r1:#cfe3f7; --r2:#f6d7d9; --r3:#d9efcf; --r4:#f7e6bf; --r5:#e3d9f3; --r6:#cdeee9; --r7:#f6dcc6;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --shadow:0 -6px 24px rgba(30,60,80,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1f22; --sea:#12304a; --land:#2b3c49; --land-dim:#1b2b37; --land-none:#454a50; --line:#a9c0cf;
  --ink:#e9f1f6; --muted:#9bb0be; --sheet:#152836; --sheet-line:#2b4558;
  --accent:#f5b53a; --accent-ink:#2a1a00; --ok:#4cc27b; --ok-soft:#24543a; --ng:#f06a52; --ng-soft:#5b2a22;
  --r1:#2c4a66; --r2:#5a3540; --r3:#355239; --r4:#5a4a26; --r5:#433a5e; --r6:#265250; --r7:#5a3f2d;
  --shadow:0 -6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1f22; --sea:#12304a; --land:#2b3c49; --land-dim:#1b2b37; --land-none:#454a50; --line:#a9c0cf;
  --ink:#e9f1f6; --muted:#9bb0be; --sheet:#152836; --sheet-line:#2b4558;
  --accent:#f5b53a; --accent-ink:#2a1a00; --ok:#4cc27b; --ok-soft:#24543a; --ng:#f06a52; --ng-soft:#5b2a22;
  --r1:#2c4a66; --r2:#5a3540; --r3:#355239; --r4:#5a4a26; --r5:#433a5e; --r6:#265250; --r7:#5a3f2d;
  --shadow:0 -6px 24px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:900px;margin:0 auto}

/* 上：問題バー */
.top{padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;min-height:56px}
.brand{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em;flex:1;min-width:0;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.ask{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ask .meta{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ask .q{font-family:var(--display);font-size:clamp(1.1rem,4.8vw,1.9rem);line-height:1.15;text-wrap:balance}
.ask .q em{font-style:normal;color:var(--ink);background:linear-gradient(transparent 62%,var(--accent) 62%);padding:0 .1em}
.ask .kana{font-size:.8rem;color:var(--muted);font-weight:700}
.iconbtn{flex:none;min-width:44px;height:44px;padding:0 10px;white-space:nowrap;border-radius:12px;border:2px solid var(--sheet-line);background:var(--sheet);color:var(--ink);font:700 .8rem var(--body);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.iconbtn.dbg-on{background:var(--accent);color:var(--accent-ink);border-color:var(--line)}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,.eye:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 中：地図 */
.mapwrap{position:relative;min-height:0;background:var(--sea);border-block:2px solid var(--sheet-line)}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
svg#map:active{cursor:grabbing}
.pref{fill:var(--land);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
/* コレクション：⓪グレー → ①地方の色 → ②色・陰影がリッチに（data-lv＝その県で正解したコースの数） */
.explore .pref{fill:var(--land-none)}
.explore .pref:not([data-lv="0"])[data-r="1"]{fill:var(--r1)} .explore .pref:not([data-lv="0"])[data-r="2"]{fill:var(--r2)} .explore .pref:not([data-lv="0"])[data-r="3"]{fill:var(--r3)}
.explore .pref:not([data-lv="0"])[data-r="4"]{fill:var(--r4)} .explore .pref:not([data-lv="0"])[data-r="5"]{fill:var(--r5)} .explore .pref:not([data-lv="0"])[data-r="6"]{fill:var(--r6)} .explore .pref:not([data-lv="0"])[data-r="7"]{fill:var(--r7)}
.explore .pref[data-lv="2"]{filter:saturate(1.8) brightness(.95)}
.explore .pref[data-lv="3"]{filter:saturate(2.3) brightness(.9) drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pref.off{fill:var(--land-dim);stroke-opacity:.35}
.pref.sel{fill:var(--accent)!important}
.pref.ok{fill:var(--ok-soft)!important}
.pref.miss{fill:var(--ng-soft)!important}
.pref.flash-ok{fill:var(--ok)!important}
.pref.flash-ng{fill:var(--ng)!important}
.pref.blink{animation:blink .5s ease-in-out 5}
@keyframes blink{0%,100%{fill:var(--land)}50%{fill:var(--ok)}}
.inset{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;opacity:.8}
.inset-cap{font-family:var(--body);font-weight:700;fill:var(--muted);font-size:9px}
.zoom{cursor:pointer}
.zoom circle{fill:var(--sheet);stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
.zoom path{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.zoom:hover circle{fill:var(--accent)}
.zooms-off #zooms,.region-quiz #zooms{display:none}
.labels{pointer-events:none;opacity:0;transition:opacity .12s}
.show-labels .labels{opacity:1}
.labels text{font-family:var(--body);font-weight:900;fill:var(--ink);stroke:var(--land);stroke-width:3px;paint-order:stroke;vector-effect:non-scaling-stroke;text-anchor:middle;dominant-baseline:central}
.labels text.off{display:none}
.tag{pointer-events:none}
.tag text{font-family:var(--body);font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}
.tag rect{fill:var(--ng)}

.eye{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:30px;width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--sheet);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:none}
.eye svg{width:34px;height:34px}
.eye.on{background:var(--accent);color:var(--accent-ink);transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.eye .cap{position:absolute;bottom:-22px;font-size:.68rem;font-weight:900;color:var(--ink);white-space:nowrap;background:var(--sheet);padding:1px 6px;border-radius:8px}
.zoomreset{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:10px;box-shadow:0 2px 0 var(--sheet-line);height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--sheet-line);background:var(--sheet);color:var(--ink);font:700 .85rem var(--body);cursor:pointer}
.combo{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--display);font-size:1.4rem;color:var(--accent-ink);background:var(--accent);padding:4px 16px;border-radius:999px;box-shadow:0 3px 0 var(--line);pointer-events:none}
.combo.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.4)}to{transform:translateX(-50%) scale(1)}}

/* 下：シート */
.sheet{background:var(--sheet);box-shadow:var(--shadow);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow-y:auto}
.sheet.home{max-height:33vh;gap:6px}
.home .chips{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.home .chip{min-height:40px;font-size:.8rem;letter-spacing:-.04em;padding:2px 3px;border-radius:11px;overflow:hidden}
.home .chip small{font-size:.64rem}
.home .chip.wide{grid-column:span 2}
.home #master{grid-column:1/-1}
.home .chips.modes{grid-template-columns:1fr 1fr}
.home .chips.modes .chip{min-height:48px;font-size:.95rem;letter-spacing:0}
.home .chips.modes .chip.now{background:var(--accent);color:var(--accent-ink)}
.sheet h2{margin:0;font-size:.82rem;letter-spacing:.1em;color:var(--muted);font-weight:900}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
.chip{min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--land);color:var(--ink);font:900 .92rem var(--body);white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 var(--line);padding:4px 6px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip small{font-size:.7rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.chip.wide{grid-column:1/-1;background:var(--accent);color:var(--accent-ink)}
.chip.wide small{color:var(--accent-ink);opacity:.8}
.info{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:2.2em}
.info .nm{font-family:var(--display);font-size:1.5rem}
.info .sub{color:var(--muted);font-weight:700;font-size:.9rem}
.hint{color:var(--muted);font-size:.85rem;font-weight:700;margin:0}
.fb{display:flex;align-items:center;gap:12px;min-height:58px}
.fb .mark{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.7rem;color:#fff}
.fb.ok .mark{background:var(--ok)} .fb.ng .mark{background:var(--ng)}
.fb .txt{flex:1;min-width:0;line-height:1.45}
.fb .txt b{font-family:var(--display);font-weight:400;font-size:1.2rem}
.fb .txt span{display:block;color:var(--muted);font-size:.86rem;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);font:900 1rem var(--body);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress i{width:14px;height:8px;border-radius:4px;background:var(--sheet-line)}
.progress i.ok{background:var(--ok)} .progress i.ng{background:var(--ng)} .progress i.now{background:var(--accent)} .progress i.hintd{background:var(--ok);opacity:.45}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.score .msg{font-weight:900;font-size:1.05rem}
.misslist{display:flex;gap:6px;flex-wrap:wrap}
.misslist span{background:var(--ng-soft);border-radius:8px;padding:3px 8px;font-weight:900;font-size:.9rem}
/* モード・コース */
.modebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-weight:900;font-size:.85rem}
.linkbtn{border:0;background:none;color:var(--ink);font:700 .85rem var(--body);text-decoration:underline;cursor:pointer;min-height:36px;padding:0 4px}
.courses{display:grid;gap:6px}
.course{display:flex;align-items:center;gap:10px;text-align:left;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--land);color:var(--ink);font:900 .95rem var(--body);cursor:pointer;box-shadow:0 3px 0 var(--line);padding:6px 12px}
.course .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sheet-line);display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:.9rem}
.course span{flex:1;min-width:0}
.course small{display:block;color:var(--muted);font-weight:700;font-size:.74rem}
.course.done{border-color:var(--ok)} .course.done .no{background:var(--ok);color:#fff}
.course:disabled{opacity:.5;cursor:default;box-shadow:none}
.rules{margin:0;padding-left:1.2em;font-size:.78rem;color:var(--muted);font-weight:700;line-height:1.5}
.medal{display:inline-block;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;font-weight:900;font-size:.8rem}
.medal.hinted{background:var(--sheet-line);color:var(--ink)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--land);color:var(--ink);font:900 1.1rem var(--body);cursor:pointer;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 6px;line-height:1.2}
.choice small{font-size:.74rem;color:var(--muted);font-weight:700}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok);border-color:var(--ok);color:#fff} .choice.right small{color:#fff}
.choice.wrong{background:var(--ng);border-color:var(--ng);color:#fff} .choice.wrong small{color:#fff}
.choice:focus-visible,.course:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" class="explore" viewBox="0 0 880 980" preserveAspectRatio="xMidYMid meet" aria-label="日本地図">
      <g id="prefs"></g>
      <g id="insetg"><polyline class="inset" points="-100000,712 -11,712 -11,800 52,884 52,100000"></polyline></g>
      <g class="labels" id="labels"></g>
      <g id="zooms"></g>
      <g class="tag" id="tag"></g>
    </svg>
    <div class="combo" id="combo" hidden></div>
    <button class="zoomreset" id="zoomreset" type="button">ぜんこく</button>
    <button class="eye" id="eye" type="button" aria-label="押している間だけ県名を表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span class="cap">おしてる間だけ</span>
    </button>
  </div>
  <section class="sheet" id="sheet" aria-live="polite"></section>
</div>

<script>
/* 地図データ：Natural Earth (public domain) 1:10m admin-1 を簡略化して埋め込み。
   小笠原・奄美・先島・大東の島は省略。沖縄県は左上の枠内に移動して表示。 */
const PATHS = __PATHS__;

/* ---------- 都道府県データ（項目は後から追加できる：facts に特産品など） ---------- */
const REGION_NAMES = ["", "北海道地方","東北地方","関東地方","中部地方","近畿地方","中国地方","四国地方","九州地方"];
const RAW = [
 [1,"北海道","ほっかいどう",1],[2,"青森県","あおもりけん",2],[3,"岩手県","いわてけん",2],
 [4,"宮城県","みやぎけん",2],[5,"秋田県","あきたけん",2],[6,"山形県","やまがたけん",2],
 [7,"福島県","ふくしまけん",2],[8,"茨城県","いばらきけん",3],[9,"栃木県","とちぎけん",3],
 [10,"群馬県","ぐんまけん",3],[11,"埼玉県","さいたまけん",3],[12,"千葉県","ちばけん",3],
 [13,"東京都","とうきょうと",3],[14,"神奈川県","かながわけん",3],[15,"新潟県","にいがたけん",4],
 [16,"富山県","とやまけん",4],[17,"石川県","いしかわけん",4],[18,"福井県","ふくいけん",4],
 [19,"山梨県","やまなしけん",4],[20,"長野県","ながのけん",4],[21,"岐阜県","ぎふけん",4],
 [22,"静岡県","しずおかけん",4],[23,"愛知県","あいちけん",4],[24,"三重県","みえけん",5],
 [25,"滋賀県","しがけん",5],[26,"京都府","きょうとふ",5],[27,"大阪府","おおさかふ",5],
 [28,"兵庫県","ひょうごけん",5],[29,"奈良県","ならけん",5],[30,"和歌山県","わかやまけん",5],
 [31,"鳥取県","とっとりけん",6],[32,"島根県","しまねけん",6],[33,"岡山県","おかやまけん",6],
 [34,"広島県","ひろしまけん",6],[35,"山口県","やまぐちけん",6],[36,"徳島県","とくしまけん",7],
 [37,"香川県","かがわけん",7],[38,"愛媛県","えひめけん",7],[39,"高知県","こうちけん",7],
 [40,"福岡県","ふくおかけん",8],[41,"佐賀県","さがけん",8],[42,"長崎県","ながさきけん",8],
 [43,"熊本県","くまもとけん",8],[44,"大分県","おおいたけん",8],[45,"宮崎県","みやざきけん",8],
 [46,"鹿児島県","かごしまけん",8],[47,"沖縄県","おきなわけん",8]
];
/* 県庁所在地・4択の選択肢・政令指定都市（data/cities.json。tools/build_cities.py で総務省の一覧と照合済み）
   capitals[県コード] = [[正解, よみ], [同じ都道府県の別の市区町村, よみ] x3]。東京都は都庁のある区（新宿区）を正解にする */
const CITIES = __CITIES__;
// 「県庁」の呼び方：北海道は道庁、京都・大阪は府庁、東京は都庁
const officeOf = name => name === "北海道" ? "道庁" : name === "東京都" ? "都庁" : /府$/.test(name) ? "府庁" : "県庁";
const PREFS = RAW.map(([code,name,kana,r]) => ({
  code, name, kana, region: REGION_NAMES[r], office: officeOf(name),
  capital: CITIES.capitals[code][0][0], capitalKana: CITIES.capitals[code][0][1],
  short: name === "北海道" ? "北海道" : name.replace(/[都府県]$/, ""),
  facts: {}   // 例：facts.apple = 1（りんご生産1位）などを後で追加
}));
// 東京都は「都庁がある区」として示し、教材の所在地表記「東京」とまぜない
const capitalLabel = p => p.code === 13 ? `都庁がある区 ${p.capital}` : `${p.office}所在地 ${p.capital}`;
const byCode = c => PREFS[c - 1];
const range = (a,b) => Array.from({length:b-a+1}, (_,i)=>a+i);

/* クイズの出題範囲（地方） */
const AREAS = [
  {id:"tohoku", name:"北海道・東北", codes:range(1,7), tint:1},
  {id:"kanto", name:"関東", codes:range(8,14), tint:2},
  {id:"chubu", name:"中部", codes:range(15,23), tint:3},
  {id:"kinki", name:"近畿", codes:range(24,30), tint:4},
  {id:"chugoku", name:"中国", codes:range(31,35), tint:5},
  {id:"shikoku", name:"四国", codes:range(36,39), tint:6},
  {id:"kyushu", name:"九州・沖縄", codes:range(40,47), tint:7},
  {id:"zenkoku", name:"全国", codes:range(1,47), wide:true}
];

   rec[モードid][コースid] = { best:{地方id:ヒントなし正解数}, got:{key:1}（正解したことがある）, clean:{key:1}（ヒントなしで正解）,
                              miss:{key:回数}, complete:bool, master:null|{at, clean} }

  return m[courseId] = Object.assign({best:{}, got:{}, clean:{}, miss:{}, complete:false, master:null}, m[courseId] || {});
}

const lowerModes = () => MODES.filter(m => m.rank <= curMode().rank);
const recsOf = courseId => lowerModes().map(m => (store.rec[m.id] || {})[courseId]).filter(Boolean);

function tone(freqs, dur=0.09, type="triangle"){
  if (store.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*dur;
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur*1.6); o.start(t); o.stop(t+dur*1.7);
    });
  } catch(e){}
}

/* ---------- 表示範囲（ズーム・移動） ---------- */
const FULL = [-108, 12, 870, 1010];
let view = {x:0, y:0, w:880, h:980};
function box() { const r = svg.getBoundingClientRect(); return {w: Math.max(r.width,1), h: Math.max(r.height,1), l:r.left, t:r.top}; }
function apply() {
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  const fs = Math.max(6, Math.min(22, view.w / 26));
  gLabels.setAttribute("font-size", fs.toFixed(1));
  gTag.setAttribute("data-fs", fs);
  // 本物の沖縄が見えていない間だけ、枠内の沖縄を出す
  // 全国くらい引いている時、または本物の沖縄が画面外の時は枠内の沖縄を使う
  insetShown = view.w > 700 || view.y + view.h < OKI_TOP - 4;

  okiLabelCopy.style.display = insetShown ? "" : "none";
  pathEl[47].style.visibility = labelEl[47].style.visibility = insetShown ? "hidden" : "";
  // 虫眼鏡は画面上で同じ大きさ。広く見ている時だけ出す
  const s = view.w / box().w;
  svg.classList.toggle("zooms-off", view.w < 330);
  zoomEls.forEach(g => g.setAttribute("transform", `translate(${g.dataset.x} ${g.dataset.y}) scale(${s})`));
}
function setView(x, y, w) {
  const b = box(); w = Math.max(70, Math.min(1400, w));
  view = {x, y, w, h: w * b.h / b.w}; apply();
}
let fitToken = 0;
function fitBox(bb, animate=true) {
  // 右下の目ボタンにかからないよう、下を少しあけて合わせる
  const b = box(), R = Math.min(40, b.h * 0.1), ar = b.w / (b.h - R), pad = 0.06;
  let w = bb[2]-bb[0], h = bb[3]-bb[1];
  w *= 1+pad*2; h *= 1+pad*2;
  if (w / h < ar) w = h * ar;
  const cx = (bb[0]+bb[2])/2, cy = (bb[1]+bb[3])/2, Hfree = w / ar;
  const target = {x: cx - w/2, y: cy - Hfree/2, w};
  const token = ++fitToken;   // 新しい移動が始まったら、前の移動アニメは止める
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return setView(target.x, target.y, target.w);
  const from = {...view}, t0 = performance.now(), D = 420;

    if (token !== fitToken) return;
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1-k, 3);
    setView(from.x + (target.x-from.x)*e, from.y + (target.y-from.y)*e, from.w + (target.w-from.w)*e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
const unionBox = codes => codes.reduce((a,c) => { const b = boxOf[c]; return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[2],b[2]),Math.max(a[3],b[3])]; }, [1e9,1e9,-1e9,-1e9]);

/* ---------- タップ・ドラッグ・ピンチ ---------- */
const ptrs = new Map(); let gesture = null;
function svgPt(px, py) { const b = box(); return {x: view.x + (px-b.l)/b.w*view.w, y: view.y + (py-b.t)/b.h*view.h}; }
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) {
    const z = e.target.closest ? e.target.closest("[data-zoom]") : null;
    const el = !z && e.target.closest ? e.target.closest("[data-code]") : null;
    gesture = {type:"tap", sx:e.clientX, sy:e.clientY, v:{...view}, code: el ? +el.dataset.code : null, zoom: z ? z.dataset.zoom : null};
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    gesture = {type:"pinch", d0: Math.hypot(a.x-b.x, a.y-b.y), v:{...view}, m: svgPt(mid.x, mid.y)};
  }
});
svg.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const b = box();
  if (gesture.type === "pinch" && ptrs.size >= 2) {
    const [p, q] = [...ptrs.values()];
    const d = Math.max(10, Math.hypot(p.x-q.x, p.y-q.y));
    const w = Math.max(70, Math.min(1400, gesture.v.w * gesture.d0 / d));
    const mx = ((p.x+q.x)/2 - b.l) / b.w, my = ((p.y+q.y)/2 - b.t) / b.h;
    setView(gesture.m.x - mx*w, gesture.m.y - my*(w*b.h/b.w), w);
  } else if (gesture.type !== "pinch") {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (gesture.type === "tap" && Math.hypot(dx, dy) > 10) gesture.type = "pan";
    if (gesture.type === "pan") setView(gesture.v.x - dx/b.w*gesture.v.w, gesture.v.y - dy/b.h*gesture.v.h, gesture.v.w);
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && gesture.type === "tap" && e.type === "pointerup") {
    if (gesture.zoom) zoomArea(gesture.zoom);
    else if (gesture.code) handleTap(gesture.code);
  }

  else if (gesture && gesture.type === "pinch") gesture = {type:"pan-locked"};

const top_ = document.getElementById("top"), sheet = document.getElementById("sheet"), combo = document.getElementById("combo");
let mode = "home", quiz = null, selected = null;

// 前のクイズの遅延処理を、ホームや次のクイズへ持ち越さない。
const quizTimers = new Set();
function cancelQuizTimers() {
  quizTimers.forEach(id => clearTimeout(id)); quizTimers.clear();
}
function quizTimeout(fn, delay) {
  const owner = quiz;
  const id = setTimeout(() => {
    quizTimers.delete(id);
    if (mode === "quiz" && quiz === owner) fn();
  }, delay);
  quizTimers.add(id);
}

function muteBtn(){ return `<button class="iconbtn" id="mute" type="button" aria-label="音のオンオフ">${store.mute ? "音OFF" : "音ON"}</button>`; }
function bindMute(){ const m = document.getElementById("mute"); if (m) m.onclick = () => { store.mute = !store.mute; save(); m.textContent = store.mute ? "音OFF" : "音ON"; }; }
const byId = id => document.getElementById(id);

/* デバッグ：ONの間はクイズを高速で自動正解する（画面遷移の確認用。記録・マスターにもそのまま残る。保存はせず再読み込みでOFF） */
let debug = false;
const DEBUG_ANSWER_MS = 120, DEBUG_NEXT_MS = 150;
function titleBtn(){ return `<button class="iconbtn" id="toTitle" type="button" aria-label="タイトル画面へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></button>`; }
function debugBtn(){ return `<button class="iconbtn${debug ? " dbg-on" : ""}" id="dbg" type="button" aria-pressed="${debug}" aria-label="デバッグモード">DBG</button>`; }
// 上部バーの共通ボタン（タイトルへ・デバッグ・音）をつなぐ
function bindBar() {
  bindMute();
  const t = byId("toTitle"); if (t) t.onclick = modeSelect;
  const d = byId("dbg");
  if (d) d.onclick = () => {
    debug = !debug; d.classList.toggle("dbg-on", debug); d.setAttribute("aria-pressed", debug);
    if (debug && mode === "quiz" && !quiz.answered) quizTimeout(autoAnswer, DEBUG_ANSWER_MS);
  };
}
function autoAnswer() {
  if (!debug || quiz.answered) return;
  const q = quiz.q;
  if (quiz.type.kind === "choice") answerChoice(q.order.findIndex(o => o[0] === q.correct));
  else handleTap(q.answers[0]);
}

// ホーム系の画面（モード選択・コース一覧・コース）に共通：地図をコレクションの色で見せ、県をさわると名前を出す
function toHomeScreen(box = FULL) {
  cancelQuizTimers(); eyeOff();
  mode = "home"; quiz = null; selected = null; clearTag(); combo.hidden = true;
  JapanMap.resetColors(); svg.classList.add("explore"); svg.classList.remove("region-quiz");
  Object.values(labelEl).forEach(t => t.classList.remove("off"));
  const lv = prefLevels();
  PREFS.forEach(p => pathEl[p.code].dataset.lv = lv[p.code]);
  okiCopy.dataset.lv = lv[47];
  homeBox = box; fitLater(box);
  sheet.classList.add("home");
  return lv;
}

/* OP：モード選択 */
function modeSelect() {
  toHomeScreen();
  top_.innerHTML = `<div class="brand">日本地図タップクイズ<small>サッ記マン・中学受験 社会</small></div>${debugBtn()}${muteBtn()}`;
  bindBar();
  sheet.innerHTML = `
    <h2>モードをえらんでね</h2>
    <div class="chips modes">${MODES.map(m => `<button class="chip${m.id === store.mode ? " now" : ""}" type="button" data-mode="${m.id}">${m.name}</button>`).join("")}</div>
    <p class="hint">上のモードほど学べるコースがふえるよ（下のモードの内容もぜんぶ入っている）。学年ごとの範囲は仮の設定です。</p>`;
  sheet.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { store.mode = b.dataset.mode; save(); home(); });
}

function courseStatus(c) {
  if (!c.ready) return {text: "準備中", off: true};
  if (!inMode(c)) return {text: `${modeOf(c.from).name}から`, off: true};
  if (!unlocked(c)) {
    const pre = courseOf(c.unlock.course);
    return {text: c.unlock.need === "master" ? `${crown(pre)}で開く` : `${pre.name}の全国の挑戦を終えると開く`, off: true};
  }
  const m = masterOf(c.id);
  if (m) return {text: crown(c), done: true};
  const got = new Set(); recsOf(c.id).forEach(r => Object.keys(r.got).forEach(k => got.add(k)));
  return {text: `正解した問題 ${got.size} / ${fullCount(c.id)}`};
}

/* コース一覧（モードごと） */
function home() {
  if (!modeOf(store.mode)) return modeSelect();
  const lv = toHomeScreen();
  const colored = Object.values(lv).filter(n => n > 0).length;
  top_.innerHTML = `${titleBtn()}<div class="brand">日本地図タップクイズ<small>${curMode().name}</small></div>${debugBtn()}${muteBtn()}`;
  bindBar();
  sheet.innerHTML = `
    <div class="modebar"><span class="badge">${curMode().name}</span><button class="linkbtn" id="chgMode" type="button">モードをかえる</button></div>
    <div class="info" id="info"><span class="hint">色がついた県 ${colored} / 47。正解した県から地図に色がつくよ。</span></div>
    <h2>${TRACKS[0].name}</h2>
    <div class="courses">${COURSES.map((c, i) => {
      const s = courseStatus(c);
      return `<button class="course${s.done ? " done" : ""}" type="button" data-course="${c.id}"${s.off ? " disabled" : ""}><b class="no">${s.done ? "👑" : i+1}</b><span>${c.name}<small>${s.text}</small></span></button>`;
    }).join("")}</div>
    <h2>${TRACKS[1].name}</h2><p class="hint">${TRACKS[1].note}</p>
    <h2>ごほうび</h2><p class="hint">新しいタップゲーム：準備中</p>
    <h2>リセット</h2><div class="row" id="resetRow"><button class="btn" id="reset" type="button">進捗をぜんぶ消す</button></div>`;
  byId("chgMode").onclick = modeSelect;
  // 進捗の全初期化（すべてのモードの記録・👑・地図の色、v4 の記録も消す）。モードと音の設定は残す。押しまちがい防止に2段階
  byId("reset").onclick = () => {
    byId("resetRow").innerHTML = `<p class="hint" style="flex-basis:100%">すべてのモードの記録・👑マスター・地図の色が消えて、最初の状態にもどります。</p>
      <button class="btn primary" id="resetYes" type="button">消す</button><button class="btn" id="resetNo" type="button">やめる</button>`;
    byId("resetYes").onclick = () => { store.rec = {}; store.best = {}; store.miss = {}; save(); home(); };
    byId("resetNo").onclick = home;
  };
  sheet.querySelectorAll("[data-course]").forEach(b => b.onclick = () => coursePage(courseOf(b.dataset.course)));
}

/* コース：全国の挑戦（マスター判定あり）と、地方ごとの練習 */
function coursePage(c) {
  toHomeScreen();
  const type = QUIZ_TYPES[c.id], total = fullCount(c.id), m = masterOf(c.id), zen = AREAS.find(a => a.wide);
  const best = Object.assign({}, ...recsOf(c.id).map(r => r.best));
  top_.innerHTML = `${titleBtn()}<div class="brand">${c.name}<small>${curMode().name}</small></div>${debugBtn()}<button class="iconbtn" id="back" type="button">もどる</button>`;
  bindBar(); byId("back").onclick = home;
  const regions = AREAS.filter(a => !a.wide).map(a => ({a, n: type.make(a.codes).length})).filter(x => x.n > 0);
  sheet.innerHTML = `
    <div class="modebar">${m ? `<span class="medal">${crown(c)}</span>` : ""}</div>
    <div class="chips"><button class="chip wide" type="button" id="master">全国の挑戦<small>${total}問${best.zenkoku != null ? `・ベスト ${best.zenkoku}/${total}` : ""}</small></button></div>
    <h2>地方ごとの練習</h2>
    <div class="chips">${regions.map(({a, n}) => {
      // 県名タップは v4 の地方ベスト（store.best）も参考に出す
      const b = Math.max(best[a.id] ?? -1, c.id === "prefName" ? (store.best[a.id] ?? -1) : -1);
      return `<button class="chip" type="button" data-area="${a.id}">${a.name}<small>${b >= 0 ? `ベスト ${b}/${n}` : `${n}問`}</small></button>`;
    }).join("")}</div>
    <h2>このコースのきまり</h2>
    <ul class="rules">${c.rules.map(r => `<li>${r}</li>`).join("")}<li>目のボタン（ヒント）を1回でも使うと👑マスターにはならない（正解は記録に残り、地図の色もつく）</li></ul>`;
  byId("master").onclick = () => startQuiz(c, zen, zen.codes, {master: true});
  sheet.querySelectorAll("[data-area]").forEach(b => b.onclick = () => { const a = AREAS.find(x => x.id === b.dataset.area); startQuiz(c, a, a.codes); });
}

function showInfo(code) {
  const p = byCode(code);
  if (selected) pathEl[selected].classList.remove("sel");
  selected = code; pathEl[code].classList.add("sel");
  const info = byId("info");
  if (info) info.innerHTML = `<span class="nm">${p.name}</span><span class="sub">${p.kana}・${p.region}・${capitalLabel(p)}</span>`;
}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

// opts.master：全国の挑戦（完了・マスター判定の対象）／opts.keys：まちがえた問題だけ（判定の対象外）
function startQuiz(course, area, codes, opts={}) {
  cancelQuizTimers(); eyeOff();
  const type = QUIZ_TYPES[course.id];
  sheet.classList.remove("home");
  mode = "quiz"; selected = null; clearTag(); JapanMap.resetColors(); svg.classList.remove("explore");
  const inArea = new Set(area.codes);
  PREFS.forEach(p => { pathEl[p.code].classList.toggle("off", !inArea.has(p.code)); labelEl[p.code].classList.toggle("off", !inArea.has(p.code)); });
  homeBox = area.wide ? FULL : unionBox(area.codes); fitLater(homeBox);
  svg.classList.toggle("region-quiz", !area.wide);
  let qs = type.make(codes);
  if (opts.keys) qs = qs.filter(q => opts.keys.includes(q.key));
  const master = !!opts.master && !opts.keys && area.wide && qs.length === fullCount(course.id);
  quiz = { course, type, area, opts, master, modeId: curMode().id, qs: shuffle(qs), i: 0, combo: 0, maxCombo: 0, log: [], inArea };
  nextQ();
}

function progressBar(){
  return `<div class="progress">${quiz.qs.map((q,i) => {
    const l = quiz.log[i]; return `<i class="${l ? (l.ok ? (l.hint ? "hintd" : "ok") : "ng") : (i === quiz.i ? "now" : "")}"></i>`;
  }).join("")}</div>`;
}

function nextQ() {
  eyeOff(); clearTag();
  if (quiz.i >= quiz.qs.length) return result();
  const q = quiz.q = quiz.qs[quiz.i]; q.hint = false; quiz.answered = false;
  // 4択は問いを選択肢のすぐ上（シート）に置き、上のバーには進み具合だけを出す
  const choice = quiz.type.kind === "choice";
  const askHtml = `<span class="q">${q.text}</span><span class="kana">${q.sub || ""}</span>`;
  top_.innerHTML = `${titleBtn()}<div class="ask"><span class="meta">${quiz.course.name}・${quiz.master ? "全国の挑戦" : quiz.area.name}　${quiz.i+1} / ${quiz.qs.length}</span>${choice ? "" : askHtml}</div>${debugBtn()}<button class="iconbtn" id="quit" type="button">やめる</button>`;
  bindBar(); byId("quit").onclick = home;
  if (debug) quizTimeout(autoAnswer, DEBUG_ANSWER_MS);
  if (quiz.type.kind === "choice") {
    // 対象の都道府県を地図で示し、選択肢の並びは毎回まぜる
    Object.values(pathEl).forEach(p => p.classList.remove("sel", "ok", "miss"));
    pathEl[q.focus].classList.add("sel");
    if (quiz.area.wide) fitLater(unionBox(areaOfPref(q.focus).codes));
    q.order = shuffle(q.choices);
    sheet.innerHTML = `${progressBar()}<div class="ask">${askHtml}</div><div class="choices">${q.order.map(([n, k], j) =>
      `<button class="choice" type="button" data-j="${j}">${n}<small>${k}</small></button>`).join("")}</div>`;
    const owner = quiz;
    sheet.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (quiz === owner && mode === "quiz") answerChoice(+b.dataset.j); });
  } else {
    sheet.innerHTML = `${progressBar()}<p class="hint">地図の県をタップしてね。わからない時は目のボタン（押している間だけ県名）。</p>`;
  }
}

// 1問の正誤を記録する。正解は got に積むだけで、まちがえても消えない
function logAnswer(ok) {
  const q = quiz.q, r = rec(quiz.modeId, quiz.course.id);
  quiz.log[quiz.i] = {ok, hint: q.hint, key: q.key, pref: q.prefs[0]};
  if (ok) { r.got[q.key] = 1; if (!q.hint) r.clean[q.key] = 1; }
  else r.miss[q.key] = (r.miss[q.key] || 0) + 1;
  save();
}

function noteHtml(code) {
  const ns = GEO_NOTES[code] || [];
  return ns.map(n => `<span>【${GEO_THEMES[n.theme] || ""}】${n.text}</span>`).join("");
}

function afterAnswer(ok, html) {
  const q = quiz.q;
  if (ok) {
    sndOk();
    if (q.hint) quiz.combo = 0; else { quiz.combo++; quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo); }
    if (quiz.combo >= 2) { combo.textContent = `${quiz.combo}れんぞく！`; combo.hidden = false; combo.classList.remove("pop"); void combo.offsetWidth; combo.classList.add("pop"); }
    else combo.hidden = true;
    sheet.insertAdjacentHTML("beforeend", html);
    quizTimeout(() => { quiz.i++; nextQ(); }, debug ? DEBUG_NEXT_MS : 1300);
  } else {
    sndNg(); quiz.combo = 0; combo.hidden = true;
    sheet.insertAdjacentHTML("beforeend", `${html}<div class="row"><button class="btn primary" id="next" type="button">つぎへ</button></div>`);
    const owner = quiz;
    byId("next").onclick = () => { if (quiz !== owner || mode !== "quiz") return; Object.values(pathEl).forEach(p => p.classList.remove("blink")); quiz.i++; nextQ(); };
  }
}

function answerChoice(j) {
  if (quiz.answered) return;
  const q = quiz.q, pick = q.order[j], ok = pick[0] === q.correct;
  quiz.answered = true; eyeOff();
  logAnswer(ok);
  sheet.querySelectorAll("[data-j]").forEach(b => {
    const c = q.order[+b.dataset.j]; b.disabled = true;
    if (c[0] === q.correct) b.classList.add("right"); else if (+b.dataset.j === j) b.classList.add("wrong");
  });
  sheet.querySelector(".progress").outerHTML = progressBar();
  const ans = q.choices[0];
  afterAnswer(ok, ok
    ? `<div class="fb ok"><div class="mark">◯</div><div class="txt"><b>せいかい！ ${ans[0]}</b><span>${q.hint ? "（ヒントを見て正解）" : ""}${q.explain}</span>${noteHtml(q.focus)}</div></div>`
    : `<div class="fb ng"><div class="mark">✕</div><div class="txt"><b>正しくは ${ans[0]}</b><span>${q.explain}</span>${noteHtml(q.focus)}</div></div>`);
}

function handleTap(code) {
  tapHandlers.forEach(cb => { try { cb(code); } catch(e){} });
  if (mode === "home") return showInfo(code);
  if (mode !== "quiz" || quiz.type.kind !== "tap" || quiz.answered || !quiz.inArea.has(code)) return;
  const q = quiz.q, ok = q.answers.includes(code);
  quiz.answered = true; eyeOff();
  const p = byCode(code), ans = byCode(q.answers[0]);
  logAnswer(ok);
  if (quiz.course.id === "prefName" && !ok) { store.miss[ans.code] = (store.miss[ans.code] || 0) + 1; save(); }
  sheet.innerHTML = progressBar();
  if (ok) {
    pathEl[code].classList.add("flash-ok");
    quizTimeout(() => { pathEl[code].classList.remove("flash-ok"); pathEl[code].classList.add("ok"); }, 450);
    afterAnswer(true, `<div class="fb ok"><div class="mark">◯</div><div class="txt"><b>せいかい！ ${ans.name}</b><span>${q.hint ? "（ヒントを見て正解）" : ""}${q.explain}</span>${noteHtml(ans.code)}</div></div>`);
  } else {
    pathEl[code].classList.add("flash-ng"); showTag(code, p.short);
    quizTimeout(() => pathEl[code].classList.remove("flash-ng"), 900);
    pathEl[ans.code].classList.add("miss");
    JapanMap.highlightPrefecture(ans.code);
    afterAnswer(false, `<div class="fb ng"><div class="mark">✕</div><div class="txt"><b>そこは ${p.name}</b><span>${ans.name}は、光っているところ。${q.explain}</span>${noteHtml(ans.code)}</div></div>`);
  }
}

function result() {
  cancelQuizTimers(); eyeOff();
  Object.values(pathEl).forEach(p => p.classList.remove("flash-ok", "flash-ng", "blink"));
  // 正解した県の色は、途中の遅延処理が取り消されても結果画面で付けそろえる
  if (quiz.type.kind === "tap") quiz.log.forEach(l => l.ok && pathEl[l.pref].classList.add("ok"));
  mode = "result"; combo.hidden = true; clearTag();
  const course = quiz.course, total = quiz.qs.length, correct = quiz.log.filter(l => l.ok).length, clean = quiz.log.filter(l => l.ok && !l.hint).length;
  const missed = quiz.log.filter(l => !l.ok);
  const r = rec(quiz.modeId, course.id);
  const before = COURSES.filter(c => c.ready && inMode(c) && !unlocked(c)).map(c => c.id);
  let newMaster = null;
  if (quiz.master) {
    // 全国の挑戦を最後まで解いた。47（または全都市）を重複なく、ヒントなしで全問正解したときだけ👑マスター
    r.complete = true;
    r.best.zenkoku = Math.max(r.best.zenkoku ?? 0, clean);
    const keys = new Set(quiz.log.map(l => l.key));
    if (clean === total && keys.size === total && total === fullCount(course.id) && !isMaster(r)) {
      newMaster = {at: Date.now(), clean: true}; r.master = newMaster;
    }
  } else if (!quiz.opts.keys && !quiz.area.wide) {
    r.best[quiz.area.id] = Math.max(r.best[quiz.area.id] ?? 0, clean);
  }
  save();
  const opened = COURSES.filter(c => before.includes(c.id) && unlocked(c));
  const msg = newMaster ? `${crown(course)}！` : clean === total ? "パーフェクト！" : correct === total ? "全問正解！ ヒントなしで👑マスター" : missed.length <= 2 ? "あと少し！ まちがえた問題をもう一回" : "まちがえた問題だけ、くりかえそう";
  const label = l => course.id === "designated" ? CITIES.designated[l.key][0] : course.id === "capital" ? `${byCode(l.pref).name}（${CITIES.capitals[l.pref][0][0]}）` : byCode(l.pref).name;
  top_.innerHTML = `${titleBtn()}<div class="ask"><span class="meta">${course.name}・${quiz.master ? "全国の挑戦" : quiz.area.name}　けっか</span><span class="q">${msg}</span></div>${debugBtn()}${muteBtn()}`;
  bindBar();
  sheet.innerHTML = `
    <div class="score"><span class="big">${correct}<small style="font-size:1.2rem"> / ${total}</small></span><span class="msg">ヒントなし正解 ${clean}問・最高 ${quiz.maxCombo}れんぞく</span></div>
    ${newMaster ? `<div class="modebar"><span class="medal">${crown(course)}</span></div>` : ""}
    ${opened.map(c => `<p class="hint"><b>「${c.name}」コースが開いたよ！</b></p>`).join("")}
    ${missed.length ? `<h2>まちがえた問題</h2><div class="misslist">${missed.map(l => `<span>${label(l)}</span>`).join("")}</div>` : ""}
    <div class="row">
      ${missed.length ? `<button class="btn primary" id="retryMiss" type="button">まちがえた問題だけ もう一回</button>` : ""}
      <button class="btn${missed.length ? "" : " primary"}" id="retry" type="button">もう一回</button>
      <button class="btn" id="back" type="button">コースにもどる</button>
    </div>`;
  const area = quiz.area, opts = quiz.opts, missKeys = missed.map(l => l.key);
  if (missed.length) byId("retryMiss").onclick = () => startQuiz(course, area, area.codes, {keys: missKeys});
  byId("retry").onclick = () => startQuiz(course, area, area.codes, opts);
  byId("back").onclick = () => coursePage(course);
}

window.addEventListener("load", home);
if (document.readyState === "complete") home();
</script>
