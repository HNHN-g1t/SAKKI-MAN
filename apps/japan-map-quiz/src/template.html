<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本地図タップクイズ</title>
<!-- ファビコンは公開サイトの直下（site/ から tools/build_site.py で配置）。?v= はスマホの覚え込み対策で、差し替えたら上げる -->
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" href="../favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="../icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* サッと記憶のサッ記マン：ブランド黄と墨の配色。問題画面は白を基調にし、黄色は選択・正解・主要ボタンだけに使う。
   色はこの3か所（:root／ダーク2か所）の変数でだけ定義する。ほかの場所に色コードを書かない。
   --brand と --on-brand はダークでも変えない（黄色の上の文字は常に墨。白やクリームの上に黄色の文字は置かない） */
:root{
  --brand:#FED003; --on-brand:#282727;
  --ink:#282727; --paper:#FFFFFF; --cream:#FEF3E6; --sea:#DCE6EA; --bg:#ECEBE9;
  --muted:#5E5A58; --line-soft:#CFCCCA; --off:#E1E1DF;
  --ok:#1E7B45; --ng:#C23A2B; --on-strong:#FFFFFF; --ok-soft:#CBEBD6; --ng-soft:#F9D4CD;
  --land-none:#C9CCCF; --tier-a:#FFFFFF; --tier-b:#FEF3E6; --tier-c:#FFF4BF; --rich:#FFE680; --rich2:#FFDA4D;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  /* 文字サイズ7段階・余白6段階・角丸 */
  --fs12:12px; --fs14:14px; --fs16:16px; --fs20:20px; --fs28:28px; --fs40:40px; --fs56:56px;
  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s24:24px; --s32:32px;
  --r-btn:14px; --r-sheet:20px; --r-pill:999px; --bw:2.5px; --tap:48px;
  --marker:.45em;   /* 県名マーカーの太さ（ダークは文字に重ならない細い下線にする） */
  --scrim:#282727B3;   /* 暗証番号の入力のうしろを暗くする幕 */
  --river:#1F6FB2;     /* 地形コースの川の線 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#FEF3E6; --paper:#232222; --cream:#3A3632; --sea:#26313A; --bg:#141313;
  --muted:#C8BEB1; --line-soft:#4D4A47; --off:#2B2928;
  --ok:#1E7B45; --ng:#C23A2B; --ok-soft:#24543A; --ng-soft:#6A2A22;
  --land-none:#4B4B4B; --tier-a:#2F2D2B; --tier-b:#3A3632; --tier-c:#4A4227; --rich:#6B5A1C; --rich2:#7A6614;
  --marker:4px; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#FEF3E6; --paper:#232222; --cream:#3A3632; --sea:#26313A; --bg:#141313;
  --muted:#C8BEB1; --line-soft:#4D4A47; --off:#2B2928;
  --ok:#1E7B45; --ng:#C23A2B; --ok-soft:#24543A; --ng-soft:#6A2A22;
  --land-none:#4B4B4B; --tier-a:#2F2D2B; --tier-b:#3A3632; --tier-c:#4A4227; --rich:#6B5A1C; --rich2:#7A6614;
  --marker:4px; color-scheme:dark}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:var(--fs16);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);max-width:900px;margin:0 auto;background:var(--paper)}

/* 上の帯（白） */
.top{background:var(--paper);padding-block:var(--s8);padding-left:max(var(--s16),env(safe-area-inset-left,0px));padding-right:max(var(--s16),env(safe-area-inset-right,0px));display:flex;align-items:center;gap:var(--s8);min-height:64px;box-sizing:border-box}
.brand{font-family:var(--display);font-size:15px;flex:1;min-width:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;overflow:hidden;text-overflow:ellipsis;font-family:var(--body);font-weight:700;font-size:var(--fs12);color:var(--muted)}
.ask{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
.ask .meta{font-size:var(--fs14);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
/* 上部バーの見出し：1行目＝コース・ステージ名（入りきらなければ…で省略）、2行目＝何問目か／けっか */
.top .ask{gap:0}
.top .meta .nm{display:block;font-size:var(--fs12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta .num{display:block;font-size:var(--fs16);color:var(--ink);white-space:nowrap}
.ask .q{font-family:var(--body);font-weight:700;font-size:var(--fs28);line-height:1.5}
/* ふりがなは漢字の上（ruby） */
.ask .q rt{font-size:.42em;font-weight:700;color:var(--muted);letter-spacing:0}
.ask .q.long{font-size:var(--fs20)}
.ask .q.shout{font-family:var(--display);font-weight:400;font-size:var(--fs20)}
/* 県名だけ黄色のマーカー線（下半分） */
.ask .q em{font-style:normal;box-shadow:inset 0 calc(-1 * var(--marker)) 0 var(--brand)}
.ask .kana{font-size:var(--fs14);color:var(--muted);font-weight:700}

/* 進み具合：帯のすぐ下に画面幅いっぱい。いまの問題は背を高くする */
.pbar{display:flex;align-items:flex-end;gap:2px;background:var(--paper);padding:0 max(var(--s16),env(safe-area-inset-right,0px)) var(--s8) max(var(--s16),env(safe-area-inset-left,0px));min-height:12px}
.pbar:empty{min-height:0;padding-block:0}   /* 段は残す（消すとグリッドの段がずれる） */
.pbar i{flex:1;height:6px;border-radius:var(--r-pill);background:var(--line-soft)}
.pbar i.now{height:12px;background:var(--brand);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pbar i.ok{background:var(--ok)} .pbar i.ng{background:var(--ng)}
.pbar i.hintd{background:repeating-linear-gradient(135deg,var(--ok) 0 3px,var(--ok-soft) 3px 6px)}

/* ボタンは3種類：主要（黄色＋墨の枠＋真下の影。押すと沈む）／補助（白＋墨の枠、影なし）／最小限（文字だけ） */
.btn,.iconbtn,.chip,.course,.choice,.zoomreset{box-sizing:border-box;min-height:var(--tap);border:var(--bw) solid var(--ink);border-radius:var(--r-btn);background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:700;cursor:pointer}
.btn:active,.iconbtn:active,.chip:active,.course:active,.choice:active,.zoomreset:active{transform:translateY(2px)}
.btn.primary,.chip.wide{background:var(--brand);color:var(--on-brand);box-shadow:0 4px 0 var(--ink)}
.btn.primary:active,.chip.wide:active{transform:translateY(4px);box-shadow:none}
.linkbtn{border:0;background:none;color:var(--ink);font:700 var(--fs14) var(--body);text-decoration:underline;cursor:pointer;min-height:var(--tap);padding:0 var(--s4)}
#toTitle{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:0 var(--s8);line-height:1}
#toTitle svg{width:20px;height:20px}
#toTitle span{font-size:var(--fs12);font-weight:700}
.btn.restart{flex:none;align-self:stretch;margin-top:var(--s4)}
.iconbtn{flex:none;min-width:var(--tap);height:var(--tap);padding:0 var(--s12);white-space:nowrap;font-size:var(--fs14);display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
/* 上部バーのボタンは少し小さめ（44px）。見出しの幅をあける */
.top .iconbtn{min-width:44px;height:44px;padding:0 var(--s8);font-size:13px}
.top #toTitle svg{width:18px;height:18px}
.top #toTitle span{font-size:11px}
.iconbtn.dbg-on{background:var(--brand);color:var(--on-brand)}
.dbgbox{display:contents}
/* 上部バーの DBG・テストは小さな札を縦に重ねて、見出しの幅をあける */
.top .dbgbox{display:flex;flex:none;flex-direction:column;justify-content:center;gap:2px}
.top .dbgbox .iconbtn{height:21px;min-height:0;min-width:44px;padding:0 6px;font-size:11px;border-width:2px;border-radius:8px}
/* 暗証番号の入力 */
.pin{position:fixed;inset:0;z-index:10;background:var(--scrim);display:grid;place-items:center;padding:var(--s16)}
.pin-box{background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:var(--r-sheet);padding:var(--s24);width:min(320px,100%);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:var(--s12)}
.pin-box b{font-family:var(--display);font-weight:400;font-size:var(--fs20)}
.pin-dots{display:flex;gap:var(--s12)}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:var(--bw) solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s8);width:100%}
.pin-keys .btn{font-size:var(--fs20);min-height:56px}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.course:focus-visible,.choice:focus-visible,.zoomreset:focus-visible,.linkbtn:focus-visible,.eye:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* 地図（問題中は海と陸を落ち着かせ、黄色は選択・正解表示の時だけ） */
.mapwrap{position:relative;min-height:0;background:var(--sea)}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
svg#map:active{cursor:grabbing}
.pref{fill:var(--cream);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
/* ホーム：⓪まだの県はグレー → ①地方の3段階（A白・Bクリーム・C淡い黄）→ ②③色が濃くなる（data-lv＝正解したコースの数） */
.explore .pref{fill:var(--land-none)}
.explore .pref:not([data-lv="0"]):is([data-r="1"],[data-r="4"],[data-r="7"]){fill:var(--tier-a)}
.explore .pref:not([data-lv="0"]):is([data-r="2"],[data-r="5"]){fill:var(--tier-b)}
.explore .pref:not([data-lv="0"]):is([data-r="3"],[data-r="6"]){fill:var(--tier-c)}
.explore .pref[data-lv="2"]:is([data-r]){fill:var(--rich)}
.explore .pref:is([data-lv="3"],[data-lv="4"]):is([data-r]){fill:var(--rich2)}
/* 地方の境目（県境の約2.5倍）。ホームだけ表示し、タップは邪魔しない */
.region-line{fill:none;stroke:var(--ink);stroke-width:2.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
svg:not(.explore) .region-line{display:none}
.pref.off{fill:var(--off);stroke-opacity:.35}
/* 状態は色だけに頼らない：選択＝黄色＋墨の太枠／正解の場所＝太枠が3回脈打って残る */
.pref.sel{fill:var(--brand)!important;stroke-width:3px}
.pref.ok{fill:var(--ok-soft)!important}
.pref.miss{fill:var(--ng-soft)!important}
.pref.flash-ok{fill:var(--ok)!important}
.pref.flash-ng{fill:var(--ng)!important}
.pref.reveal{stroke-width:5px;animation:pulse .4s ease-in-out 3}
@keyframes pulse{50%{stroke-width:10px}}
.inset{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;opacity:.8}
/* 地形（山・河川・平野）：問題の対象の図形だけを出す。山地・山脈＝黄の太線、川＝青い線、平野＝黄の面、山＝黄の三角 */
.feat{display:none;pointer-events:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.feat.show{display:inline}
.feat.case{fill:none;stroke:var(--ink);stroke-width:12px}
.feat.range{fill:none;stroke:var(--brand);stroke-width:7px}
.feat.river.case{stroke:var(--paper);stroke-width:8px}
.feat.river{fill:none;stroke:var(--river);stroke-width:4px}
.feat.plain,.feat.peak{fill:var(--brand);stroke:var(--ink);stroke-width:2.5px}
.feat.plain{fill-opacity:.75}
.zoom{cursor:pointer}
.zoom circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
.zoom path{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.zoom:hover circle{fill:var(--brand)}
.zooms-off #zooms,.region-quiz #zooms{display:none}
.labels{pointer-events:none;opacity:0;transition:opacity .12s}
.show-labels .labels{opacity:1}
.labels text{font-family:var(--body);font-weight:700;fill:var(--ink);stroke:var(--cream);stroke-width:3px;paint-order:stroke;vector-effect:non-scaling-stroke;text-anchor:middle;dominant-baseline:central}
.labels text.off{display:none}
.tag{pointer-events:none}
.tag text{font-family:var(--body);font-weight:700;fill:var(--on-strong);text-anchor:middle;dominant-baseline:central}
.tag rect{fill:var(--ng)}

/* 目ボタン：墨の丸に黄色の目。押している間は黄色の丸に墨の目で4px沈む */
.eye{position:absolute;right:calc(var(--s16) + env(safe-area-inset-right,0px));bottom:calc(var(--r-sheet) + var(--s32) + var(--s8));width:64px;height:64px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--on-brand);color:var(--brand);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:none;padding:0}
.eye svg{width:34px;height:34px}
.eye.on{background:var(--brand);color:var(--on-brand);transform:translateY(4px);box-shadow:none}
.eye .cap{position:absolute;right:0;bottom:-26px;font-size:var(--fs12);font-weight:700;color:var(--ink);white-space:nowrap;background:var(--paper);border:1.5px solid var(--ink);padding:1px var(--s8);border-radius:var(--r-pill)}
.zoomreset{position:absolute;left:calc(var(--s16) + env(safe-area-inset-left,0px));top:var(--s12);padding:0 var(--s16);font-size:var(--fs14)}
.combo{position:absolute;left:50%;top:var(--s16);transform:translateX(-50%);font-family:var(--display);font-size:var(--fs20);color:var(--on-brand);background:var(--brand);border:var(--bw) solid var(--on-brand);padding:var(--s4) var(--s16);border-radius:var(--r-pill);pointer-events:none}
.combo.pop{animation:pop .3s ease-out 1}
@keyframes pop{50%{transform:translateX(-50%) scale(1.2)}}
/* けっか画面の大きな一言：地図の真ん中に札で出す。地図は触れるように素通し */
.clearmsg{position:absolute;inset:0 0 var(--r-sheet);display:grid;place-items:center;padding:var(--s16);pointer-events:none}
.clearmsg[hidden]{display:none}
.clearmsg span{max-width:min(90%,420px);text-align:center;font-family:var(--display);font-size:clamp(var(--fs20),6vw,var(--fs28));line-height:1.35;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;color:var(--on-brand);background:var(--brand);border:var(--bw) solid var(--on-brand);border-radius:var(--r-sheet);padding:var(--s16) var(--s24);box-shadow:0 6px 0 var(--on-brand);animation:clearpop .4s ease-out 1}
@keyframes clearpop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* 下のシート */
.sheet{position:relative;z-index:1;margin-top:calc(-1 * var(--r-sheet));background:var(--paper);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border-top:var(--bw) solid var(--ink);padding-block:var(--s16) calc(var(--s16) + env(safe-area-inset-bottom,0px));padding-left:max(var(--s16),env(safe-area-inset-left,0px));padding-right:max(var(--s16),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--s12);max-height:44vh;overflow-y:auto}
.sheet.home{max-height:36vh;gap:var(--s8)}
.sheet h2{margin:0;font-size:var(--fs14);color:var(--muted);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:var(--s8)}
.chip{font-size:var(--fs16);white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--s4) var(--s8)}
.chip small{font-size:var(--fs12);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.chip.wide{grid-column:1/-1}
.chip.wide small{color:var(--on-brand)}
.chip.now{background:var(--brand);color:var(--on-brand)}
.home .chips{grid-template-columns:repeat(4,minmax(0,1fr))}
.home .chip{font-size:var(--fs14);padding:2px var(--s4);overflow:hidden;white-space:normal;line-height:1.15;text-align:center}
.home .chip.wide{grid-column:span 2}
.home #master{grid-column:1/-1}
.home .chips.modes{grid-template-columns:1fr 1fr}
.home .chips.modes .chip{font-size:var(--fs16)}
.info{display:flex;align-items:baseline;gap:var(--s8);flex-wrap:wrap;min-height:2.2em}
.info .nm{font-weight:700;font-size:var(--fs20)}
.info .sub{color:var(--muted);font-weight:700;font-size:var(--fs14)}
.hint{color:var(--muted);font-size:var(--fs14);font-weight:700;margin:0;line-height:1.5}
/* 答えた後：左に記号の丸（56px。次回キャラクターの顔に差し替える場所）、右に文字 */
.fb{display:flex;align-items:center;gap:var(--s12);min-height:56px}
.face{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:var(--fs28);color:var(--on-strong)}
.fb.ok .face{background:var(--ok);animation:bounce .3s ease-out 1}
.fb.ng .face{background:var(--ng)}
@keyframes bounce{50%{transform:scale(1.2)}}
.fb .txt{flex:1;min-width:0;line-height:1.45}
.fb .txt b{display:block;font-weight:700;font-size:var(--fs20)}
.fb .txt span{display:block;color:var(--muted);font-size:var(--fs14);font-weight:700}
.fb .txt .head{display:block;color:var(--ink);font-size:var(--fs16);font-weight:700;line-height:1.5}
.fb .txt .head b{display:inline;font-size:var(--fs20)}
.fb .txt .head span{display:inline;color:var(--ink);font-size:inherit}
.fb .txt .head em{font-style:normal;box-shadow:inset 0 calc(-1 * var(--marker)) 0 var(--brand)}
.fb .txt .desc{margin-top:var(--s4)}
.row{display:flex;gap:var(--s8);flex-wrap:wrap}
.btn{flex:1 1 140px;font-size:var(--fs16);padding:0 var(--s12)}
.score{display:flex;align-items:baseline;gap:var(--s12);flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:var(--fs40);line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:var(--fs20)}
.score .msg{font-weight:700;font-size:var(--fs16)}
.misslist{display:flex;gap:var(--s8);flex-wrap:wrap}
.misslist span{background:var(--ng-soft);color:var(--ink);border-radius:var(--r-pill);padding:2px var(--s12);font-weight:700;font-size:var(--fs14)}
/* モード・コース */
.modebar{display:flex;align-items:center;gap:var(--s8);flex-wrap:wrap}
.badge{background:var(--brand);color:var(--on-brand);border-radius:var(--r-pill);padding:2px var(--s12);font-weight:700;font-size:var(--fs14)}
.courses{display:grid;gap:var(--s8)}
.course{display:flex;align-items:center;gap:var(--s12);text-align:left;min-height:56px;font-size:var(--fs16);padding:var(--s8) var(--s12)}
.course .no{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:var(--fs14)}
.course span{flex:1;min-width:0}
.course small{display:block;color:var(--muted);font-weight:700;font-size:var(--fs12)}
.course.done .no{background:var(--ok);color:var(--on-strong)}
.course:disabled{opacity:.5;cursor:default}
.rules{margin:0;padding-left:1.2em;font-size:var(--fs14);color:var(--muted);font-weight:700;line-height:1.5}
.medal{display:inline-block;background:var(--ok);color:var(--on-strong);border-radius:var(--r-pill);padding:2px var(--s12);font-weight:700;font-size:var(--fs14)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:var(--s8)}
.choice{min-height:64px;font-size:var(--fs20);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--s4) var(--s8);line-height:1.2}
.choice small{font-size:var(--fs12);color:var(--muted);font-weight:700}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok);border-color:var(--ok);color:var(--on-strong)} .choice.right small{color:var(--on-strong)}
.choice.wrong{background:var(--ng);border-color:var(--ng);color:var(--on-strong)} .choice.wrong small{color:var(--on-strong)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      <span class="cap">おしてる間だけ</span>

<script>
/* 地図データ：Natural Earth (public domain) 1:10m admin-1 を簡略化して埋め込み。
   小笠原・奄美・先島・大東の島は省略。沖縄県は左上の枠内に移動して表示。 */
const PATHS = __PATHS__;

/* ---------- 都道府県データ（項目は後から追加できる：facts に特産品など） ---------- */
const REGION_NAMES = ["", "北海道地方","東北地方","関東地方","中部地方","近畿地方","中国地方","四国地方","九州地方"];
const RAW = [
 [1,"北海道","ほっかいどう",1],[2,"青森県","あおもりけん",2],[3,"岩手県","いわてけん",2],
 [4,"宮城県","みやぎけん",2],[5,"秋田県","あきたけん",2],[6,"山形県","やまがたけん",2],
 [7,"福島県","ふくしまけん",2],[8,"茨城県","いばらきけん",3],[9,"栃木県","とちぎけん",3],
 [10,"群馬県","ぐんまけん",3],[11,"埼玉県","さいたまけん",3],[12,"千葉県","ちばけん",3],
 [13,"東京都","とうきょうと",3],[14,"神奈川県","かながわけん",3],[15,"新潟県","にいがたけん",4],
 [16,"富山県","とやまけん",4],[17,"石川県","いしかわけん",4],[18,"福井県","ふくいけん",4],
 [19,"山梨県","やまなしけん",4],[20,"長野県","ながのけん",4],[21,"岐阜県","ぎふけん",4],
 [22,"静岡県","しずおかけん",4],[23,"愛知県","あいちけん",4],[24,"三重県","みえけん",5],
 [25,"滋賀県","しがけん",5],[26,"京都府","きょうとふ",5],[27,"大阪府","おおさかふ",5],
 [28,"兵庫県","ひょうごけん",5],[29,"奈良県","ならけん",5],[30,"和歌山県","わかやまけん",5],
 [31,"鳥取県","とっとりけん",6],[32,"島根県","しまねけん",6],[33,"岡山県","おかやまけん",6],
 [34,"広島県","ひろしまけん",6],[35,"山口県","やまぐちけん",6],[36,"徳島県","とくしまけん",7],
 [37,"香川県","かがわけん",7],[38,"愛媛県","えひめけん",7],[39,"高知県","こうちけん",7],
 [40,"福岡県","ふくおかけん",8],[41,"佐賀県","さがけん",8],[42,"長崎県","ながさきけん",8],
 [43,"熊本県","くまもとけん",8],[44,"大分県","おおいたけん",8],[45,"宮崎県","みやざきけん",8],
 [46,"鹿児島県","かごしまけん",8],[47,"沖縄県","おきなわけん",8]
];
/* 県庁所在地・4択の選択肢・政令指定都市（data/cities.json。tools/build_cities.py で総務省の一覧と照合済み）
   capitals[県コード] = [[正解, よみ], [同じ都道府県の別の市区町村, よみ] x3]。東京都は都庁のある区（新宿区）を正解にする */
const CITIES = __CITIES__;
// 「県庁」の呼び方：北海道は道庁、京都・大阪は府庁、東京は都庁
const officeOf = name => name === "北海道" ? "道庁" : name === "東京都" ? "都庁" : /府$/.test(name) ? "府庁" : "県庁";
const PREFS = RAW.map(([code,name,kana,r]) => ({
  code, name, kana, region: REGION_NAMES[r], office: officeOf(name),
  capital: CITIES.capitals[code][0][0], capitalKana: CITIES.capitals[code][0][1],
  short: name === "北海道" ? "北海道" : name.replace(/[都府県]$/, ""),
  facts: {}   // 例：facts.apple = 1（りんご生産1位）などを後で追加
}));
// 東京都は「都庁がある区」として示し、教材の所在地表記「東京」とまぜない
const capitalLabel = p => p.code === 13 ? `都庁がある区 ${p.capital}` : `${p.office}所在地 ${p.capital}`;
const byCode = c => PREFS[c - 1];
const range = (a,b) => Array.from({length:b-a+1}, (_,i)=>a+i);

/* クイズの出題範囲（地方） */
const AREAS = [
  {id:"tohoku", name:"北海道・東北", codes:range(1,7), tint:1},
  {id:"kanto", name:"関東", codes:range(8,14), tint:2},
  {id:"chubu", name:"中部", codes:range(15,23), tint:3},
  {id:"kinki", name:"近畿", codes:range(24,30), tint:4},
  {id:"chugoku", name:"中国", codes:range(31,35), tint:5},
  {id:"shikoku", name:"四国", codes:range(36,39), tint:6},
  {id:"kyushu", name:"九州・沖縄", codes:range(40,47), tint:7},
  {id:"zenkoku", name:"全国", codes:range(1,47), wide:true}
];
const tintOf = c => AREAS.find(a => !a.wide && a.codes.includes(c)).tint;
const areaOfPref = c => AREAS.find(a => !a.wide && a.codes.includes(c));

/* ---------- 学年モード ----------
   範囲は「4年生 ⊆ 5年生 ⊆ 6年生 ⊆ 中学受験」の累積。上のモードでは下のモードのコースも学べる。
   どのコースを何年生から出すかは COURSES の from（仮の設定。学校の正式な学習範囲ではない）。 */
const MODES = [
  {id:"g4", name:"4年生モード", rank:1},
  {id:"g5", name:"5年生モード", rank:2},
  {id:"g6", name:"6年生モード", rank:3},
  {id:"exam", name:"中学受験モード", rank:4}
];
const modeOf = id => MODES.find(m => m.id === id);

/* ---------- 問題の種類（ここに追加していけば分野別に発展できる） ----------
   make(codes) は codes（県コード）にかかわる問題の配列を返す。共通の項目：
     key（記録用。県コードや都市番号）, prefs:[かかわる県コード], text, sub（よみ）, explain
   kind:"tap"    … answers:[正解の県コード]。地図をタップして答える
   kind:"choice" … choices:[[名前, よみ] x4], correct（正解の名前）, focus（地図で示す県） */
const QUIZ_TYPES = {
  prefName: {
    title: "県名タップ", kind: "tap",
    make: codes => codes.map(c => {
      const p = byCode(c);
      return { key: c, prefs: [c], text: `<em>${p.name}</em>はどこ？`, sub: p.kana, answers: [c], explain: capitalLabel(p) };
    })
  },
  capital: {
    title: "県庁所在地 4択", kind: "choice",
    make: codes => codes.map(c => {
      const p = byCode(c), [ans] = CITIES.capitals[c];
      return { key: c, prefs: [c], focus: c, sub: c === 13 ? "とうきょうとちょう" : p.kana, choices: CITIES.capitals[c], correct: ans[0],
        text: c === 13 ? `<em>東京都庁</em>がある区は？` : `<em>${p.name}</em>の${p.office}所在地は？`,
        explain: c === 13 ? `東京都庁は ${ans[0]}（${ans[1]}）にあります` : `${p.name}の${p.office}所在地は ${ans[0]}（${ans[1]}）` };
    })
  },
  terrain: {
    title: "山・河川・平野", kind: "choice",
    // area.cat（mount／river／plain）の図形を出題。選択肢は同じ種類からほかに3つ
    make: (codes, area) => TERRAIN.filter(f => !area || !area.cat || f.cat === area.cat).map(f => {
      const pool = shuffle(TERRAIN.filter(g => g.cat === f.cat && g.id !== f.id)).slice(0, 3);
      return { key: f.id, prefs: [f.pref], focus: f.pref, feature: f.id, sub: "", choices: [[f.name, f.kana], ...pool.map(g => [g.name, g.kana])], correct: f.name,
        text: `この<em>${TERRAIN_CATS[f.cat]}</em>の名前は？`, explain: `${f.name}（${f.kana}）` };
    })
  },
  industry: {
    title: "農林水産業・工業", kind: "tap",
    // area.cat（farm／fruit／sea／maker／craft）の問題。地図で答えの都道府県をタップ
    // 出題停止（status:"stop"）の問題は出さない。出題数・完了・👑の判定もこの数で行う
    make: (codes, area) => industryLive().filter(f => (!area || !area.cat || f.cat === area.cat) && codes.includes(f.pref)).map(f => (
      { key: f.id, prefs: [f.pref], text: f.q || INDUSTRY_CATS[f.cat].ask(f.word), sub: f.kana, answers: [f.pref], explain: f.note }))
  },
  designated: {
    title: "政令指定都市", kind: "tap",
    make: codes => CITIES.designated.map((d, i) => [d, i]).filter(([d]) => codes.includes(d[2])).map(([[name, kana, c], i]) => (
      { key: i, prefs: [c], text: `<em>${name}</em>がある都道府県は？`, sub: kana, answers: [c],
        explain: `${name}（${kana}）は ${byCode(c).name}の政令指定都市` }))
  }
};

/* ---------- 農林水産業・工業（産業）。地図の都道府県をタップして答える ----------
   1問 = 1オブジェクト。毎年の統計更新では year・note・source・url・checked を書きかえ、status で出す／止めるを決める
     id      問題ID（保存データの got/clean/miss のキー。変えない）
     cat     ステージ（INDUSTRY_CATS のキー）
     word    問題のことば（farm/fruit/craft はステージの決まった問い方に入る。sea/maker は問題文そのもの）
     q       問い方を個別に変えるときの問題文（統計年を入れる・指標をかえるなど。なければ word から作る）
     kana    よみ（問題文の下に出る）
     pref    答えの都道府県コード（1〜47。答えは1つだけ）
     note    正解後の解説（確認できた事実だけ書く）
     basis   正解の根拠になる指標
     year    統計の対象年（公表日ではない）
     source  出典の正式名称 ／ url 出典URL ／ checked 最終確認日
     status  "ok"＝確認済み（出題する） "check"＝要確認（出題する。答えは確認済みだが、解説・年次などに確認が残る） "stop"＝出題停止（出題しない）
   答えが1県に決まるものだけ入れる。僅差で入れかわる品目（茶・キャベツ・日本なし・さつまいも・ほたて・真珠など）は入れない */
const INDUSTRY_CATS = {
  farm:  {name:"農業（米・野菜・花）", ask: w => `<em>${w}</em>の収穫量が全国一の都道府県は？`},
  fruit: {name:"くだもの", ask: w => `<em>${w}</em>の収穫量が全国一の都道府県は？`},
  sea:   {name:"畜産・林業・水産業", ask: w => w},
  maker: {name:"工業地帯・地場産業", ask: w => w},
  craft: {name:"伝統工芸品", ask: w => `<em>${w}</em>がつくられている都道府県は？`},
};
const IND_CHECKED = "2026-11-02";
const SRC = {
  gaiyou: n => ({source: "農林水産省「都道府県の農林水産業の概要（令和7年版）」", url: `https://www.maff.go.jp/j/kanbo/tiho/15sonota/todouhuken_gaiyou2025-${String(n).padStart(2, "0")}.pdf`}),
  meti: {source: "経済産業省「伝統的工芸品指定品目一覧［都道府県別］」（令和7年10月27日現在）", url: "https://www.meti.go.jp/press/2025/10/20251027001/20251027001-b.pdf"},
};
const INDUSTRY = [
  // ---- 農業（米・野菜・花） ----
  {id:"rice", cat:"farm", word:"米", kana:"こめ", pref:15, note:"新潟県（令和7年産で全国一）。2位は北海道、3位は秋田県",
   basis:"水稲の収穫量（主食用）", year:"令和7年産", source:"農林水産省「作物統計調査 令和7年産水陸稲の収穫量」", url:"https://www.maff.go.jp/j/tokei/kouhyou/sakumotu/sakkyou_kome/pdf/syukaku_suiriku_25.pdf", status:"ok"},
  {id:"potato", cat:"farm", word:"じゃがいも", kana:"", pref:1, note:"北海道（令和7年産の春植えばれいしょで全国の82％）。2位は鹿児島県",
   basis:"春植えばれいしょの収穫量", year:"令和7年産", source:"農林水産省「作物統計調査 令和7年産春植えばれいしょの作付面積、収穫量及び出荷量」", url:"https://www.maff.go.jp/j/tokei/kouhyou/sakumotu/sakkyou_yasai/pdf/syukaku_barei_25.pdf", status:"ok"},

   basis:"たまねぎの収穫量", year:"令和5年産（令和6・7年産の都道府県別は未確認）", ...SRC.gaiyou(1), status:"check"},

   basis:"ピーマンの収穫量", year:"令和5年産", ...SRC.gaiyou(8), status:"ok"},
  {id:"strawberry", cat:"farm", word:"いちご", kana:"", pref:9, note:"栃木県（令和5年産で全国一。2位の福岡県の約1.5倍）。「とちおとめ」「とちあいか」などの品種がある",
   basis:"いちごの収穫量", year:"令和5年産", ...SRC.gaiyou(9), status:"ok"},

   basis:"らっかせいの収穫量", year:"未確認（令和7年版の概要に掲載の年次）", ...SRC.gaiyou(12), status:"check"},
  {id:"konjac", cat:"farm", word:"こんにゃくいも", kana:"", pref:10, note:"群馬県（全国の9割以上）",

  {id:"sugarcane", cat:"farm", word:"さとうきび", kana:"", pref:47, note:"沖縄県（令和5年産で全国の半分以上）。県のほぼ全域でつくる大事な作物。さとうきびは沖縄県と鹿児島県でつくられている",
   basis:"さとうきびの収穫量", year:"令和5年産", ...SRC.gaiyou(47), status:"ok"},
  {id:"chrysanthemum", cat:"farm", word:"菊", q:"<em>菊</em>（切り花）の出荷量が全国一の都道府県は？（令和6年産）", kana:"きく", pref:23,

   basis:"きく（切り花）の出荷量", year:"令和6年産", source:"農林水産省「令和6年産花きの作付（収穫）面積及び出荷量」", url:"https://www.maff.go.jp/j/tokei/kekka_gaiyou/sakumotu/sakkyou_kaki/sakutuke/r6/index.html", status:"ok"},
  // ---- くだもの ----
  {id:"apple", cat:"fruit", word:"りんご", kana:"", pref:2, note:"青森県（令和7年産で全国の61％）。2位は長野県",
   basis:"りんごの収穫量", year:"令和7年産", source:"農林水産省「作物統計調査 令和7年産りんごの栽培面積、結果樹面積、収穫量及び出荷量」", url:"https://www.maff.go.jp/j/tokei/kouhyou/sakumotu/sakkyou_kazyu/pdf/syukaku_ringo_25.pdf", status:"ok"},
  {id:"mikan", cat:"fruit", word:"みかん", kana:"", pref:30, note:"和歌山県（令和7年産で全国の22％。22年連続で全国一）。2位は愛媛県、3位は静岡県",
   basis:"みかんの収穫量", year:"令和7年産", source:"農林水産省「作物統計調査 令和7年産みかんの栽培面積、結果樹面積、収穫量及び出荷量」", url:"https://www.maff.go.jp/j/tokei/kouhyou/sakumotu/sakkyou_kazyu/pdf/syukaku_mikan_25.pdf", status:"ok"},
  {id:"grape", cat:"fruit", word:"ぶどう", kana:"", pref:19, note:"山梨県（令和7年産で全国の26％）。2位は長野県",

  {id:"peach", cat:"fruit", word:"もも", kana:"", pref:19, note:"山梨県（令和7年産で全国の32％）。2位は福島県",
   basis:"ももの収穫量", year:"令和7年産", source:"農林水産省「作物統計調査 令和7年産もも、すももの栽培面積、結果樹面積、収穫量及び出荷量」", url:"https://www.maff.go.jp/j/tokei/kouhyou/sakumotu/sakkyou_kazyu/pdf/syukaku_momo_25.pdf", status:"ok"},
  {id:"cherry", cat:"fruit", word:"さくらんぼ", kana:"", pref:6, note:"山形県（令和7年産のおうとう＝さくらんぼで全国の74％）",

  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    gesture = {type:"pinch", d0: Math.hypot(a.x-b.x, a.y-b.y), v:{...view}, m: svgPt(mid.x, mid.y)};
  }
});
svg.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const b = box();
  if (gesture.type === "pinch" && ptrs.size >= 2) {
    const [p, q] = [...ptrs.values()];
    const d = Math.max(10, Math.hypot(p.x-q.x, p.y-q.y));
    const w = Math.max(70, Math.min(1400, gesture.v.w * gesture.d0 / d));
    const mx = ((p.x+q.x)/2 - b.l) / b.w, my = ((p.y+q.y)/2 - b.t) / b.h;
    setView(gesture.m.x - mx*w, gesture.m.y - my*(w*b.h/b.w), w);
  } else if (gesture.type !== "pinch") {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (gesture.type === "tap" && Math.hypot(dx, dy) > 10) gesture.type = "pan";
    if (gesture.type === "pan") setView(gesture.v.x - dx/b.w*gesture.v.w, gesture.v.y - dy/b.h*gesture.v.h, gesture.v.w);
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && gesture.type === "tap" && e.type === "pointerup") {
    if (gesture.zoom) zoomArea(gesture.zoom);
    else if (gesture.code) handleTap(gesture.code);
  }
  if (ptrs.size === 0) gesture = null;
  else if (gesture && gesture.type === "pinch") gesture = {type:"pan-locked"};
}
svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const m = svgPt(e.clientX, e.clientY), k = Math.exp(e.deltaY * 0.0015), b = box();
  const w = Math.max(70, Math.min(1400, view.w * k));
  setView(m.x - (m.x - view.x) * w / view.w, m.y - (m.y - view.y) * w / view.w, w);
}, {passive:false});
// 地図の枠の大きさが変わったら（シートの高さが変わる等）、中心と縮尺を保って合わせる
new ResizeObserver(() => { const cx = view.x + view.w/2, cy = view.y + view.h/2, b = box(); setView(cx - view.w/2, cy - (view.w*b.h/b.w)/2, view.w); }).observe(svg);
// 画面を描き終えてから表示範囲を合わせる
const fitLater = bb => requestAnimationFrame(() => requestAnimationFrame(() => fitBox(bb)));

["pointerup","pointercancel","lostpointercapture"].forEach(t => eye.addEventListener(t, eyeOff));
eye.addEventListener("contextmenu", e => e.preventDefault());

function showTag(code, text) {

  const tx = document.createElementNS(NS, "text");

/* デバッグ（DBG）：暗証番号を入れると ON。ON の間は全コース・全ステージが👑マスター済みのお試し記録になり、
   「テスト」で今いる画面の単位を初めての状態に戻して遊べる。本当の記録には書かない。OFF は1タップ。保存はせず再読み込みで OFF */
const DEBUG_PIN = "8282";
let screenNow = {kind: "title"};   // 今いるホーム系の画面（テスト・切り替え後の描き直しに使う）
function titleBtn(){ return `<button class="iconbtn" id="toTitle" type="button" aria-label="タイトル画面へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>タイトル</span></button>`; }
function debugBtn(){
  return `<span class="dbgbox" id="dbgbox"><button class="iconbtn${debug ? " dbg-on" : ""}" id="dbg" type="button" aria-pressed="${debug}" aria-label="デバッグモード">DBG</button>${debug ? `<button class="iconbtn" id="dbgTest" type="button" aria-label="この画面を初めての状態にする">テスト</button>` : ""}</span>`;
}
// お試し記録：全モード・全コースで、全問正解・全ステージ👑・👑マスター・完了
function fullRecs() {
  const R = {};
  MODES.forEach(m => { R[m.id] = {}; COURSES.filter(c => c.ready).forEach(c => {
    const type = QUIZ_TYPES[c.id], all = Object.fromEntries(type.make(range(1,47)).map(q => [q.key, 1]));
    R[m.id][c.id] = { got: {...all}, clean: {...all}, miss: {}, complete: true, master: {at: 0, clean: true},
      best: Object.fromEntries([...stagesOf(c).map(a => [a.id, type.make(a.codes, a).length]), ["zenkoku", Object.keys(all).length]]),
      stage: Object.fromEntries(stagesOf(c).map(a => [a.id, {complete: true, master: {at: 0}}])) };
  }); });
  return R;
}
// 切り替え・テストのあとに今の画面を描き直す。クイズ中と結果はボタンだけ差し替える
function rerender() {
  if (mode === "quiz" || mode === "result") { byId("dbgbox").outerHTML = debugBtn(); return bindDbg(); }
  if (screenNow.kind === "course") coursePage(screenNow.c); else if (screenNow.kind === "home") home(); else modeSelect();
}
// テスト：今いる画面の単位を初めての状態に戻す（クイズ中・結果ならその区切りを1問目からやり直す）
function testSection() {
  if (mode === "quiz" || mode === "result") {
    const c = quiz.course, a = quiz.area, o = Object.assign({}, quiz.opts); o.keys = undefined;
    MODES.forEach(m => { const r = (dbgRec[m.id] || {})[c.id]; if (!r) return;
      if (quiz.stage) { r.stage[a.id] = undefined; r.master = null; r.complete = false; } else dbgRec[m.id][c.id] = undefined; });
    return startQuiz(c, a, a.codes, o);
  }
  if (screenNow.kind === "course") MODES.forEach(m => { if (dbgRec[m.id]) dbgRec[m.id][screenNow.c.id] = undefined; });
  else dbgRec = {};
  rerender();
}
function bindDbg() {
  const d = byId("dbg");
  if (d) d.onclick = () => {
    if (debug) { debug = false; dbgRec = null; return rerender(); }
    askPin(() => { debug = true; dbgRec = fullRecs(); rerender(); });
  };
  const tb = byId("dbgTest"); if (tb) tb.onclick = testSection;
}
// 暗証番号の入力（4けた）。ブラウザのダイアログは使わない
function askPin(onOk) {
  const ov = document.createElement("div");
  ov.className = "pin";
  ov.innerHTML = `<div class="pin-box" role="dialog" aria-modal="true" aria-label="デバッグの暗証番号">
    <b>暗証番号</b><div class="pin-dots">${"<i></i>".repeat(4)}</div><p class="hint" id="pinMsg">4けたの数字を入れてね</p>
    <div class="pin-keys">${["1","2","3","4","5","6","7","8","9","","0","back"].map(k => k ? `<button class="btn" type="button" data-k="${k}"${k === "back" ? ` aria-label="1文字けす"` : ""}>${k === "back" ? "←" : k}</button>` : "<span></span>").join("")}</div>
    <button class="linkbtn" type="button" id="pinCancel">やめる</button></div>`;
  document.body.appendChild(ov);
  let v = "";
  const dots = ov.querySelectorAll(".pin-dots i"), msg = ov.querySelector("#pinMsg");
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const press = k => {
    v = k === "back" ? v.slice(0, -1) : (v + k).slice(0, 4);
    dots.forEach((d, i) => d.classList.toggle("on", i < v.length));
    if (v.length < 4) return;
    if (v === DEBUG_PIN) { close(); onOk(); }
    else { msg.textContent = "ちがうよ。もう一回"; v = ""; dots.forEach(d => d.classList.remove("on")); }
  };
  const onKey = e => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("back"); else if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.querySelectorAll("[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
  ov.querySelector("#pinCancel").onclick = close;
}

function courseStatus(c) {
  if (!c.ready) return {text: "準備中", off: true};
  if (!inMode(c)) return {text: `${modeOf(c.from).name}から`, off: true};
  if (!unlocked(c)) {
    const pre = courseOf(c.unlock.course);
    return {text: c.unlock.need === "master" ? `${crown(pre)}で開く` : `${pre.name}の全国の挑戦を終えると開く`, off: true};
  }
  const m = masterOf(c.id);
  if (m) return {text: crown(c), done: true};
  if (c.stages) return {text: `ステージ👑 ${stageCrowns(c.id)} / ${stagesOf(c).length}`};
  const got = new Set(); recsOf(c.id).forEach(r => Object.keys(r.got).forEach(k => got.add(k)));
  return {text: `正解した問題 ${got.size} / ${fullCount(c.id)}`};
}

/* コース：全国の挑戦（マスター判定あり）と、地方ごとの練習 */
function coursePage(c) {
  toHomeScreen(); screenNow = {kind: "course", c};
  const type = QUIZ_TYPES[c.id], total = fullCount(c.id), m = masterOf(c.id), zen = AREAS.find(a => a.wide);
  const best = Object.assign({}, ...recsOf(c.id).map(r => r.best));
  top_.innerHTML = `${titleBtn()}<div class="brand">${c.name}<small>${curMode().name}</small></div>${debugBtn()}<button class="iconbtn" id="back" type="button">もどる</button>`;
  bindBar(); byId("back").onclick = home;
  const regions = (c.stages ? stagesOf(c) : STAGES).map(a => ({a, n: type.make(a.codes, a).length})).filter(x => x.n > 0);
  sheet.innerHTML = `
    <div class="modebar">${m ? `<span class="medal">${crown(c)}</span>` : ""}</div>
    ${c.stages ? "" : `<div class="chips"><button class="chip wide" type="button" id="master">全国の挑戦<small>${total}問${best.zenkoku != null ? `・ベスト ${best.zenkoku}/${total}` : ""}</small></button></div>`}
    <h2>${c.stages ? `${c.stageList ? "" : "地方"}ステージ（👑 ${stageCrowns(c.id)} / ${stagesOf(c).length}）` : "地方ごとの練習"}</h2>
    <div class="chips">${regions.map(({a, n}) => {
      // 県名タップは v4 の地方ベスト（store.best）も参考に出す
      const b = Math.max(best[a.id] ?? -1, c.id === "prefName" ? (store.best[a.id] ?? -1) : -1);
      const cr = c.stages && stageDone(c.id, a.id, "master") ? "👑" : "";
      return `<button class="chip" type="button" data-area="${a.id}">${a.name}<small>${cr}${b >= 0 ? `ベスト ${b}/${n}` : `${n}問`}</small></button>`;
    }).join("")}</div>
    <h2>このコースのきまり</h2>
    <ul class="rules">${c.rules.map(r => `<li>${r}</li>`).join("")}<li>目のボタン（ヒント）を1回でも使うと👑マスターにはならない（正解は記録に残り、地図の色もつく）</li></ul>`;
  if (!c.stages) byId("master").onclick = () => startQuiz(c, zen, zen.codes, {master: true});
  sheet.querySelectorAll("[data-area]").forEach(b => b.onclick = () => { const a = (c.stages ? stagesOf(c) : AREAS).find(x => x.id === b.dataset.area); startQuiz(c, a, a.codes, {stage: !!c.stages}); });
}

function showInfo(code) {
  const p = byCode(code);
  if (selected) pathEl[selected].classList.remove("sel");
  selected = code; pathEl[code].classList.add("sel"); toFront(code);

  if (info) info.innerHTML = `<span class="nm">${p.name}</span><span class="sub">${p.kana}・${p.region}・${capitalLabel(p)}</span>`;

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

// opts.master：全国の挑戦（完了・マスター判定の対象）／opts.keys：まちがえた問題だけ（判定の対象外）
function startQuiz(course, area, codes, opts={}) {
  cancelQuizTimers(); eyeOff();
  const type = QUIZ_TYPES[course.id];
  sheet.classList.remove("home"); showFeature(null);
  mode = "quiz"; selected = null; clearTag(); clearmsg.hidden = true; bgmStart(); JapanMap.resetColors(); svg.classList.remove("explore");
  const inArea = new Set(area.codes);
  PREFS.forEach(p => { pathEl[p.code].classList.toggle("off", !inArea.has(p.code)); labelEl[p.code].classList.toggle("off", !inArea.has(p.code)); });
  homeBox = area.wide ? FULL : unionBox(area.codes); fitLater(homeBox);
  svg.classList.toggle("region-quiz", !area.wide);
  let qs = type.make(codes, area);
  if (opts.keys) qs = qs.filter(q => opts.keys.includes(q.key));
  const master = !!opts.master && !opts.keys && area.wide && qs.length === fullCount(course.id);
  const stage = !!opts.stage && !opts.keys && !!course.stages && !area.wide;
  quiz = { course, type, area, opts, master, stage, modeId: curMode().id, qs: shuffle(qs), i: 0, combo: 0, maxCombo: 0, log: [], inArea };
  nextQ();
}

// 進み具合：未回答＝薄い墨／いま＝黄（背が高い）／正解＝緑／ヒントあり正解＝緑の斜線／不正解＝赤
const pbar = document.getElementById("pbar");
function renderProgress(){
  pbar.innerHTML = quiz ? quiz.qs.map((q,i) => {
    const l = quiz.log[i]; return `<i class="${l ? (l.ok ? (l.hint ? "hintd" : "ok") : "ng") : (i === quiz.i ? "now" : "")}"></i>`;
  }).join("") : "";
}

// 下段に出す出題文（問題文＋よみ）
// よみ（sub）は、問題文の黄色い語（最初の <em>）の上にふりがなとして付ける。<em> がないときだけ下の行に出す
function askText(q) {
  if (!q.sub || !/<em>/.test(q.text)) return {html: q.text, under: q.sub || ""};
  return {html: q.text.replace(/<em>(.*?)<\/em>/, (m, w) => `<em><ruby>${w}<rt>${q.sub}</rt></ruby></em>`), under: ""};
}
const askBlock = () => { const t = askText(quiz.q); return `<div class="ask"><span class="q${quiz.q.text.replace(/<[^>]+>/g, "").length > 18 ? " long" : ""}">${t.html}</span>${t.under ? `<span class="kana">${t.under}</span>` : ""}</div>`; };

function nextQ() {
  eyeOff(); clearTag();
  if (quiz.i >= quiz.qs.length) return result();
  const q = quiz.q = quiz.qs[quiz.i]; q.hint = false; quiz.answered = false;
  // 出題文はどのコースも下段（シート）に置き、上のバーには進み具合だけを出す。4択は出題文のすぐ下に選択肢
  // 上の帯：左端に✕（やめる）、小さい文字で「関東　3 / 7」、右に DBG とタイトルへ戻る家のボタン
  top_.innerHTML = `<button class="iconbtn" id="quit" type="button" aria-label="やめる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="ask"><span class="meta"><span class="nm">${quiz.master ? "全国の挑戦" : quiz.stage ? `${quiz.area.name}ステージ` : quiz.area.name}</span><span class="num">${quiz.i+1} / ${quiz.qs.length}</span></span></div>${debugBtn()}${titleBtn()}`;
  renderProgress();
  bindBar(); byId("quit").onclick = home;
  if (quiz.type.kind === "choice") {
    // 対象の都道府県を地図で示し、選択肢の並びは毎回まぜる
    Object.values(pathEl).forEach(p => p.classList.remove("sel", "ok", "miss"));
    if (q.feature) {
      showFeature(q.feature);
      const b = TERRAIN.find(f => f.id === q.feature).b, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, h = Math.max(b[2] - b[0], b[3] - b[1], 160) / 2;
      fitLater([cx - h, cy - h, cx + h, cy + h]);
    } else {
      pathEl[q.focus].classList.add("sel");
      if (quiz.area.wide) fitLater(unionBox(areaOfPref(q.focus).codes));
    }
    q.order = shuffle(q.choices);
    sheet.innerHTML = `${askBlock()}<div class="choices">${q.order.map(([n, k], j) =>
      `<button class="choice" type="button" data-j="${j}">${n}<small>${k}</small></button>`).join("")}</div>`;
    const owner = quiz;
    sheet.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { if (quiz === owner && mode === "quiz") answerChoice(+b.dataset.j); });
  } else {
    sheet.innerHTML = `${askBlock()}<p class="hint">地図の県をタップしてね。わからない時は目のボタン（押している間だけ県名）。</p>`;
  }
}

// 1問の正誤を記録する。正解は got に積むだけで、まちがえても消えない
function logAnswer(ok) {
  const q = quiz.q, r = rec(quiz.modeId, quiz.course.id);
  quiz.log[quiz.i] = {ok, hint: q.hint, key: q.key, pref: q.prefs[0]};
  if (ok) { r.got[q.key] = 1; if (!q.hint) r.clean[q.key] = 1; }
  else r.miss[q.key] = (r.miss[q.key] || 0) + 1;
  save();
}

// 解説が答えの名前で始まるとき（「静岡県。…」）は、上の行と重ならないようにその部分を省く
const trimLead = (text, name) => text && text.startsWith(name + "。") ? text.slice(name.length + 1) : (text || "");

// 正誤の記号の丸。キャラクターの顔アイコンに差し替えるときは、ここだけ変えればよい
const face = state => `<div class="face" aria-hidden="true">${state === "ok" ? "◯" : "✕"}</div>`;

function noteHtml(code) {
  const ns = GEO_NOTES[code] || [];
  return ns.map(n => `<span>【${GEO_THEMES[n.theme] || ""}】${n.text}</span>`).join("");
}

function afterAnswer(ok, html) {
  const q = quiz.q;
  if (ok) {
    sndOk();
    if (q.hint) quiz.combo = 0; else { quiz.combo++; quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo); }
    if (quiz.combo >= 2) { combo.textContent = `${quiz.combo}れんぞく！`; combo.hidden = false; combo.classList.remove("pop"); void combo.offsetWidth; combo.classList.add("pop"); }
    else combo.hidden = true;
  } else {
    sndNg(); quiz.combo = 0; combo.hidden = true;
  }
  // 正解でも不正解でも、説明を読んでから「つぎへ」で進む（自動では進まない）
  sheet.insertAdjacentHTML("beforeend", `${html}<div class="row"><button class="btn primary" id="next" type="button">つぎへ</button></div>`);
  const owner = quiz;
  byId("next").onclick = () => { if (quiz !== owner || mode !== "quiz") return; Object.values(pathEl).forEach(p => p.classList.remove("reveal", "flash-ng")); quiz.i++; nextQ(); };
}

function answerChoice(j) {
  if (quiz.answered) return;
  const q = quiz.q, pick = q.order[j], ok = pick[0] === q.correct;
  quiz.answered = true; eyeOff();
  logAnswer(ok);
  sheet.querySelectorAll("[data-j]").forEach(b => {
    const c = q.order[+b.dataset.j]; b.disabled = true;
    if (c[0] === q.correct) b.classList.add("right"); else if (+b.dataset.j === j) b.classList.add("wrong");
  });
  renderProgress();
  const ans = q.choices[0], desc = trimLead(q.explain, ans[0]);
  afterAnswer(ok, ok
    ? `<div class="fb ok">${face("ok")}<div class="txt"><b>せいかい！ ${ans[0]}</b><span class="desc">${q.hint ? "（ヒントを見て正解）" : ""}${desc}</span>${noteHtml(q.focus)}</div></div>`
    : `<div class="fb ng">${face("ng")}<div class="txt"><span class="head"><b>ざんねん</b>　正解は <em>${ans[0]}</em>。キミが選んだのは ${pick[0]}。</span><span class="desc">${desc}</span>${noteHtml(q.focus)}</div></div>`);
}

function handleTap(code) {
  tapHandlers.forEach(cb => { try { cb(code); } catch(e){} });
  if (mode === "home") return showInfo(code);
  if (mode !== "quiz" || quiz.type.kind !== "tap" || quiz.answered || !quiz.inArea.has(code)) return;
  const q = quiz.q, ok = q.answers.includes(code);
  quiz.answered = true; eyeOff();
  const p = byCode(code), ans = byCode(q.answers[0]);
  logAnswer(ok);
  if (quiz.course.id === "prefName" && !ok) { store.miss[ans.code] = (store.miss[ans.code] || 0) + 1; save(); }
  sheet.innerHTML = askBlock();   // 正誤を出しても出題文は残す
  renderProgress();
  if (ok) {
    pathEl[code].classList.add("flash-ok");
    quizTimeout(() => { pathEl[code].classList.remove("flash-ok"); pathEl[code].classList.add("ok"); }, 450);
    afterAnswer(true, `<div class="fb ok">${face("ok")}<div class="txt"><b>せいかい！ ${ans.name}</b><span class="desc">${q.hint ? "（ヒントを見て正解）" : ""}${trimLead(q.explain, ans.name)}</span>${noteHtml(ans.code)}</div></div>`);
  } else {
    pathEl[code].classList.add("flash-ng"); showTag(code, p.short);
    pathEl[ans.code].classList.add("miss");
    JapanMap.highlightPrefecture(ans.code);
    afterAnswer(false, `<div class="fb ng">${face("ng")}<div class="txt"><span class="head"><b>ざんねん</b>　正解は <em>${ans.name}</em>。キミが指したのは ${p.name}。</span><span class="desc">${trimLead(q.explain, ans.name)}</span>${noteHtml(ans.code)}</div></div>`);
  }
}

function result() {
  cancelQuizTimers(); eyeOff();
  Object.values(pathEl).forEach(p => p.classList.remove("flash-ok", "flash-ng", "reveal"));
  pbar.innerHTML = ""; showFeature(null);
  // 正解した県の色は、途中の遅延処理が取り消されても結果画面で付けそろえる
  if (quiz.type.kind === "tap") quiz.log.forEach(l => l.ok && pathEl[l.pref].classList.add("ok"));
  mode = "result"; bgmStop(); combo.hidden = true; clearTag();
  const course = quiz.course, total = quiz.qs.length, correct = quiz.log.filter(l => l.ok).length, clean = quiz.log.filter(l => l.ok && !l.hint).length;
  const missed = quiz.log.filter(l => !l.ok);
  const r = rec(quiz.modeId, course.id);
  const before = COURSES.filter(c => c.ready && inMode(c) && !unlocked(c)).map(c => c.id);
  let newMaster = null, newStage = false;
  if (quiz.stage) {
    // 地方ステージを最後まで解いた。ヒントなしで全問正解ならそのステージに👑。全ステージ👑でコースの👑マスター
    const area = quiz.area, s = r.stage[area.id] = Object.assign({complete: false, master: null}, r.stage[area.id]);
    s.complete = true;
    r.best[area.id] = Math.max(r.best[area.id] ?? 0, clean);
    if (clean === total && !stageDone(course.id, area.id, "master")) { s.master = {at: Date.now()}; newStage = true; }
    if (stagesOf(course).every(a => stageDone(course.id, a.id, "complete"))) r.complete = true;
    if (stagesOf(course).every(a => stageDone(course.id, a.id, "master")) && !masterOf(course.id)) { newMaster = {at: Date.now(), clean: true}; r.master = newMaster; }
  } else if (quiz.master) {
    // 全国の挑戦を最後まで解いた。47（または全都市）を重複なく、ヒントなしで全問正解したときだけ👑マスター
    r.complete = true;
    r.best.zenkoku = Math.max(r.best.zenkoku ?? 0, clean);
    const keys = new Set(quiz.log.map(l => l.key));
    if (clean === total && keys.size === total && total === fullCount(course.id) && !isMaster(r)) {
      newMaster = {at: Date.now(), clean: true}; r.master = newMaster;
    }
  } else if (!quiz.opts.keys && !quiz.area.wide) {
    r.best[quiz.area.id] = Math.max(r.best[quiz.area.id] ?? 0, clean);
  }
  save();
  const opened = COURSES.filter(c => before.includes(c.id) && unlocked(c));
  const msg = newMaster ? `${crown(course)}！` : newStage ? `👑${quiz.area.name}ステージ クリア！` : clean === total ? "パーフェクト！" : correct === total ? "全問正解！ ヒントなしで👑マスター" : missed.length <= 2 ? "あと少し！ まちがえた問題をもう一回" : "まちがえた問題だけ、くりかえそう";
  const nextStage = quiz.stage ? stagesOf(course)[stagesOf(course).indexOf(quiz.area) + 1] : null;
  const label = l => course.id === "terrain" ? TERRAIN.find(f => f.id === l.key).name : course.id === "industry" ? `${industryName(industryOf(l.key))}（${byCode(l.pref).name}）` : course.id === "designated" ? CITIES.designated[l.key][0] : course.id === "capital" ? `${byCode(l.pref).name}（${CITIES.capitals[l.pref][0][0]}）` : byCode(l.pref).name;
  top_.innerHTML = `${titleBtn()}<div class="ask"><span class="meta"><span class="nm">${course.name}・${quiz.master ? "全国の挑戦" : quiz.stage ? `${quiz.area.name}ステージ` : quiz.area.name}</span><span class="num">けっか</span></span></div>${debugBtn()}${muteBtn()}`;
  bindBar();
  clearmsg.firstChild.textContent = msg.replace(" ", "\n"); clearmsg.hidden = false;
  sheet.innerHTML = `
    <div class="score"><span class="big">${correct}<small style="font-size:1.2rem"> / ${total}</small></span><span class="msg">ヒントなし正解 ${clean}問・最高 ${quiz.maxCombo}れんぞく</span></div>
    ${newStage || newMaster ? `<div class="modebar">${newStage ? `<span class="medal">👑${quiz.area.name}ステージ</span>` : ""}${newMaster ? `<span class="medal">${crown(course)}</span>` : ""}</div>` : ""}
    ${opened.map(c => `<p class="hint"><b>「${c.name}」コースが開いたよ！</b></p>`).join("")}
    ${missed.length ? `<h2>まちがえた問題</h2><div class="misslist">${missed.map(l => `<span>${label(l)}</span>`).join("")}</div>` : ""}
    <div class="row">
      ${missed.length ? `<button class="btn primary" id="retryMiss" type="button">まちがえた問題だけ もう一回</button>` : ""}
      <button class="btn${missed.length ? "" : " primary"}" id="retry" type="button">もう一回</button>
      ${nextStage ? `<button class="btn" id="nextStage" type="button">つぎのステージ（${nextStage.name}）</button>` : ""}
      <button class="btn" id="back" type="button">コースにもどる</button>
    </div>`;
  const area = quiz.area, opts = quiz.opts, missKeys = missed.map(l => l.key);
  if (nextStage) byId("nextStage").onclick = () => startQuiz(course, nextStage, nextStage.codes, {stage: true});
  if (missed.length) byId("retryMiss").onclick = () => startQuiz(course, area, area.codes, {keys: missKeys});
  byId("retry").onclick = () => startQuiz(course, area, area.codes, opts);
  byId("back").onclick = () => coursePage(course);
}

window.addEventListener("load", home);
if (document.readyState === "complete") home();
</script>
