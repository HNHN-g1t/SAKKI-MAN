<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サッ記マン</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #fffdf5; --fg: #222; --card: #fff; --line: #e3dccb; --accent: #e8590c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --fg: #eee; --card: #222226; --line: #3a3a40; --accent: #ff8a3d; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p { margin: 0 0 24px; opacity: .7; }
  a { display: block; padding: 18px 16px; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; color: inherit; text-decoration: none; font-weight: 700; font-size: 18px; }
  a span { display: block; font-weight: 400; font-size: 14px; opacity: .7; margin-top: 4px; }
  a:active { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>サッ記マン</h1>
  <p>サッと記憶、サッ記マン！</p>
  <a href="japan-map-quiz/">日本地図タップクイズ<span>出された県を地図でタップ</span></a>
</main>
</body>
</html>
