<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サッと記憶！サッ記マン</title>
<!-- ?v= はスマホのアイコンの覚え込み対策。画像を差し替えたら数字を上げる -->
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="title-1f.webp?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* タイトル画面：絵（title-1f.webp、元は docs/images/タイトル画面1F.png）を画面いっぱいに置き、
     絵の下のあいている帯（上から74%より下）に「はじめる」ボタンを重ねる。
     絵の地の色（#EFEAE9）で外側も塗るので、横長の画面でも絵のまわりが目立たない */
  :root { --title-bg: #EFEAE9; --pin: #FF4FA3; }
  html, body { margin: 0; height: 100%; background: var(--title-bg); }
  body { display: grid; place-items: center; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  /* 絵の縦横比（1179×2556）のまま、画面に収まる大きさにする */
  .stage { position: relative; height: 100vh; height: 100dvh; aspect-ratio: 1179 / 2556; max-width: 100vw;
    background: url("title-1f.webp?v=1") center / contain no-repeat; }
  @supports not (aspect-ratio: 1 / 1) { .stage { width: 100vw; } }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
  /* はじめる：ピンクの線の角丸に、ピンクの文字 */
  .start { position: absolute; left: 50%; top: 84%; transform: translate(-50%, -50%);
    display: grid; place-items: center; min-width: 52%; padding: .55em 1.4em; box-sizing: border-box;
    border: 3px solid var(--pin); border-radius: 999px; background: transparent; color: var(--pin);
    font: 400 clamp(22px, 6.4vmin, 34px)/1 "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
    letter-spacing: .08em; text-decoration: none; white-space: nowrap; }
  .start:active { transform: translate(-50%, -50%) scale(.96); }
  .start:focus-visible { outline: 3px solid #282727; outline-offset: 4px; }
</style>
</head>
<body>
<main class="stage">
  <h1>サッと記憶！サッ記マン 〜中学受験・社会〜</h1>
  <a class="start" href="japan-map-quiz/">はじめる</a>
</main>
</body>
</html>
